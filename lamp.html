// ---------- Helpers ----------
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } }
function store(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
  if (key !== "lamp.badges") queueBadges();
}

// Lowercases and strips accents without changing the string's length, so match positions line up with the original text.
function fold(s) {
  let low = s.toLowerCase();
  if (low.length !== s.length) low = Array.from(s, ch => { const l = ch.toLowerCase(); return l.length === ch.length ? l : ch; }).join("");
  return low.replace(/[^\x00-\x7f]/gu, ch => {
    if (ch === "’") return "'";
    const f = ch.normalize("NFD").replace(/\p{M}/gu, "");
    return f.length === ch.length ? f : ch;
  });
}
// For matching typed feelings: accents, apostrophes and punctuation all become plain spaces.
const words = s => " " + fold(s).replace(/[^\p{L}\p{N}]+/gu, " ").trim() + " ";

// ---------- Language and Bible version ----------
const VERSIONS = {
  kjv: { short: "KJV", name: "King James Version", lang: "en", file: "kjv.json" },
  bsb: { short: "BSB", name: "Berean Standard Bible", lang: "en", file: "bsb.json" },
  web: { short: "WEB", name: "World English Bible", lang: "en", file: "web.json" },
  lsg: { short: "LSG", name: "Louis Segond 1910", lang: "fr", file: "lsg.json" },
};
const DEFAULT_VER = { en: "kjv", fr: "lsg" };
let lang = load("lamp.lang", null) || ((navigator.language || "en").toLowerCase().startsWith("fr") ? "fr" : "en");
if (!T[lang]) lang = "en";
let ver = load("lamp.ver." + lang, DEFAULT_VER[lang]);
if (!VERSIONS[ver]) ver = DEFAULT_VER[lang];
const t = (k, ...a) => { const s = T[lang][k] ?? T.en[k]; return typeof s === "function" ? s(...a) : s; };

const BOOKS = ["Genesis","Exodus","Leviticus","Numbers","Deuteronomy","Joshua","Judges","Ruth","1 Samuel","2 Samuel","1 Kings","2 Kings",
  "1 Chronicles","2 Chronicles","Ezra","Nehemiah","Esther","Job","Psalms","Proverbs","Ecclesiastes","Song of Solomon","Isaiah","Jeremiah",
  "Lamentations","Ezekiel","Daniel","Hosea","Joel","Amos","Obadiah","Jonah","Micah","Nahum","Habakkuk","Zephaniah","Haggai","Zechariah",
  "Malachi","Matthew","Mark","Luke","John","Acts","Romans","1 Corinthians","2 Corinthians","Galatians","Ephesians","Philippians",
  "Colossians","1 Thessalonians","2 Thessalonians","1 Timothy","2 Timothy","Titus","Philemon","Hebrews","James","1 Peter","2 Peter",
  "1 John","2 John","3 John","Jude","Revelation"];
const BOOKS_FR = ["Genèse", "Exode", "Lévitique", "Nombres", "Deutéronome", "Josué", "Juges", "Ruth", "1 Samuel", "2 Samuel", "1 Rois", "2 Rois", "1 Chroniques", "2 Chroniques", "Esdras", "Néhémie", "Esther", "Job", "Psaumes", "Proverbes", "Ecclésiaste", "Cantique des Cantiques", "Ésaïe", "Jérémie", "Lamentations", "Ézéchiel", "Daniel", "Osée", "Joël", "Amos", "Abdias", "Jonas", "Michée", "Nahum", "Habacuc", "Sophonie", "Aggée", "Zacharie", "Malachie", "Matthieu", "Marc", "Luc", "Jean", "Actes", "Romains", "1 Corinthiens", "2 Corinthiens", "Galates", "Éphésiens", "Philippiens", "Colossiens", "1 Thessaloniciens", "2 Thessaloniciens", "1 Timothée", "2 Timothée", "Tite", "Philémon", "Hébreux", "Jacques", "1 Pierre", "2 Pierre", "1 Jean", "2 Jean", "3 Jean", "Jude", "Apocalypse"];
const OT = 39, PSALMS = 18;
const bookName = b => (lang === "fr" ? BOOKS_FR : BOOKS)[b];
const chapterName = (b, c) => `${b === PSALMS ? t("psalm") : bookName(b)} ${c + 1}`;
const formatRef = (b, c, v1, v2 = v1) => `${chapterName(b, c)}:${v1 + 1}${v2 > v1 ? "-" + (v2 + 1) : ""}`;

// Turns what people type ("1 john 4:19", "psaume 23", "jean 3.16") into a book, chapter and verse.
const squash = s => fold(s).replace(/[^a-z0-9]/g, "");
const KEYS = { en: BOOKS.map(squash), fr: BOOKS_FR.map(squash) };
const ALIASES = { psalm: "psalms", psaume: "psaumes", songofsongs: "songofsolomon", cantique: "cantiquedescantiques", revelations: "revelation" };
function findBook(name) {
  const k = ALIASES[squash(name)] || squash(name);
  const order = lang === "fr" ? ["fr", "en"] : ["en", "fr"];
  for (const l of order) { const i = KEYS[l].indexOf(k); if (i >= 0) return i; }
  if (k.length >= 2) for (const l of order) { const i = KEYS[l].findIndex(b => b.startsWith(k)); if (i >= 0) return i; }
  return -1;
}
function parseRef(text) {
  const m = text.trim().match(/^([1-3]?\s*\p{L}[\p{L} .'’]*?)\.?\s*(\d+)(?:\s*[:.,]\s*(\d+))?(?:\s*-\s*(\d+))?$/iu);
  if (!m) return null;
  const b = findBook(m[1]);
  if (b < 0) return null;
  const v = m[3] ? +m[3] - 1 : null;
  return { b, c: +m[2] - 1, v, v2: m[4] && v != null ? +m[4] - 1 : v };
}

// Every verse the app shows gets an id ("version.book.chapter.from.to") so Save and Copy can find it again.
const known = new Map();
function remember(x) { x.id = [x.ver, x.b, x.c, x.v1, x.v2].join("."); known.set(x.id, x); return x; }
function moodVerse(v) {
  const other = VERSE_TEXT[v.ref], loc = parseRef(ver === "lsg" ? other.lsgRef : v.ref);
  return remember({ ver, b: loc.b, c: loc.c, v1: loc.v, v2: loc.v2, text: ver === "kjv" ? v.text : other[ver] });
}

// Saved verses are { id, ver, b, c, v1, v2, text }. Earlier versions of the app stored KJV references, so convert those.
let saved = load("lamp.saved", []).map(s => {
  if (s && s.id) return s;
  const ref = typeof s === "string" ? s : s && s.ref, v = VERSES.find(x => x.ref === ref), p = ref && parseRef(ref);
  if (!p || p.v == null) return null;
  return remember({ ver: "kjv", b: p.b, c: p.c, v1: p.v, v2: p.v2, text: v ? v.text : s.text });
}).filter(Boolean);
saved.forEach(x => known.set(x.id, x));
store("lamp.saved", saved);
const isSaved = id => saved.some(s => s.id === id);

let toastTimer;
function toast(msg, ms = 1800) {
  const el = $("#toast"); el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.hidden = true), ms);
}

function verseCard(x, { lit = false, small = false, memo = false } = {}) {
  const on = isSaved(x.id);
  return `<article class="verse${lit ? " lit" : ""}${small ? " small" : ""}" lang="${VERSIONS[x.ver].lang}">
    <blockquote>${esc(x.text)}</blockquote>
    <div class="ref">${formatRef(x.b, x.c, x.v1, x.v2)} <span class="muted" style="font-weight:500">· ${VERSIONS[x.ver].short}</span></div>
    <div class="actions" lang="${lang}">
      <button class="btn${on ? " on" : ""}" data-save="${x.id}">${on ? t("saved") : t("save")}</button>
      <button class="btn" data-copy="${x.id}">${t("copy")}</button>
      ${navigator.share ? `<button class="btn" data-share-verse="${x.id}">${t("share")}</button>` : ""}
      <button class="btn" data-read="${x.id}">${t("read_chapter")}</button>
      ${memo ? `<button class="btn" data-memo-add="${x.id}">${t("memorize")}</button>` : ""}
    </div>
  </article>`;
}

// Save, copy and read buttons work the same everywhere, so one listener handles them.
document.addEventListener("click", e => {
  const s = e.target.closest("[data-save]");
  if (s) {
    const id = s.dataset.save, x = known.get(id);
    saved = isSaved(id) ? saved.filter(v => v.id !== id) : [{ id, ver: x.ver, b: x.b, c: x.c, v1: x.v1, v2: x.v2, text: x.text }, ...saved];
    store("lamp.saved", saved);
    document.querySelectorAll(`[data-save="${CSS.escape(id)}"]`).forEach(b => {
      const on = isSaved(id); b.classList.toggle("on", on); b.textContent = on ? t("saved") : t("save");
    });
    toast(isSaved(id) ? t("toast_saved") : t("toast_removed"));
    if (!$("#s-saved").hidden) renderSaved();
    return;
  }
  const c = e.target.closest("[data-copy]");
  if (c) {
    const x = known.get(c.dataset.copy);
    const txt = `${t("quote", x.text)} — ${formatRef(x.b, x.c, x.v1, x.v2)} (${VERSIONS[x.ver].short})`;
    navigator.clipboard.writeText(txt).then(() => toast(t("toast_copied")), () => {
      const q = c.closest(".verse")?.querySelector("blockquote") || document.querySelector(".v.sel");
      if (!q) { toast(t("toast_nocopy")); return; }
      const r = document.createRange(); r.selectNodeContents(q);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      toast(t("toast_selected"));
    });
    return;
  }
  const r = e.target.closest("[data-read]");
  if (r) {
    // From inside a round, reading the verse behind an answer keeps the round waiting (see show).
    if (quiz && !quiz.over && r.closest("#s-quiz")) quiz.trip = { y: scrollY };
    const x = known.get(r.dataset.read); openChapter(x.b, x.c, x.v1); return;
  }
  const sh = e.target.closest("[data-share]");
  if (sh) { shareText(sh.dataset.share); return; }
  const sv = e.target.closest("[data-share-verse]");
  if (sv) { const x = known.get(sv.dataset.shareVerse); shareText(`${t("quote", x.text)} — ${formatRef(x.b, x.c, x.v1, x.v2)} (${VERSIONS[x.ver].short})`); return; }
  const g = e.target.closest("[data-go]");
  if (g) show(g.dataset.go);
});

// ---------- Tabs ----------
const TABS = ["today","find","bible","quiz","saved","settings","memo","badges"];
function show(tab, leaving = false) {
  // Leaving a quiz or game: a round in progress asks first; either way the quiz starts fresh next time.
  // Reading an answer's chapter is a side trip to the Bible, and the round waits for the reader to come back.
  const onTrip = !!(quiz && quiz.trip) && !$("#s-bible").hidden;
  if (tab !== "quiz" && !leaving && quiz && (onTrip || !$("#s-quiz").hidden) && !(quiz.trip && tab === "bible")) {
    if (!quiz.over) { askLeave(() => { endRound(); show(tab, true); }); return; }
    endRound();
  }
  TABS.forEach(n => { $("#s-" + n).hidden = n !== tab; });
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  clearSelection();
  $("main").classList.remove("wide");
  scrollTo(0, 0);
  if (tab === "today") renderToday();
  if (tab === "settings") renderBackup();
  if (tab === "memo") { memoView = null; renderMemo(); }
  if (tab === "saved") renderSaved();
  if (tab === "quiz" && !quiz) renderQuizStart();
  if (tab === "quiz" && quiz && quiz.trip) { scrollTo(0, quiz.trip.y); quiz.trip = null; }  // back from reading, to the same spot
  if (tab === "bible") drawBible();
  if (tab === "badges") renderBadges();
}
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => show(b.dataset.tab)));

// ---------- Settings ----------
function applyStatic() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = t(el.dataset.t); });
  document.querySelectorAll("[data-t-ph]").forEach(el => { el.placeholder = t(el.dataset.tPh); });
  document.querySelectorAll("[data-t-label]").forEach(el => { el.setAttribute("aria-label", t(el.dataset.tLabel)); });
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  const group = l => Object.entries(VERSIONS).filter(([, v]) => v.lang === l)
    .map(([k, v]) => `<option value="${k}"${k === ver ? " selected" : ""}>${v.short} · ${v.name}</option>`).join("");
  document.querySelectorAll("[data-ver-pick]").forEach(s => {
    s.innerHTML = `<optgroup label="English">${group("en")}</optgroup><optgroup label="Français">${group("fr")}</optgroup>`;
  });
  $("#bible-version-name").textContent = VERSIONS[ver].name;
}
function refreshAll() {
  applyStatic();
  renderLookControls();
  renderScope();
  $("#brand-icon").innerHTML = ICONS.lamp;
  $("#gear").innerHTML = ICONS.gear;
  renderToday();

  if (!$("#s-saved").hidden) renderSaved();
  if (!$("#s-memo").hidden) renderMemo();
  if (!$("#s-settings").hidden) renderBackup();
  if (!$("#s-quiz").hidden && !quiz) renderQuizStart();
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => {
  if (b.dataset.lang === lang) return;
  const oldExample = t("find_example");
  lang = b.dataset.lang; store("lamp.lang", lang);
  ver = load("lamp.ver." + lang, DEFAULT_VER[lang]);
  if (!VERSIONS[ver]) ver = DEFAULT_VER[lang];
  const mood = $("#mood");
  if (!mood.value.trim() || mood.value === oldExample) mood.value = t("find_example");
  quiz = null;
  refreshAll();
}));
document.querySelectorAll("[data-ver-pick]").forEach(s => s.addEventListener("change", () => {
  ver = s.value; store("lamp.ver." + lang, ver);
  refreshAll();
}));

// Reading look (theme and Bible font) and kids mode, applied as attributes on the page root.
let look = load("lamp.look", "auto"), font = load("lamp.font", "classic"), kids = load("lamp.kids", false);
function applyLook() {
  const r = document.documentElement;
  if (look === "auto") delete r.dataset.look; else r.dataset.look = look;
  if (font === "classic") delete r.dataset.font; else r.dataset.font = font;
  if (kids) r.dataset.kids = "1"; else delete r.dataset.kids;
}
function renderLookControls() {
  const seg = (id, key, current, items) => {
    $(id).innerHTML = items.map(([k, label, style]) =>
      `<button type="button" data-${key}="${k}" aria-pressed="${k === current}"${style ? ` style="${style}"` : ""}>${label}</button>`).join("");
  };
  seg("#look-seg", "set-look", look, [["auto", t("look_auto")], ["light", t("look_light")], ["sepia", t("look_sepia")], ["dark", t("look_dark")]]);
  // Each font choice is written in its own font, so you can see it before picking.
  seg("#font-seg", "set-font", font, [["classic", t("font_classic"), "font-family:'Cormorant Garamond',serif;font-size:1rem"],
    ["book", t("font_book"), "font-family:Literata,serif"], ["modern", t("font_modern")]]);
  seg("#kids-seg", "set-kids", kids ? "1" : "0", [["0", t("off")], ["1", t("on")]]);
}
$("#s-settings").addEventListener("click", e => {
  const b = e.target.closest("[data-set-look],[data-set-font],[data-set-kids]");
  if (!b) return;
  const d = b.dataset;
  if (d.setLook) { look = d.setLook; store("lamp.look", look); }
  if (d.setFont) { font = d.setFont; store("lamp.font", font); }
  if (d.setKids) { kids = d.setKids === "1"; store("lamp.kids", kids); quiz = null; }
  applyLook();
  renderLookControls();
  renderScope();
});
applyLook();

// ---------- Today ----------
function renderToday() {
  const now = new Date(), h = now.getHours();
  $("#greeting").textContent = h < 12 ? t("greet_morning") : h < 18 ? t("greet_afternoon") : t("greet_evening");
  $("#today-date").textContent = now.toLocaleDateString(lang, { weekday: "long", month: "long", day: "numeric" });
  // Same verse for everyone on the same calendar day; 37 steps through the list so neighbouring days differ in theme.
  const day = Math.floor(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / 86400000);
  const v = moodVerse(VERSES[(day * 37) % VERSES.length]);
  $("#votd").innerHTML = `<div class="eyebrow" style="margin-bottom:8px">${t("votd")}</div>` + verseCard(v, { lit: true });
  const active = activePlans(), streakDays = readingStreak();
  $("#today-plans").innerHTML = active.length
    ? `<div class="eyebrow">${t("today_reading")}</div>${streakDays ? `<p class="muted" style="margin:0">${t("streak", streakDays)}</p>` : ""}`
      + active.map(p => planCardHTML(p, true)).join("")
    : "";
  // Kids mode puts well-known Bible stories first; finished ones get a green number.
  const read = load("lamp.stories", []);
  $("#today-stories").innerHTML = kids
    ? `<div class="eyebrow">${t("stories")}</div><div class="stories">${STORIES.map((s, i) =>
        `<button class="story${read.includes(i) ? " read" : ""}" data-story="${i}"><span class="num">${i + 1}</span><b>${s[lang]}</b>
          <small>${chapterName(s.b, s.c)}${s.v ? ":" + (s.v + 1) : ""}${read.includes(i) ? " · " + t("story_read") : ""}</small></button>`).join("")}</div>`
    : "";
  // Shortcuts to the rest of the app, each showing where you are with it.
  const bests = LEVELS.map(l => bestOf(l)).filter(b => b !== null), best = bests.length ? Math.max(...bests) : null;
  const last = load("lamp.lastread", null), open = prayers.filter(p => !p.answered).length;
  const tile = (attrs, icon, title, sub) =>
    `<button class="tile" ${attrs}><span class="ic">${ICONS[icon]}</span><span><b>${title}</b><small>${sub}</small></span></button>`;
  $("#tiles").innerHTML = [
    tile('data-go="find"', "search", t("tile_find"), t("tile_find_sub")),
    tile('data-tile="read"', "book", t("tile_read"), last ? t("tile_continue", chapterName(last.b, last.c)) : t("tile_read_sub")),
    tile("data-go-plans", "plan", t("plans_title"), t("tile_plans_sub", active.length)),
    tile('data-go="quiz"', "quiz", t("tile_quiz"), dailyDone() ? t("tile_quiz_sub", best, QUIZ.length) : t("tile_quiz_daily")),
    tile('data-tile="pray"', "heart", t("tile_pray"), t("tile_pray_sub", open, prayers.length - open)),
    tile('data-go="memo"', "brain", t("memo_title"), t("tile_memo_sub", memory.length, memory.filter(m => m.learned).length)),
    tile('data-go="badges"', "medal", t("badges_title"), t("badges_count", badgesEarned(), BADGES.length)).replace('class="tile"', 'class="tile wide"'),
  ].join("");
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-tile]");
  if (!el) return;
  const k = el.dataset.tile, last = load("lamp.lastread", null);

// ---------- Find ----------
let lastMoods = null;
function renderFind() {
  $("#chips").innerHTML = CHIP_ORDER.map(k => `<button class="btn" type="button" data-mood="${k}">${MOODS[k].label[lang]}</button>`).join("");
  if (lastMoods) showMoods(lastMoods.keys, lastMoods.crisis); else findFor($("#mood").value);
}
$("#chips").addEventListener("click", e => {
  const b = e.target.closest("[data-mood]"); if (!b) return;
  $("#mood").value = MOODS[b.dataset.mood].label[lang];
  showMoods([b.dataset.mood]);
});
$("#ask").addEventListener("submit", e => { e.preventDefault(); findFor($("#mood").value); });

// Mood words are matched in both languages, since people often mix them.
const MOOD_WORDS = Object.fromEntries(Object.entries(MOODS).map(([k, m]) => [k, [...m.en, ...m.fr].map(w => words(w).trim())]));
const CRISIS_WORDS = [...CRISIS.en, ...CRISIS.fr].map(w => words(w).trim());

function findFor(raw) {
  const text = words(raw);
  if (!text.trim()) { lastMoods = null; $("#results").innerHTML = `<div class="note">${t("find_empty")}</div>`; return; }
  const crisis = CRISIS_WORDS.some(w => text.includes(" " + w + " ") || text.includes(" " + w));
  const scores = Object.entries(MOOD_WORDS)
    .map(([k, ws]) => [k, ws.filter(w => text.includes(" " + w + " ") || (w.length > 4 && text.includes(" " + w))).length])
    .filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]);
  let keys = scores.slice(0, 2).map(([k]) => k);
  if (crisis && !keys.length) keys = ["hope"];
  showMoods(keys, crisis);
}

function showMoods(keys, crisis = false) {
  lastMoods = keys.length ? { keys, crisis } : null;
  const care = crisis ? `<div class="note care">${t("care")}</div>` : "";
  if (!keys.length) { $("#results").innerHTML = `<div class="note">${t("find_nomatch")}</div>`; return; }
  const pool = shuffle(VERSES.filter(v => v.t.some(x => keys.includes(x))));
  const labels = keys.map(k => MOODS[k].label[lang]).join(t("and"));
  $("#results").innerHTML = care +
    `<p class="muted" style="margin:0">${t("verses_for", labels)}</p>` +
    pool.slice(0, 3).map(v => verseCard(moodVerse(v), { small: true })).join("") +
    (pool.length > 3 ? `<div><button class="btn" id="more">${t("more")}</button></div>` : "");
  const more = $("#more");
  if (more) more.addEventListener("click", () => showMoods(keys, crisis));
}

// ---------- Bible ----------
// Each version is a file published next to this page: [book][chapter][verse] -> text. A verse a version leaves out is "".
const bibles = {}, loading = {}, folded = {};
function loadBible(v) {
  loading[v] ??= fetch(VERSIONS[v].file)
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(d => (bibles[v] = d), err => { delete loading[v]; throw err; });
  return loading[v];
}
const cur = () => bibles[ver];
// The version shown beside the main one, or null.
let cmp = load("lamp.cmp", null);
const cmpVer = () => (VERSIONS[cmp] && cmp !== ver ? cmp : null);

const rd = Object.assign({ view: "books", b: 0, c: 0 }, load("lamp.reader", {}), { v: null, q: "" });
let scale = load("lamp.scale", 1);
let selected = null;

// Highlights and notes, keyed "language.book.chapter.verse": the English versions share verse numbers, Louis Segond has its own.
let marks = load("lamp.marks", {});
const markKey = (v, b, c, i) => `${VERSIONS[v].lang}.${b}.${c}.${i}`;
const noteMark = () => `<span class="nmark" title="${esc(t("has_note"))}">✎</span>`;
// Extra class and note marker for verse i of the open chapter in version v.
function verseDeco(v, i) {
  const m = marks[markKey(v, rd.b, rd.c, i)];
  return { cls: m && m.hl ? " hl-" + m.hl : "", note: m && m.note ? noteMark() : "" };
}

function saveReader() { store("lamp.reader", { view: rd.view === "search" ? "books" : rd.view === "study" ? "read" : rd.view, b: rd.b, c: rd.c }); }
function setView(patch) { Object.assign(rd, patch); saveReader(); scrollTo(0, 0); drawBible(); }
// `plan` is set only when reading through a reading plan's chapters for the day.
function openChapter(b, c, v = null, plan = null) {
  Object.assign(rd, { view: "read", b, c, v, plan });
  saveReader();
  if ($("#s-bible").hidden) show("bible"); else { scrollTo(0, 0); drawBible(); }
}

async function drawBible() {
  const body = $("#bible-body"), trip = quiz && quiz.trip;
  $("#quiz-back").hidden = !trip;
  if (trip) $("#quiz-back button").textContent = t(quiz.kind ? "back_to_game" : "back_to_quiz", quiz.i + 1, ROUND);
  clearSelection();
  $("#bible-top").hidden = rd.view === "read" || rd.view === "plans" || rd.view === "study";
  $("main").classList.toggle("wide", rd.view === "read" && !!cmpVer());
  // Plans don't need the Bible text, so they show without waiting for it.
  if (rd.view === "plans") { body.innerHTML = plansHTML(); return; }
  while (!cur() || (rd.view === "read" && cmpVer() && !bibles[cmpVer()])) {
    body.innerHTML = `<div class="note muted">${t("opening")}</div>`;
    try { await Promise.all([loadBible(ver), rd.view === "read" && cmpVer() ? loadBible(cmpVer()) : null]); }
    catch { body.innerHTML = `<div class="note">${t("load_failed")}</div>`; return; }
  }
  const bible = cur();
  if (!bible[rd.b]) Object.assign(rd, { view: "books", b: 0, c: 0 });
  rd.c = Math.max(0, Math.min(rd.c, bible[rd.b].length - 1));
  if (rd.view === "chapters") body.innerHTML = chaptersHTML(bible);
  else if (rd.view === "read") { body.innerHTML = readHTML(bible); afterRead(); }
  else if (rd.view === "search") body.innerHTML = searchHTML(bible, rd.q);
  else if (rd.view === "study" && rd.study) {
    body.innerHTML = `<div class="note muted">${t("opening")}</div>`;
    const study = rd.study;
    studyHTML(study).then(html => { if (rd.study === study) body.innerHTML = html; },
      () => { body.innerHTML = `<div class="note">${t("study_failed")}</div>`; });
  }
  else body.innerHTML = booksHTML(bible);
}

function booksHTML(bible) {
  const group = (title, from, to) => `<div class="testament"><div class="eyebrow">${title}</div><div class="books">${
    BOOKS.slice(from, to).map((_, i) => `<button class="book" data-book="${from + i}">${bookName(from + i)}<small>${bible[from + i].length}</small></button>`).join("")
  }</div></div>`;
  const last = load("lamp.lastread", null);
  return `<button class="hit" data-bv="plans"><b>${t("plans_title")}</b><span>${t("plans_entry")}</span></button>`
    + (last ? `<button class="hit" data-open="${last.b},${last.c}"><b>${t("continue_reading")}</b><span>${chapterName(last.b, last.c)}</span></button>` : "")
    + group(t("ot"), 0, OT) + group(t("nt"), OT, BOOKS.length);
}

function chaptersHTML(bible) {
  const n = bible[rd.b].length, last = load("lamp.lastread", null);
  const here = i => last && last.b === rd.b && last.c === i ? ' class="here"' : "";
  return `<div><button class="btn" data-bv="books">${t("all_books")}</button></div>
    <h2>${bookName(rd.b)}</h2>
    <p class="muted" style="margin:0">${t("chapters_note", n, rd.b === PSALMS)}</p>
    <div class="chapters">${Array.from({ length: n }, (_, i) => `<button data-ch="${i}"${here(i)}>${i + 1}</button>`).join("")}</div>`;
}

function readHTML(bible) {
  const verses = bible[rd.b][rd.c];
  const prev = rd.c > 0 ? [rd.b, rd.c - 1] : rd.b > 0 ? [rd.b - 1, bible[rd.b - 1].length - 1] : null;
  const next = rd.c < bible[rd.b].length - 1 ? [rd.b, rd.c + 1] : rd.b < BOOKS.length - 1 ? [rd.b + 1, 0] : null;
  return `<div class="reader-head">
      <button class="btn" data-bv="chapters" aria-label="${esc(t("chapters_aria", bookName(rd.b)))}">${t("chapters_back")}</button>
      <h2 style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:center">${chapterName(rd.b, rd.c)}</h2>
      <span class="bar" style="flex-wrap:nowrap;gap:4px">
        <button class="btn" data-size="-1" aria-label="${t("smaller")}">A−</button><button class="btn" data-size="1" aria-label="${t("larger")}">A+</button>
      </span>
    </div>
    <div class="compare">
      <label for="cmp">${t("compare")}</label>
      <select class="pick" id="cmp">
        <option value="">${t("compare_none")}</option>
        ${Object.entries(VERSIONS).filter(([k]) => k !== ver)
          .map(([k, v]) => `<option value="${k}"${k === cmpVer() ? " selected" : ""}>${v.short} · ${v.name}</option>`).join("")}
      </select>
    </div>
    ${cmpVer() ? parallelHTML(bible, bibles[cmpVer()], cmpVer()) : `<div class="chapter-text" lang="${VERSIONS[ver].lang}" style="--scale:${scale}">${
      verses.map((x, i) => { if (!x) return ""; const d = verseDeco(ver, i);
        return `<span class="v${d.cls}" data-v="${i}" data-ver="${ver}"><sup>${i + 1}</sup>${d.note}${esc(x)}</span> `; }).join("")}</div>`}
    <p class="muted" style="margin:0;font-size:.85rem">${cmpVer() ? "" : VERSIONS[ver].name + ". "}${t("tap_verse")}</p>
    ${planBarHTML() || `<div class="pager">
      ${prev ? `<button class="btn" data-open="${prev[0]},${prev[1]}">‹ ${chapterName(...prev)}</button>` : "<span></span>"}
      ${next ? `<button class="btn" data-open="${next[0]},${next[1]}">${chapterName(...next)} ›</button>` : "<span></span>"}
    </div>`}`;
}

// Pairs up the verses of one chapter in two versions.
// Louis Segond numbers psalm titles as verses, so in Psalms its extra verses come first and have no partner.
function parallelHTML(bible, other, ov) {
  const a = bible[rd.b][rd.c], b = other[rd.b]?.[rd.c] || [];
  let shift = 0;
  if (rd.b === PSALMS && (ver === "lsg") !== (ov === "lsg")) shift = ver === "lsg" ? a.length - b.length : b.length - a.length;
  if (shift < 0) shift = 0;
  // Row i shows main verse ia and other verse ib; whichever side is Segond starts `shift` rows earlier.
  const offA = ver === "lsg" ? 0 : shift, offB = ver === "lsg" ? shift : 0;
  const rows = Math.max(a.length + offA, b.length + offB);
  const cell = (list, i, v, cls) => {
    if (!list[i]) return `<p class="v${cls}" aria-hidden="true"></p>`;
    const d = verseDeco(v, i);
    return `<p class="v${cls}${d.cls}" data-v="${i}" data-ver="${v}" lang="${VERSIONS[v].lang}"><sup>${i + 1}</sup>${d.note}${esc(list[i])}</p>`;
  };
  let html = "";
  for (let r = 0; r < rows; r++) {
    const ia = r - offA, ib = r - offB;
    if (!a[ia] && !b[ib]) continue;
    html += `<div class="pair">${cell(a, ia, ver, "")}${cell(b, ib, ov, " alt")}</div>`;
  }
  return `<div class="legend"><span class="a">${VERSIONS[ver].short} · ${VERSIONS[ver].name}</span><span class="b">${VERSIONS[ov].short} · ${VERSIONS[ov].name}</span></div>
    <div class="chapter-text parallel" style="--scale:${scale}">${html}</div>`;
}

$("#s-bible").addEventListener("change", e => {
  if (e.target.id !== "cmp") return;
  cmp = e.target.value || null;
  store("lamp.cmp", cmp);
  drawBible();
});

function afterRead() {
  store("lamp.lastread", { b: rd.b, c: rd.c });
  // Chapters opened, as "book.chapter", for the reading badges.
  const chs = load("lamp.chapters", []), key = rd.b + "." + rd.c;
  if (!chs.includes(key)) store("lamp.chapters", [...chs, key]);
  if (rd.v == null) return;
  const el = document.querySelector(`#bible-body .v[data-v="${rd.v}"][data-ver="${ver}"]`);
  rd.v = null;
  if (!el) return;
  el.scrollIntoView({ block: "center" });
  el.classList.add("flash");
  setTimeout(() => el.classList.remove("flash"), 1800);
}

// Search ignores case and accents: "eternel" finds "Éternel".
function searchIndex(bible) {
  if (folded[ver]) return folded[ver];
  const list = [];

// Where to search: "all", "ot", "nt", or "b:<book index>".
rd.scope = "all";
const inScope = b => rd.scope === "ot" ? b < OT : rd.scope === "nt" ? b >= OT : rd.scope.startsWith("b:") ? b === +rd.scope.slice(2) : true;
const scopeName = () => rd.scope === "ot" ? t("ot") : rd.scope === "nt" ? t("nt") : rd.scope.startsWith("b:") ? bookName(+rd.scope.slice(2)) : t("scope_all");
function renderScope() {

  const books = (from, to) => BOOKS.slice(from, to).map((_, i) => opt("b:" + (from + i), bookName(from + i))).join("");

// Words must all appear; text in quotes ("still waters", « eaux paisibles ») must appear as written.
function parseQuery(q) {
  const phrases = [];
  const rest = q.replace(/["“”«»]\s*([^"“”«»]+?)\s*["“”«»]/g, (_, p) => { phrases.push(p); return " "; });
  return {
    phrases: phrases.map(p => fold(p).match(/[\p{L}\p{N}]+/gu) || []).filter(w => w.length),
    terms: [...new Set(fold(rest).match(/[\p{L}\p{N}]+/gu) || [])].filter(w => w.length > 1 || /\d/.test(w)),
  };
}
function searchHTML(bible, q) {
  const { phrases, terms } = parseQuery(q);
  const back = `<div><button class="btn" data-bv="books">${t("all_books")}</button></div>`;
  if (!terms.length && !phrases.length) return back + `<div class="note">${t("search_type")}</div>`;
  const edge = w => `(?<![\\p{L}\\p{N}])${w}(?![\\p{L}\\p{N}])`;
  const patterns = [...terms.map(edge), ...phrases.map(ws => edge(ws.join("[^\\p{L}\\p{N}]+")))];
  const tests = patterns.map(p => new RegExp(p, "u"));
  const all = searchIndex(bible).filter(([, , , f]) => tests.every(r => r.test(f)));
  const hits = all.filter(([b]) => inScope(b));
  const mark = new RegExp(patterns.join("|"), "gu");
  // How many matches each book has, most first, so one tap narrows the search to that book.
  const perBook = {};
  hits.forEach(([b]) => { perBook[b] = (perBook[b] || 0) + 1; });
  const top = Object.entries(perBook).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const chips = !rd.scope.startsWith("b:") && top.length > 1
    ? `<div class="eyebrow">${t("by_book")}</div><div class="chips">${top.map(([b, n]) =>
        `<button class="btn" data-scope-book="${b}">${bookName(+b)} · ${n}</button>`).join("")}</div>` : "";
  const highlight = (orig, f) => {
    let out = "", last = 0;
    for (const m of f.matchAll(mark)) {
      out += esc(orig.slice(last, m.index)) + "<mark>" + esc(orig.slice(m.index, m.index + m[0].length)) + "</mark>";
      last = m.index + m[0].length;
    }
    return out + esc(orig.slice(last));
  };
  const what = `<strong style="color:var(--ink)">${esc(q.trim())}</strong>`;
  const summary = (hits.length ? t("search_count", hits.length, what, hits.length > 200) : t("search_none", what))
    + (rd.scope !== "all" ? ` · ${esc(scopeName())}` : "");
  const widen = rd.scope !== "all" && all.length > hits.length
    ? `<div><button class="btn" data-scope-book="all">${t("search_everywhere", all.length)}</button></div>` : "";
  return back + `<p class="muted" style="margin:0">${summary}</p>${widen}${chips}
    <div class="hits">${hits.slice(0, 200).map(([b, c, v, f]) => `<button class="hit" data-open="${b},${c},${v}"><b>${formatRef(b, c, v)}</b><span lang="${VERSIONS[ver].lang}">${
      highlight(bible[b][c][v], f)}</span></button>`).join("")}</div>`;
}

// ---------- Reading plans ----------
// Chapters in each book, so plans can be laid out before any Bible file has loaded.
const CHAPTERS = [50,40,27,36,34,24,21,4,31,24,22,25,29,36,10,13,10,42,150,31,12,8,66,52,5,48,12,14,3,9,1,4,7,3,3,3,2,14,4,
  28,16,24,21,28,16,16,13,6,6,4,4,5,3,6,4,3,1,13,5,5,3,5,1,1,1,22];
const range = (a, b) => Array.from({ length: b - a }, (_, i) => a + i);
const PLANS = [
  { id: "proverbs", days: 31, books: [19],
    name: { en: "Proverbs in a month", fr: "Les Proverbes en un mois" },
    desc: { en: "A chapter of wisdom for each day of the month.", fr: "Un chapitre de sagesse pour chaque jour du mois." } },
  { id: "gospels", days: 30, books: [39, 40, 41, 42],
    name: { en: "The Gospels in 30 days", fr: "Les Évangiles en 30 jours" },
    desc: { en: "The life of Jesus through Matthew, Mark, Luke and John.", fr: "La vie de Jésus à travers Matthieu, Marc, Luc et Jean." } },
  { id: "psalms", days: 30, books: [18],
    name: { en: "Psalms in 30 days", fr: "Les Psaumes en 30 jours" },
    desc: { en: "Prayers and songs for every season of life.", fr: "Des prières et des chants pour chaque saison de la vie." } },
  { id: "nt", days: 90, books: range(OT, 66),
    name: { en: "The New Testament in 90 days", fr: "Le Nouveau Testament en 90 jours" },
    desc: { en: "From Matthew to Revelation in three months.", fr: "De Matthieu à l'Apocalypse en trois mois." } },
  { id: "bible", days: 365, books: range(0, 66),
    name: { en: "The Bible in a year", fr: "La Bible en un an" },
    desc: { en: "Every chapter, from Genesis to Revelation, in 365 days.", fr: "Tous les chapitres, de la Genèse à l'Apocalypse, en 365 jours." } },
];
const PLAN_BY_ID = Object.fromEntries(PLANS.map(p => [p.id, p]));
// A plan's days: its chapters, in order, shared out as evenly as possible.
function planDays(p) {
  if (p.list) return p.list;
  const all = p.books.flatMap(b => range(0, CHAPTERS[b]).map(c => [b, c]));
  return (p.list = range(0, p.days).map(d => all.slice(Math.floor(d * all.length / p.days), Math.floor((d + 1) * all.length / p.days))));
}
const perDay = p => { const n = planDays(p).flat().length / p.days; return n < 1.5 ? 1 : Math.round(n); };
const exactPerDay = p => planDays(p).every(d => d.length === planDays(p)[0].length);

// Started plans: { id: { start: "YYYY-MM-DD", done: { dayIndex: "YYYY-MM-DD" } } }
let plans = load("lamp.plans", {});
const two = n => String(n).padStart(2, "0");
const dateKey = d => `${d.getFullYear()}-${two(d.getMonth() + 1)}-${two(d.getDate())}`;
const dayNum = key => { const [y, m, d] = key.split("-").map(Number); return Math.round(Date.UTC(y, m - 1, d) / 86400000); };
const keyOfDay = n => { const d = new Date(n * 86400000); return `${d.getUTCFullYear()}-${two(d.getUTCMonth() + 1)}-${two(d.getUTCDate())}`; };

function planState(id) {
  const p = PLAN_BY_ID[id], s = plans[id], days = planDays(p);
  let cur = 0;
  while (cur < days.length && s.done[cur]) cur++;
  const scheduled = Math.min(days.length - 1, dayNum(dateKey(new Date())) - dayNum(s.start));
  return { p, s, days, cur, finished: cur >= days.length, behind: Math.max(0, scheduled - cur), pct: Math.round(100 * Object.keys(s.done).length / days.length) };
}
// Days in a row, ending today or yesterday, on which any plan day was finished.
function readingStreak() {
  const dates = new Set(Object.values(plans).flatMap(s => Object.values(s.done)));
  let d = dayNum(dateKey(new Date()));
  if (!dates.has(keyOfDay(d))) d--;
  let n = 0;
  while (dates.has(keyOfDay(d))) { n++; d--; }
  return n;
}
// "Matthew 27–28, Mark 1"
function readingLabel(chs) {
  const runs = [];
  chs.forEach(([b, c]) => { const r = runs[runs.length - 1]; if (r && r.b === b && r.to === c - 1) r.to = c; else runs.push({ b, from: c, to: c }); });
  return runs.map(r => `${bookName(r.b)} ${r.from + 1}${r.to > r.from ? "–" + (r.to + 1) : ""}`).join(", ");
}
const activePlans = () => PLANS.filter(p => plans[p.id]);

function planCardHTML(p, compact) {

    ? `<button class="btn primary" data-plan-start="${p.id}">${t("start_again")}</button>${compact ? "" : `<button class="btn" data-plan-stop="${p.id}">${t("remove")}</button>`}`

  return `<div class="plancard">
    <h3>${p.name[lang]}</h3>

    <div class="bar">${actions}</div>

}
function plansHTML() {

}
// While reading a plan's chapters, the bar under the chapter leads to the next one, then marks the day as read.
function planBarHTML() {

async function lookUpVerse(ref) {
  const p = parseRef(ref || "");
  if (!p || p.v == null) return null;
  try { await loadBible(ver); } catch { return null; }
  const ch = cur()[p.b]?.[p.c];

  const v2 = Math.min(p.v2 ?? p.v, p.v + 4, ch.length - 1);

// ---------- Study: cross-references and dictionary for one verse ----------
// xref.json: { psalmShift: { chapter: extra verses in Segond }, refs: { "b.c.v": "b.c.v;b.c.v-v2;…" } }, KJV numbering.
// easton.json: { headword: text }. Both load the first time a verse is studied.
let studyData = null, studyLoading = null;
function loadStudy() {
  studyLoading ??= Promise.all(["xref.json", "easton.json"].map(f => fetch(f).then(r => { if (!r.ok) throw new Error(f); return r.json(); })))
    .then(([x, e]) => {
      // Look up dictionary entries by their first word: "herod" finds "Herod the Great", "Herod Antipas"…
      const idx = {};
      Object.keys(e).forEach(h => { const k = fold(h.split(/[ ,]/)[0]).replace(/[^a-z]/g, ""); (idx[k] ||= []).push(h); });
      return (studyData = { x, e, idx });
    }, err => { studyLoading = null; throw err; });
  return studyLoading;
}
// Louis Segond counts psalm titles as verses, so its psalm verses sit later than the KJV numbers used by the data.
const shiftOf = (v, b, c) => v === "lsg" && b === PSALMS ? (studyData.x.psalmShift[c] || 0) : 0;
const STOP = new Set(("the and that for with his him her she they them their this then there these those which shall unto upon from have hath "
  + "were was are not but all said say saith also into out when what who whom will thou thee thy thine you your our its one two came come went "
  + "made make let did does done even every any before after over under again because thus how now yet nor neither may might can could would "
  + "should had has been being more most much many such than very").split(" "));

// Dictionary entries for a verse, grouped by word: "Herod" gathers Herod the Great, Herod Antipas and the others.
function dictionaryHits(text) {
  const { idx } = studyData, groups = [], seen = new Set();
  const words = text.match(/[A-Za-z][A-Za-z'’]*/g) || [];
  // Names (capitalized words) first, then other topics; at most 10 groups.
  const ordered = [...words.filter(w => /^[A-Z]/.test(w)), ...words.filter(w => !/^[A-Z]/.test(w))];
  for (const w of ordered) {
    let k = fold(w.replace(/['’]s$/i, "")).replace(/[^a-z]/g, "");
    if (k.length < 3 || STOP.has(k)) continue;
    if (!idx[k] && k.endsWith("s") && idx[k.slice(0, -1)]) k = k.slice(0, -1);
    if (!idx[k] || seen.has(k)) continue;
    seen.add(k);
    const heads = [...idx[k]].sort((a, b) => (fold(b) === k) - (fold(a) === k)).slice(0, 8);
    groups.push({ title: fold(heads[0]) === k ? heads[0] : k[0].toUpperCase() + k.slice(1), heads });
    if (groups.length >= 10) break;
  }
  return groups;
}

async function studyHTML({ ver: v, b, c, i }) {
  await loadStudy();
  await loadBible(v);
  const bible = bibles[v], text = bible[b][c][i] || "";
  // Cross-references, shown in the same version as the verse.
  const kv = i - shiftOf(v, b, c);
  const refs = (kv >= 0 && studyData.x.refs[`${b}.${c}.${kv}`] || "").split(";").filter(Boolean).map(r => {
    const [tb, tc, rest] = r.split("."), [a, z] = rest.split("-").map(Number);
    const s = shiftOf(v, +tb, +tc), v1 = a + s, v2 = (z ?? a) + s;
    const t1 = (bible[tb]?.[tc] || []).slice(v1, v2 + 1).filter(Boolean).join(" ");
    return t1 ? `<button class="hit" data-open="${tb},${tc},${v1}"><b>${formatRef(+tb, +tc, v1, v2)}</b><span lang="${VERSIONS[v].lang}">${esc(t1)}</span></button>` : "";
  }).join("");
  // The dictionary is English, so non-English versions look up the King James words of the same verse.
  let english = text;
  if (VERSIONS[v].lang !== "en") { await loadBible("kjv"); english = bibles.kjv[b]?.[c]?.[i - shiftOf(v, b, c)] || ""; }
  const entry = h => studyData.e[h].split("\n\n").map(p => `<p lang="en">${esc(p)}</p>`).join("");
  const dict = dictionaryHits(english).map(g => `<details><summary>${esc(g.title)}${g.heads.length > 1 ? ` <span class="muted">(${g.heads.length})</span>` : ""}</summary>${
    g.heads.length > 1 ? g.heads.map(h => `<p class="eyebrow" style="margin-top:14px">${esc(h)}</p>${entry(h)}`).join("") : entry(g.heads[0])}</details>`).join("");
  return `<div><button class="btn" data-study-back>${t("back_to", chapterName(b, c))}</button></div>
    <h2>${formatRef(b, c, i)} <span class="muted" style="font-size:1rem;font-family:var(--font-ui)">· ${VERSIONS[v].short}</span></h2>
    <blockquote class="pverse" lang="${VERSIONS[v].lang}">${esc(text)}</blockquote>

    ${refs ? `<div class="hits">${refs}</div>` : `<p class="muted" style="margin:0">${t("xref_none")}</p>`}
    <p class="small muted">${t("xref_credit")}</p>
    <div class="eyebrow">${t("dictionary")}</div>
    ${VERSIONS[v].lang !== "en" ? `<p class="small muted">${t("dict_english")}</p>` : ""}
    ${dict ? `<div class="dicts">${dict}</div>` : `<p class="muted" style="margin:0">${t("dict_none")}</p>`}
    <p class="small muted">${t("dict_credit")}</p>`;
}

// ---------- Memorize ----------
// Memory verses: { id, ver, b, c, v1, v2, text, stage: rounds passed (0–5), learned: ms | null, added: ms }
let memory = load("lamp.memory", []);
let memoView = null;   // null shows the list; otherwise the round being practiced
let memoError = false;
const saveMemory = () => store("lamp.memory", memory);
const MEMO_POPULAR = ["John 3:16", "Philippians 4:13", "Proverbs 3:5-6", "Joshua 1:9", "Romans 8:28", "Psalm 119:105"];
const wordCount = s => s.split(/\s+/).filter(Boolean).length;
const stepsHTML = n => `<span class="steps" aria-hidden="true">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</span>`;
// Splits "LORD:" into "" + "LORD" + ":" so only the word itself is hidden.
const CORE = /^([^\p{L}\p{N}]*)([\p{L}\p{N}][\p{L}\p{N}'’-]*[\p{L}\p{N}]|[\p{L}\p{N}])([^\p{L}\p{N}]*)$/u;

function addToMemory(x) {
  if (memory.some(m => m.id === x.id)) { toast(t("memo_dup")); return false; }
  if (wordCount(x.text) > 60) { toast(t("memo_too_long")); return false; }
  memory.push({ id: x.id, ver: x.ver, b: x.b, c: x.c, v1: x.v1, v2: x.v2, text: x.text, stage: 0, learned: null, added: Date.now() });
  saveMemory();
  toast(t("toast_memo_added"));
  return true;
}

function renderMemo() {
  const el = $("#s-memo");
  if (memoView) { el.innerHTML = memoRoundHTML(); return; }
  const inList = x => memory.some(m => m.id === x.id);
  const fromSaved = saved.filter(s => !inList(s) && wordCount(s.text) <= 60).slice(0, 6);
  const popular = MEMO_POPULAR.map(r => moodVerse(VERSES.find(v => v.ref === r))).filter(x => !inList(x));
  const chip = x => `<button class="btn" type="button" data-memo-pick="${x.id}">${formatRef(x.b, x.c, x.v1, x.v2)}</button>`;
  el.innerHTML = `<div><button class="btn" type="button" data-go="today">${t("back_today")}</button></div>
    <header class="top"><span class="eyebrow">${t("memo_eyebrow")}</span><h1>${t("memo_title")}</h1></header>
    <p class="muted" style="margin:0">${t("memo_intro")}</p>
    ${memory.length ? `<div class="eyebrow">${t("memo_yours")}</div><div class="planlist">${memory.map(m => `<article class="markcard" lang="${VERSIONS[m.ver].lang}">
      <div class="mref">${formatRef(m.b, m.c, m.v1, m.v2)} <span class="muted" style="font-weight:500">· ${VERSIONS[m.ver].short}</span></div>
      <p class="memo-verse">${esc(m.text)}</p>
      <div class="bar">${stepsHTML(m.stage)}<span class="pmeta">${m.learned ? t("memo_learned", fmtDate(m.learned)) : m.stage ? t("memo_round", m.stage + 1) : t("memo_new")}</span></div>
      <div class="actions" lang="${lang}"><button class="btn primary" data-memo-practice="${m.id}">${m.learned ? t("review") : t("practice")}</button><button class="btn" data-memo-remove="${m.id}">${t("remove")}</button></div>
    </article>`).join("")}</div>` : ""}
    <div class="settings">
      <div class="eyebrow">${t("memo_add")}</div>
      <form class="bar" id="memoform"><input class="search" id="memoref" placeholder="${esc(t("verse_ref_ph"))}" aria-label="${esc(t("memo_add"))}"><button class="btn" type="submit">${t("add")}</button></form>
      ${memoError ? `<p class="small" style="color:var(--bad)">${t("verse_not_found")}</p>` : ""}
      ${fromSaved.length ? `<p class="small muted">${t("memo_from_saved")}</p><div class="chips">${fromSaved.map(chip).join("")}</div>` : ""}
      ${popular.length ? `<p class="small muted">${t("memo_popular")}</p><div class="chips">${popular.map(chip).join("")}</div>` : ""}
    </div>`;
}

// A round hides a fifth more of the words each time: round 1 hides 20%, round 5 hides them all.
function startRound(id) {
  const m = memory.find(x => x.id === id), r = Math.min(m.stage + 1, 5);
  const tokens = m.text.split(/\s+/).filter(Boolean).map(w => {
    const k = w.match(CORE);
    return k ? { pre: k[1], core: k[2], post: k[3] } : { pre: w, core: "", post: "" };
  });
  const words = tokens.map((_, i) => i).filter(i => tokens[i].core);
  const hidden = shuffle(words).slice(0, Math.max(1, Math.ceil(words.length * r / 5))).sort((a, b) => a - b);
  memoView = { id, r, phase: "read", tokens, hidden, pos: 0, mistakes: 0, shown: [], bad: -1,
    bank: shuffle(hidden.map(i => ({ w: tokens[i].core, used: false }))) };
  renderMemo();
  scrollTo(0, 0);
}

function memoRoundHTML() {
  const v = memoView, m = memory.find(x => x.id === v.id);
  const slot = new Map(v.hidden.map((ti, k) => [ti, k]));
  const text = v.tokens.map((tk, i) => {
    if (v.phase === "read" || !slot.has(i)) return esc(tk.pre + tk.core + tk.post);
    const k = slot.get(i), filled = k < v.pos;
    const cls = filled ? (v.shown.includes(k) ? "shown" : "done") : k === v.pos ? "next" : "";
    return `${esc(tk.pre)}<span class="blank ${cls}" style="--n:${tk.core.length}">${filled ? esc(tk.core) : "&nbsp;"}</span>${esc(tk.post)}`;
  }).join(" ");
  const head = `<div><button class="btn" type="button" data-memo-back>${t("back_memo")}</button></div>
    <div class="qmeta"><span>${formatRef(m.b, m.c, m.v1, m.v2)} · ${VERSIONS[m.ver].short}</span><span>${t("memo_round", v.r)}</span></div>
    ${stepsHTML(v.phase === "done" && v.mistakes <= 1 ? v.r : v.r - 1)}
    <div class="memo-text" lang="${VERSIONS[m.ver].lang}" style="--scale:${scale}">${text}</div>`;
  if (v.phase === "read") return head + `<p class="muted" style="margin:0">${t("memo_read_first")}</p>
    <div><button class="btn primary" data-memo-start>${t("start_round", v.r)}</button></div>`;
  if (v.phase === "play") return head + `<p class="muted" style="margin:0">${t("memo_tap")}</p>
    <div class="bank">${v.bank.map((b, i) => b.used ? "" : `<button class="word${i === v.bad ? " bad" : ""}" data-word="${i}">${esc(b.w)}</button>`).join("")}</div>
    <div class="bar"><button class="btn" data-memo-show>${t("show_word")}</button><span class="muted small">${t("memo_mistakes", v.mistakes)}</span></div>`;
  const pass = v.mistakes <= 1;
  return head + `<div class="note"><strong>${pass ? (v.r === 5 ? t("memo_pass_done") : t("memo_pass_next")) : t("memo_retry")}</strong> <span class="muted">${t("memo_mistakes", v.mistakes)}.</span></div>
    <div class="bar">${pass && v.r < 5 ? `<button class="btn primary" data-memo-next>${t("next_round")}</button>` : ""}
      ${!pass ? `<button class="btn primary" data-memo-next>${t("try_again")}</button>` : ""}
      <button class="btn${pass && v.r === 5 ? " primary" : ""}" data-memo-back>${t("back_memo")}</button></div>`;
}

// Moves to the next blank; at the end, a round with one mistake or fewer counts as passed.
function memoAdvance() {
  const v = memoView;
  v.pos++;
  v.bad = -1;
  if (v.pos < v.hidden.length) return;
  v.phase = "done";
  const m = memory.find(x => x.id === v.id);
  if (v.mistakes <= 1) {
    m.stage = Math.max(m.stage, v.r);
    if (v.r === 5 && !m.learned) m.learned = Date.now();
    saveMemory();
  }
}

$("#s-memo").addEventListener("click", e => {
  const el = e.target.closest("[data-memo-back],[data-memo-practice],[data-memo-remove],[data-memo-pick],[data-memo-start],[data-word],[data-memo-show],[data-memo-next]");
  if (!el) return;
  const d = el.dataset, v = memoView;
  if (d.memoBack !== undefined) { memoView = null; scrollTo(0, 0); }
  else if (d.memoPractice) { startRound(d.memoPractice); return; }
  else if (d.memoRemove) {
    // Removing loses progress, so it takes a second tap.
    if (!el.dataset.armed) { el.dataset.armed = "1"; el.textContent = t("delete_confirm"); return; }
    memory = memory.filter(m => m.id !== d.memoRemove); saveMemory();
  }
  else if (d.memoPick) { memoError = false; addToMemory(known.get(d.memoPick)); }
  else if (d.memoStart !== undefined) v.phase = "play";
  else if (d.word) {
    const b = v.bank[+d.word], expected = v.tokens[v.hidden[v.pos]].core;
    if (fold(b.w) === fold(expected)) { b.used = true; memoAdvance(); }
    else { v.mistakes++; v.bad = +d.word; }
  }
  else if (d.memoShow !== undefined) {
    const expected = fold(v.tokens[v.hidden[v.pos]].core);
    const b = v.bank.find(x => !x.used && fold(x.w) === expected);
    if (b) b.used = true;
    v.shown.push(v.pos); v.mistakes++;
    memoAdvance();
  }
  else if (d.memoNext !== undefined) { startRound(v.id); return; }
  renderMemo();
});
$("#s-memo").addEventListener("submit", async e => {
  e.preventDefault();
  const x = await lookUpVerse($("#memoref").value);
  memoError = !x;
  if (x) addToMemory(remember(x));
  renderMemo();
});
// The Memorize button on saved verses in the Journal.
document.addEventListener("click", e => {
  const el = e.target.closest("[data-memo-add]");
  if (el) addToMemory(known.get(el.dataset.memoAdd));
});

// ---------- Back up and restore ----------
// A backup is every "lamp.*" entry this browser stores for Lamp, as JSON: { app: "lamp", version: 1, exported, data: { key: storedText } }.
function lampData() {
  const data = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith("lamp.")) data[k] = localStorage.getItem(k);
    }
  } catch {}
  return data;
}
function dataSummary(data) {
  const get = k => { try { return JSON.parse(data[k] ?? "null"); } catch { return null; } };
  return t("backup_counts", {
    prayers: (get("lamp.prayers") || []).length, marks: Object.keys(get("lamp.marks") || {}).length,
    saved: (get("lamp.saved") || []).length, plans: Object.keys(get("lamp.plans") || {}).length, memory: (get("lamp.memory") || []).length,
  });
}
const backupText = () => JSON.stringify({ app: "lamp", version: 1, exported: new Date().toISOString(), data: lampData() });
function renderBackup() {
  $("#backup-summary").textContent = t("backup_now", dataSummary(lampData()));
}

// Inside Claude, files are saved through the viewer's "downloads" permission; on Lamp's own website, a normal download link works.
let downloads = null;
(async () => {
  if (window.claude && window.claude.use) downloads = await window.claude.use("downloads");
  $("#backup-save").hidden = !(downloads || !window.claude);
})();
$("#backup-save").addEventListener("click", async () => {
  const filename = `lamp-backup-${dateKey(new Date())}.json`, text = backupText();
  if (downloads) {
    try { await downloads.save({ filename, data: text }); toast(t("toast_backup_saved")); }
    catch (err) { if (err && err.code !== "declined") toast(t("backup_failed")); }
    return;
  }
  saveFile(filename, text, "application/json");
});
function saveFile(filename, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = filename;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$("#backup-copy").addEventListener("click", () => {
  const text = backupText(), box = $("#backup-text");
  navigator.clipboard.writeText(text).then(() => { box.hidden = true; toast(t("toast_backup_copied")); }, () => {
    // Clipboard refused: show the text selected so it can be copied by hand.
    box.value = text; box.hidden = false; box.focus(); box.select();
    toast(t("toast_selected"));
  });
});

let pendingRestore = null;
function checkBackup(text) {
  let b = null;
  try { b = JSON.parse(text); } catch {}
  const ok = b && b.app === "lamp" && b.data && typeof b.data === "object"
    && Object.entries(b.data).every(([k, v]) => k.startsWith("lamp.") && typeof v === "string");
  pendingRestore = ok ? b.data : null;
  $("#restore-preview").innerHTML = ok
    ? `<div class="note">${esc(t("restore_found", fmtDate(Date.parse(b.exported) || Date.now()), dataSummary(b.data)))}</div>
       <div style="margin-top:10px"><button class="btn primary" type="button" id="restore-go">${t("restore_go")}</button></div>`
    : `<p class="small" style="color:var(--bad)">${t("backup_bad")}</p>`;
}
$("#restore-file").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => checkBackup(String(r.result));
  r.readAsText(f);
  e.target.value = "";
});
$("#restore-check").addEventListener("click", () => checkBackup($("#restore-text").value.trim()));
$("#restore-preview").addEventListener("click", e => {
  const b = e.target.closest("#restore-go");
  if (!b || !pendingRestore) return;
  // Restoring replaces everything, so it takes a second tap.
  if (!b.dataset.armed) { b.dataset.armed = "1"; b.textContent = t("restore_confirm"); return; }
  try {
    Object.keys(lampData()).forEach(k => localStorage.removeItem(k));
    Object.entries(pendingRestore).forEach(([k, v]) => localStorage.setItem(k, v));
  } catch { toast(t("backup_failed")); return; }
  toast(t("restore_done"));
  setTimeout(() => location.reload(), 700);
});

// ---------- Reminder and home screen ----------
// Lamp's own website links its manifest; inside Claude the page runs in a frame and can't read its own claude.ai address.
const STANDALONE = !!document.querySelector('link[rel="manifest"]');
const APP_URL = STANDALONE ? location.origin + location.pathname.replace(/index\.html$/, "") : "https://claude.ai/artifact/4tpcdmg1wGh8VMUUYucnDW";
if (STANDALONE) {
  for (const [id, key] of [["rnote", "reminder_note_site"], ["home-help", "home_help_site"]]) $("#" + id).dataset.t = key;
  $("#home-ios ol").dataset.t = "home_ios_site";
  $("#home-android ol").dataset.t = "home_android_site";
  $("#rics").hidden = false;
}
const pad = n => String(n).padStart(2, "0");
function reminderStart() {
  const [h, m] = ($("#rtime").value || "08:00").split(":").map(Number);
  const start = new Date(); start.setHours(h, m, 0, 0);
  if (start < new Date()) start.setDate(start.getDate() + 1);
  return start;
}
const stamp = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
function reminderLink() {
  const start = reminderStart(), end = new Date(start.getTime() + 10 * 60000);
  const params = new URLSearchParams({
    action: "TEMPLATE", text: t("reminder_event"), details: t("reminder_details", APP_URL),
    dates: `${stamp(start)}/${stamp(end)}`, recur: "RRULE:FREQ=DAILY",
    ctz: Intl.DateTimeFormat().resolvedOptions().timeZone,
  });
  return "https://calendar.google.com/calendar/render?" + params;
}
// The same daily event as a calendar file, for Apple Calendar and Outlook (floating local time, with a reminder at the start).
$("#rics").addEventListener("click", () => {
  const start = reminderStart(), end = new Date(start.getTime() + 10 * 60000);
  const text = s => s.replace(/[\\;,]/g, c => "\\" + c).replace(/\n/g, "\\n");
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Lamp//Bible Companion//EN", "BEGIN:VEVENT",
    `UID:lamp-reminder-${Date.now()}@lamp`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").slice(0, 15)}Z`,
    `DTSTART:${stamp(start)}`, `DTEND:${stamp(end)}`, "RRULE:FREQ=DAILY",
    `SUMMARY:${text(t("reminder_event"))}`, `DESCRIPTION:${text(t("reminder_details", APP_URL))}`, `URL:${APP_URL}`,
    "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${text(t("reminder_event"))}`, "TRIGGER:PT0M", "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  saveFile("lamp-reminder.ics", ics, "text/calendar");
});
// Lamp's website calls this when a new version arrived while Lamp was open (see the service worker setup at the end of the page).
window.lampUpdated = () => { $("#updatebar").hidden = false; };
$("#update-go").addEventListener("click", () => location.reload());
$("#update-later").addEventListener("click", () => { $("#updatebar").hidden = true; });
// Installing: Chrome and Edge offer their own prompt; Safari needs the Share steps.
let installPrompt = null;
const isInstalled = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installPrompt = e; $("#install").hidden = false; });
addEventListener("appinstalled", () => { installPrompt = null; $("#install").hidden = true; });
$("#install").addEventListener("click", async () => {
  if (!installPrompt) return;
  installPrompt.prompt();
  await installPrompt.userChoice;
  installPrompt = null; $("#install").hidden = true;
});
if (STANDALONE && isInstalled()) {
  // Already opened from the home screen: no steps needed.
  $("#home-help").dataset.t = "installed";
  ["#home-ios", "#home-android"].forEach(s => $(s).hidden = true);
}
function renderExtras() {
  $("#rlink").href = reminderLink();
  $("#applink").textContent = APP_URL;
  $("#tellfriend").dataset.share = t("share_app");
}
$("#rtime").value = load("lamp.remind", "08:00");
$("#rtime").addEventListener("change", () => { store("lamp.remind", $("#rtime").value); renderExtras(); });
// Open the steps for the phone this is, if we can tell.
const ua = navigator.userAgent;
if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) $("#home-ios").open = true;
else if (/Android/.test(ua)) $("#home-android").open = true;
$("#copylink").addEventListener("click", () => {
  navigator.clipboard.writeText(APP_URL).then(() => toast(t("toast_link")), () => {
    const r = document.createRange(); r.selectNodeContents($("#applink"));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    toast(t("toast_selected"));
  });
});

$("#mood").value = T[lang].find_example;
refreshAll();
