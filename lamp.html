  "Luke 2:8": {"kjv": "And there were in the same country shepherds abiding in the field, keeping watch over their flock by night.", "bsb": "And there were shepherds residing in the fields nearby, keeping watch over their flocks by night.", "web": "There were shepherds in the same country staying in the field, and keeping watch by night over their flock.", "lsg": "Il y avait, dans cette même contrée, des bergers qui passaient dans les champs les veilles de la nuit pour garder leurs troupeaux.", "lsgRef": "Luc 2:8"},
  "Luke 5:8": {"kjv": "When Simon Peter saw it, he fell down at Jesus’ knees, saying, Depart from me; for I am a sinful man, O Lord.", "bsb": "When Simon Peter saw this, he fell at Jesus’ knees. “Go away from me, Lord,” he said, “for I am a sinful man.”", "web": "But Simon Peter, when he saw it, fell down at Jesus’ knees, saying, “Depart from me, for I am a sinful man, Lord.”", "lsg": "Quand il vit cela, Simon Pierre tomba aux genoux de Jésus, et dit: Seigneur, retire-toi de moi, parce que je suis un homme pécheur.", "lsgRef": "Luc 5:8"},
  "Luke 6:13": {"kjv": "And when it was day, he called unto him his disciples: and of them he chose twelve, whom also he named apostles;", "bsb": "When daylight came, He called His disciples to Him and chose twelve of them, whom He also designated as apostles:", "web": "When it was day, he called his disciples, and from them he chose twelve, whom he also named apostles:", "lsg": "Quand le jour parut, il appela ses disciples, et il en choisit douze, auxquels il donna le nom d’apôtres:", "lsgRef": "Luc 6:13"},
  "Luke 7:11-12": {"kjv": "And it came to pass the day after, that he went into a city called Nain; and many of his disciples went with him, and much people. Now when he came nigh to the gate of the city, behold, there was a dead man carried out, the only son of his mother, and she was a widow: and much people of the city was with her.", "bsb": "Soon afterward, Jesus went to a town called Nain. His disciples went with Him, accompanied by a large crowd. As He approached the town gate, He saw a dead man being carried out, the only son of his mother, and she was a widow. And a large crowd from the town was with her.", "web": "Soon afterwards, he went to a city called Nain. Many of his disciples, along with a great multitude, went with him. Now when he came near to the gate of the city, behold, one who was dead was carried out, the only born son of his mother, and she was a widow. Many people of the city were with her.", "lsg": "Le jour suivant, Jésus alla dans une ville appelée Naïn; ses disciples et une grande foule faisaient route avec lui. Lorsqu’il fut près de la porte de la ville, voici, on portait en terre un mort, fils unique de sa mère, qui était veuve; et il y avait avec elle beaucoup de gens de la ville.", "lsgRef": "Luc 7:11-12"},
  "Luke 8:41-42": {"kjv": "And, behold, there came a man named Jairus, and he was a ruler of the synagogue: and he fell down at Jesus’ feet, and besought him that he would come into his house: For he had one only daughter, about twelve years of age, and she lay a dying. But as he went the people thronged him.", "bsb": "Just then a synagogue leader named Jairus came and fell at Jesus’ feet. He begged Him to come to his house, because his only daughter, who was about twelve, was dying. As Jesus went with him, the crowds pressed around Him,", "web": "Behold, a man named Jairus came. He was a ruler of the synagogue. He fell down at Jesus’ feet and begged him to come into his house, for he had an only born daughter, about twelve years of age, and she was dying. But as he went, the multitudes pressed against him.", "lsg": "Et voici, il vint un homme, nommé Jaïrus, qui était chef de la synagogue. Il se jeta à ses pieds, et le supplia d’entrer dans sa maison, parce qu’il avait une fille unique d’environ douze ans qui se mourait. Pendant que Jésus y allait, il était pressé par la foule.", "lsgRef": "Luc 8:41-42"},
  "Mark 10:46": {"kjv": "And they came to Jericho: and as he went out of Jericho with his disciples and a great number of people, blind Bartimeus, the son of Timeus, sat by the highway side begging.", "bsb": "Next, they came to Jericho. And as Jesus and His disciples were leaving Jericho with a large crowd, a blind beggar named Bartimaeus, the son of Timaeus, was sitting beside the road.", "web": "They came to Jericho. As he went out from Jericho with his disciples and a great multitude, the son of Timaeus, Bartimaeus, a blind beggar, was sitting by the road.", "lsg": "Ils arrivèrent à Jéricho. Et, lorsque Jésus en sortit, avec ses disciples et une assez grande foule, le fils de Timée, Bartimée, mendiant aveugle, était assis au bord du chemin.", "lsgRef": "Marc 10:46"},
  "Mark 15:21": {"kjv": "And they compel one Simon a Cyrenian, who passed by, coming out of the country, the father of Alexander and Rufus, to bear his cross.", "bsb": "Now Simon of Cyrene, the father of Alexander and Rufus, was passing by on his way in from the country, and the soldiers forced him to carry the cross of Jesus.", "web": "They compelled one passing by, coming from the country, Simon of Cyrene, the father of Alexander and Rufus, to go with them that he might bear his cross.", "lsg": "Ils forcèrent à porter la croix de Jésus un passant qui revenait des champs, Simon de Cyrène, père d’Alexandre et de Rufus;", "lsgRef": "Marc 15:21"},
  "Mark 1:9": {"kjv": "And it came to pass in those days, that Jesus came from Nazareth of Galilee, and was baptized of John in Jordan.", "bsb": "In those days Jesus came from Nazareth in Galilee and was baptized by John in the Jordan.", "web": "In those days, Jesus came from Nazareth of Galilee, and was baptized by John in the Jordan.", "lsg": "En ce temps-là, Jésus vint de Nazareth en Galilée, et il fut baptisé par Jean dans le Jourdain.", "lsgRef": "Marc 1:9"},
  "Mark 4:37-39": {"kjv": "And there arose a great storm of wind, and the waves beat into the ship, so that it was now full. And he was in the hinder part of the ship, asleep on a pillow: and they awake him, and say unto him, Master, carest thou not that we perish? And he arose, and rebuked the wind, and said unto the sea, Peace, be still. And the wind ceased, and there was a great calm.", "bsb": "Soon a violent windstorm came up, and the waves were breaking over the boat, so that it was being swamped. But Jesus was in the stern, sleeping on the cushion. So they woke Him and said, “Teacher, don’t You care that we are perishing?” Then Jesus got up and rebuked the wind and the sea. “Silence!” He commanded. “Be still!” And the wind died down, and it was perfectly calm.", "web": "A big wind storm arose, and the waves beat into the boat, so much that the boat was already filled. He himself was in the stern, asleep on the cushion; and they woke him up and asked him, “Teacher, don’t you care that we are dying?” He awoke and rebuked the wind, and said to the sea, “Peace! Be still!” The wind ceased and there was a great calm.", "lsg": "Il s’éleva un grand tourbillon, et les flots se jetaient dans la barque, au point qu’elle se remplissait déjà. Et lui, il dormait à la poupe sur le coussin. Ils le réveillèrent, et lui dirent: Maître, ne t’inquiètes-tu pas de ce que nous périssons? S’étant réveillé, il menaça le vent, et dit à la mer: Silence! Tais-toi! Et le vent cessa, et il y eut un grand calme.", "lsgRef": "Marc 4:37-39"},
  "Mark 9:24": {"kjv": "And straightway the father of the child cried out, and said with tears, Lord, I believe; help thou mine unbelief.", "bsb": "Immediately the boy’s father cried out, “I do believe; help my unbelief!”", "web": "Immediately the father of the child cried out with tears, “I believe. Help my unbelief!”", "lsg": "Aussitôt le père de l’enfant s’écria: Je crois! Viens au secours de mon incrédulité!", "lsgRef": "Marc 9:24"},
  "Matthew 13:31": {"kjv": "Another parable put he forth unto them, saying, The kingdom of heaven is like to a grain of mustard seed, which a man took, and sowed in his field:", "bsb": "He put before them another parable: “The kingdom of heaven is like a mustard seed that a man planted in his field.", "web": "He set another parable before them, saying, “The Kingdom of Heaven is like a grain of mustard seed which a man took, and sowed in his field,", "lsg": "Il leur proposa une autre parabole, et il dit: Le royaume des cieux est semblable à un grain de sénevé qu’un homme a pris et semé dans son champ.", "lsgRef": "Matthieu 13:31"},
  "Matthew 14:17": {"kjv": "And they say unto him, We have here but five loaves, and two fishes.", "bsb": "“We have here only five loaves of bread and two fish,” they answered.", "web": "They told him, “We only have here five loaves and two fish.”", "lsg": "Mais ils lui dirent: Nous n’avons ici que cinq pains et deux poissons.", "lsgRef": "Matthieu 14:17"},
  "Matthew 14:29": {"kjv": "And he said, Come. And when Peter was come down out of the ship, he walked on the water, to go to Jesus.", "bsb": "“Come,” said Jesus. Then Peter got down out of the boat, walked on the water, and came toward Jesus.", "web": "He said, “Come!” Peter stepped down from the boat and walked on the waters to come to Jesus.", "lsg": "Et il dit: Viens! Pierre sortit de la barque, et marcha sur les eaux, pour aller vers Jésus.", "lsgRef": "Matthieu 14:29"},
  "Matthew 16:16": {"kjv": "And Simon Peter answered and said, Thou art the Christ, the Son of the living God.", "bsb": "Simon Peter answered, “You are the Christ, the Son of the living God.”", "web": "Simon Peter answered, “You are the Christ, the Son of the living God.”", "lsg": "Simon Pierre répondit: Tu es le Christ, le Fils du Dieu vivant.", "lsgRef": "Matthieu 16:16"},
  "Matthew 17:1-2": {"kjv": "And after six days Jesus taketh Peter, James, and John his brother, and bringeth them up into an high mountain apart, And was transfigured before them: and his face did shine as the sun, and his raiment was white as the light.", "bsb": "After six days Jesus took with Him Peter, James, and John the brother of James, and led them up a high mountain by themselves. There He was transfigured before them. His face shone like the sun, and His clothes became as white as the light.", "web": "After six days, Jesus took with him Peter, James, and John his brother, and brought them up into a high mountain by themselves. He was changed before them. His face shone like the sun, and his garments became as white as the light.", "lsg": "Six jours après, Jésus prit avec lui Pierre, Jacques, et Jean, son frère, et il les conduisit à l’écart sur une haute montagne. Il fut transfiguré devant eux; son visage resplendit comme le soleil, et ses vêtements devinrent blancs comme la lumière.", "lsgRef": "Matthieu 17:1-2"},
  "Matthew 1:16": {"kjv": "And Jacob begat Joseph the husband of Mary, of whom was born Jesus, who is called Christ.", "bsb": "and Jacob the father of Joseph, the husband of Mary, of whom was born Jesus, who is called Christ.", "web": "Jacob became the father of Joseph, the husband of Mary, from whom was born Jesus, who is called Christ.", "lsg": "Jacob engendra Joseph, l’époux de Marie, de laquelle est né Jésus, qui est appelé Christ.", "lsgRef": "Matthieu 1:16"},
  "Matthew 21:12": {"kjv": "And Jesus went into the temple of God, and cast out all them that sold and bought in the temple, and overthrew the tables of the moneychangers, and the seats of them that sold doves,", "bsb": "Then Jesus entered the temple courts and drove out all who were buying and selling there. He overturned the tables of the money changers and the seats of those selling doves.", "web": "Jesus entered into the temple of God and drove out all of those who sold and bought in the temple, and overthrew the money changers’ tables and the seats of those who sold the doves.", "lsg": "Jésus entra dans le temple de Dieu. Il chassa tous ceux qui vendaient et qui achetaient dans le temple; il renversa les tables des changeurs, et les sièges des vendeurs de pigeons.", "lsgRef": "Matthieu 21:12"},
  "Matthew 26:14-15": {"kjv": "Then one of the twelve, called Judas Iscariot, went unto the chief priests, And said unto them, What will ye give me, and I will deliver him unto you? And they covenanted with him for thirty pieces of silver.", "bsb": "Then one of the Twelve, the one called Judas Iscariot, went to the chief priests and asked, “What are you willing to give me if I hand Him over to you?” And they set out for him thirty pieces of silver.", "web": "Then one of the twelve, who was called Judas Iscariot, went to the chief priests and said, “What are you willing to give me if I deliver him to you?” So they weighed out for him thirty pieces of silver.", "lsg": "Alors l’un des douze, appelé Judas Iscariot, alla vers les principaux sacrificateurs, et dit: Que voulez-vous me donner, et je vous le livrerai? Et ils lui payèrent trente pièces d’argent.", "lsgRef": "Matthieu 26:14-15"},
  "Matthew 26:36": {"kjv": "Then cometh Jesus with them unto a place called Gethsemane, and saith unto the disciples, Sit ye here, while I go and pray yonder.", "bsb": "At that time Jesus went with His disciples to a place called Gethsemane, and He told them, “Sit here while I go over there and pray.”", "web": "Then Jesus came with them to a place called Gethsemane, and said to his disciples, “Sit here, while I go there and pray.”", "lsg": "Là-dessus, Jésus alla avec eux dans un lieu appelé Gethsémané, et il dit aux disciples: Asseyez-vous ici, pendant que je m’éloignerai pour prier.", "lsgRef": "Matthieu 26:36"},
  "Matthew 26:57": {"kjv": "And they that had laid hold on Jesus led him away to Caiaphas the high priest, where the scribes and the elders were assembled.", "bsb": "Those who had arrested Jesus led Him away to the house of Caiaphas the high priest, where the scribes and elders had gathered.", "web": "Those who had taken Jesus led him away to Caiaphas the high priest, where the scribes and the elders were gathered together.", "lsg": "Ceux qui avaient saisi Jésus l’emmenèrent chez le souverain sacrificateur Caïphe, où les scribes et les anciens étaient assemblés.", "lsgRef": "Matthieu 26:57"},
  "Matthew 27:2": {"kjv": "And when they had bound him, they led him away, and delivered him to Pontius Pilate the governor.", "bsb": "They bound Him, led Him away, and handed Him over to Pilate the governor.", "web": "They bound him, led him away, and delivered him up to Pontius Pilate, the governor.", "lsg": "Après l’avoir lié, ils l’emmenèrent, et le livrèrent à Ponce Pilate, le gouverneur.", "lsgRef": "Matthieu 27:2"},
  "Matthew 27:24": {"kjv": "When Pilate saw that he could prevail nothing, but that rather a tumult was made, he took water, and washed his hands before the multitude, saying, I am innocent of the blood of this just person: see ye to it.", "bsb": "When Pilate saw that he was accomplishing nothing, but that instead a riot was breaking out, he took water and washed his hands before the crowd. “I am innocent of this man’s blood,” he said. “You bear the responsibility.”", "web": "So when Pilate saw that nothing was being gained, but rather that a disturbance was starting, he took water and washed his hands before the multitude, saying, “I am innocent of the blood of this righteous person. You see to it.”", "lsg": "Pilate, voyant qu’il ne gagnait rien, mais que le tumulte augmentait, prit de l’eau, se lava les mains en présence de la foule, et dit: Je suis innocent du sang de ce juste. Cela vous regarde.", "lsgRef": "Matthieu 27:24"},
  "Matthew 27:26": {"kjv": "Then released he Barabbas unto them: and when he had scourged Jesus, he delivered him to be crucified.", "bsb": "So Pilate released Barabbas to them. But he had Jesus flogged, and handed Him over to be crucified.", "web": "Then he released Barabbas to them, but Jesus he flogged and delivered to be crucified.", "lsg": "Alors Pilate leur relâcha Barabbas; et, après avoir fait battre de verges Jésus, il le livra pour être crucifié.", "lsgRef": "Matthieu 27:26"},
  "Matthew 27:33": {"kjv": "And when they were come unto a place called Golgotha, that is to say, a place of a skull,", "bsb": "And when they came to a place called Golgotha, which means The Place of the Skull,", "web": "When they came to a place called “Golgotha”, that is to say, “The place of a skull,”", "lsg": "Arrivés au lieu nommé Golgotha, ce qui signifie lieu du crâne,", "lsgRef": "Matthieu 27:33"},
  "Matthew 2:1": {"kjv": "Now when Jesus was born in Bethlehem of Judea in the days of Herod the king, behold, there came wise men from the east to Jerusalem,", "bsb": "After Jesus was born in Bethlehem in Judea, during the time of King Herod, Magi from the east arrived in Jerusalem,", "web": "Now when Jesus was born in Bethlehem of Judea in the days of King Herod, behold, wise men from the east came to Jerusalem, saying,", "lsg": "Jésus étant né à Bethléhem en Judée, au temps du roi Hérode, voici des mages d’Orient arrivèrent à Jérusalem,", "lsgRef": "Matthieu 2:1"},
  "Matthew 2:11": {"kjv": "And when they were come into the house, they saw the young child with Mary his mother, and fell down, and worshipped him: and when they had opened their treasures, they presented unto him gifts; gold, and frankincense, and myrrh.", "bsb": "On coming to the house, they saw the Child with His mother Mary, and they fell down and worshiped Him. Then they opened their treasures and presented Him with gifts of gold and frankincense and myrrh.", "web": "They came into the house and saw the young child with Mary, his mother, and they fell down and worshiped him. Opening their treasures, they offered to him gifts: gold, frankincense, and myrrh.", "lsg": "Ils entrèrent dans la maison, virent le petit enfant avec Marie, sa mère, se prosternèrent et l’adorèrent; ils ouvrirent ensuite leurs trésors, et lui offrirent en présent de l’or, de l’encens et de la myrrhe.", "lsgRef": "Matthieu 2:11"},
  "Matthew 2:13": {"kjv": "And when they were departed, behold, the angel of the Lord appeareth to Joseph in a dream, saying, Arise, and take the young child and his mother, and flee into Egypt, and be thou there until I bring thee word: for Herod will seek the young child to destroy him.", "bsb": "When the Magi had gone, an angel of the Lord appeared to Joseph in a dream. “Get up!” he said. “Take the Child and His mother and flee to Egypt. Stay there until I tell you, for Herod is going to search for the Child to kill Him.”", "web": "Now when they had departed, behold, an angel of the Lord appeared to Joseph in a dream, saying, “Arise and take the young child and his mother, and flee into Egypt, and stay there until I tell you, for Herod will seek the young child to destroy him.”", "lsg": "Lorsqu’ils furent partis, voici, un ange du Seigneur apparut en songe à Joseph, et dit: Lève-toi, prends le petit enfant et sa mère, fuis en Égypte, et restes-y jusqu’à ce que je te parle; car Hérode cherchera le petit enfant pour le faire périr.", "lsgRef": "Matthieu 2:13"},
  "Matthew 2:2": {"kjv": "Saying, Where is he that is born King of the Jews? for we have seen his star in the east, and are come to worship him.", "bsb": "asking, “Where is the One who has been born King of the Jews? We saw His star in the east and have come to worship Him.”", "web": "“Where is he who is born King of the Jews? For we saw his star in the east, and have come to worship him.”", "lsg": "et dirent: Où est le roi des Juifs qui vient de naître? Car nous avons vu son étoile en Orient, et nous sommes venus pour l’adorer.", "lsgRef": "Matthieu 2:2"},
  "Matthew 2:22": {"kjv": "But when he heard that Archelaus did reign in Judea in the room of his father Herod, he was afraid to go thither: notwithstanding, being warned of God in a dream, he turned aside into the parts of Galilee:", "bsb": "But when he learned that Archelaus was reigning in Judea in place of his father Herod, he was afraid to go there. And having been warned in a dream, he withdrew to the district of Galilee,", "web": "But when he heard that Archelaus was reigning over Judea in the place of his father, Herod, he was afraid to go there. Being warned in a dream, he withdrew into the region of Galilee,", "lsg": "Mais, ayant appris qu’Archélaüs régnait sur la Judée à la place d’Hérode, son père, il craignit de s’y rendre; et, divinement averti en songe, il se retira dans le territoire de la Galilée,", "lsgRef": "Matthieu 2:22"},
  "Matthew 3:4": {"kjv": "And the same John had his raiment of camel’s hair, and a leathern girdle about his loins; and his meat was locusts and wild honey.", "bsb": "John wore a garment of camel’s hair, with a leather belt around his waist. His food was locusts and wild honey.", "web": "Now John himself wore clothing made of camel’s hair with a leather belt around his waist. His food was locusts and wild honey.", "lsg": "Jean avait un vêtement de poils de chameau, et une ceinture de cuir autour des reins. Il se nourrissait de sauterelles et de miel sauvage.", "lsgRef": "Matthieu 3:4"},
  "Matthew 4:19": {"kjv": "And he saith unto them, Follow me, and I will make you fishers of men.", "bsb": "“Come, follow Me,” Jesus said, “and I will make you fishers of men.”", "web": "He said to them, “Come after me, and I will make you fishers for men.”", "lsg": "Il leur dit: Suivez-moi, et je vous ferai pêcheurs d’hommes.", "lsgRef": "Matthieu 4:19"},
  "Matthew 4:2": {"kjv": "And when he had fasted forty days and forty nights, he was afterward an hungred.", "bsb": "After fasting forty days and forty nights, He was hungry.", "web": "When he had fasted forty days and forty nights, he was hungry afterward.", "lsg": "Après avoir jeûné quarante jours et quarante nuits, il eut faim.", "lsgRef": "Matthieu 4:2"},
  "Matthew 8:8": {"kjv": "The centurion answered and said, Lord, I am not worthy that thou shouldest come under my roof: but speak the word only, and my servant shall be healed.", "bsb": "The centurion answered, “Lord, I am not worthy to have You come under my roof. But just say the word, and my servant will be healed.", "web": "The centurion answered, “Lord, I’m not worthy for you to come under my roof. Just say the word, and my servant will be healed.", "lsg": "Le centenier répondit: Seigneur, je ne suis pas digne que tu entres sous mon toit; mais dis seulement un mot, et mon serviteur sera guéri.", "lsgRef": "Matthieu 8:8"},
  "Matthew 9:9": {"kjv": "And as Jesus passed forth from thence, he saw a man, named Matthew, sitting at the receipt of custom: and he saith unto him, Follow me. And he arose, and followed him.", "bsb": "As Jesus went on from there, He saw a man named Matthew sitting at the tax booth. “Follow Me,” He told him, and Matthew got up and followed Him.", "web": "As Jesus passed by from there, he saw a man called Matthew sitting at the tax collection office. He said to him, “Follow me.” He got up and followed him.", "lsg": "De là étant allé plus loin, Jésus vit un homme assis au lieu des péages, et qui s’appelait Matthieu. Il lui dit: Suis-moi. Cet homme se leva, et le suivit.", "lsgRef": "Matthieu 9:9"},
  "Nehemiah 2:1": {"kjv": "And it came to pass in the month Nisan, in the twentieth year of Artaxerxes the king, that wine was before him: and I took up the wine, and gave it unto the king. Now I had not been beforetime sad in his presence.", "bsb": "Now in the month of Nisan, in the twentieth year of King Artaxerxes, when wine was set before him, I took the wine and gave it to the king. I had never been sad in his presence,", "web": "In the month Nisan, in the twentieth year of Artaxerxes the king, when wine was before him, I picked up the wine, and gave it to the king. Now I had not been sad before in his presence.", "lsg": "Au mois de Nisan, la vingtième année du roi Artaxerxès, comme le vin était devant lui, je pris le vin et je l’offris au roi. Jamais je n’avais paru triste en sa présence.", "lsgRef": "Néhémie 2:1"},
  "Numbers 14:33": {"kjv": "And your children shall wander in the wilderness forty years, and bear your whoredoms, until your carcases be wasted in the wilderness.", "bsb": "Your children will be shepherds in the wilderness for forty years, and they will suffer for your unfaithfulness until the last of your bodies lies in the wilderness.", "web": "Your children shall be wanderers in the wilderness forty years, and shall bear your prostitution, until your dead bodies are consumed in the wilderness.", "lsg": "et vos enfants paîtront quarante années dans le désert, et porteront la peine de vos infidélités, jusqu’à ce que vos cadavres soient tous tombés dans le désert.", "lsgRef": "Nombres 14:33"},
  "Numbers 14:6": {"kjv": "And Joshua the son of Nun, and Caleb the son of Jephunneh, which were of them that searched the land, rent their clothes:", "bsb": "Joshua son of Nun and Caleb son of Jephunneh, who were among those who had spied out the land, tore their clothes", "web": "Joshua the son of Nun and Caleb the son of Jephunneh, who were of those who spied out the land, tore their clothes.", "lsg": "Et, parmi ceux qui avaient exploré le pays, Josué, fils de Nun, et Caleb, fils de Jephunné, déchirèrent leurs vêtements,", "lsgRef": "Nombres 14:6"},
  "Numbers 16:32": {"kjv": "And the earth opened her mouth, and swallowed them up, and their houses, and all the men that appertained unto Korah, and all their goods.", "bsb": "and the earth opened its mouth and swallowed them and their households—all Korah’s men and all their possessions.", "web": "The earth opened its mouth and swallowed them up with their households, all of Korah’s men, and all their goods.", "lsg": "La terre ouvrit sa bouche, et les engloutit, eux et leurs maisons, avec tous les gens de Koré et tous leurs biens.", "lsgRef": "Nombres 16:32"},
  "Numbers 21:9": {"kjv": "And Moses made a serpent of brass, and put it upon a pole, and it came to pass, that if a serpent had bitten any man, when he beheld the serpent of brass, he lived.", "bsb": "So Moses made a bronze snake and mounted it on a pole. If anyone who was bitten looked at the bronze snake, he would live.", "web": "Moses made a serpent of bronze, and set it on the pole. If a serpent had bitten any man, when he looked at the serpent of bronze, he lived.", "lsg": "Moïse fit un serpent d’airain, et le plaça sur une perche; et quiconque avait été mordu par un serpent, et regardait le serpent d’airain, conservait la vie.", "lsgRef": "Nombres 21:9"},
  "Numbers 22:28": {"kjv": "And the LORD opened the mouth of the ass, and she said unto Balaam, What have I done unto thee, that thou hast smitten me these three times?", "bsb": "Then the LORD opened the donkey’s mouth, and she said to Balaam, “What have I done to you that you have beaten me these three times?”", "web": "The LORD opened the mouth of the donkey, and she said to Balaam, “What have I done to you, that you have struck me these three times?”", "lsg": "L’Éternel ouvrit la bouche de l’ânesse, et elle dit à Balaam: Que t’ai-je fait, pour que tu m’aies frappée déjà trois fois?", "lsgRef": "Nombres 22:28"},
  "Philemon 1:10": {"kjv": "I beseech thee for my son Onesimus, whom I have begotten in my bonds:", "bsb": "I appeal to you for my child Onesimus, whose father I became while I was in chains.", "web": "I appeal to you for my child Onesimus, whom I have become the father of in my chains,", "lsg": "Je te prie pour mon enfant, que j’ai engendré étant dans les chaînes, Onésime,", "lsgRef": "Philémon 1:10"},
  "Philippians 4:13": {"kjv": "I can do all things through Christ which strengtheneth me.", "bsb": "I can do all things through Christ who gives me strength.", "web": "I can do all things through Christ who strengthens me.", "lsg": "Je puis tout par celui qui me fortifie.", "lsgRef": "Philippiens 4:13"},
  "Psalm 23:1": {"kjv": "A Psalm of David. The LORD is my shepherd; I shall not want.", "bsb": "A Psalm of David. The LORD is my shepherd; I shall not want.", "web": "A Psalm by David. The LORD is my shepherd; I shall lack nothing.", "lsg": "Cantique de David. L’Éternel est mon berger: je ne manquerai de rien.", "lsgRef": "Psaume 23:1"},
  "Psalms 23:1": {"kjv": "A Psalm of David. The LORD is my shepherd; I shall not want.", "bsb": "A Psalm of David. The LORD is my shepherd; I shall not want.", "web": "A Psalm by David. The LORD is my shepherd; I shall lack nothing.", "lsg": "Cantique de David. L’Éternel est mon berger: je ne manquerai de rien.", "lsgRef": "Psaume 23:1"},
  "Revelation 1:11": {"kjv": "Saying, I am Alpha and Omega, the first and the last: and, What thou seest, write in a book, and send it unto the seven churches which are in Asia; unto Ephesus, and unto Smyrna, and unto Pergamos, and unto Thyatira, and unto Sardis, and unto Philadelphia, and unto Laodicea.", "bsb": "saying, “Write on a scroll what you see and send it to the seven churches: to Ephesus, Smyrna, Pergamum, Thyatira, Sardis, Philadelphia, and Laodicea.”", "web": "saying, “What you see, write in a book and send to the seven assemblies: to Ephesus, Smyrna, Pergamum, Thyatira, Sardis, Philadelphia, and to Laodicea.”", "lsg": "qui disait: Ce que tu vois, écris-le dans un livre, et envoie-le aux sept Églises, à Éphèse, à Smyrne, à Pergame, à Thyatire, à Sardes, à Philadelphie, et à Laodicée.", "lsgRef": "Apocalypse 1:11"},
  "Revelation 1:9": {"kjv": "I John, who also am your brother, and companion in tribulation, and in the kingdom and patience of Jesus Christ, was in the isle that is called Patmos, for the word of God, and for the testimony of Jesus Christ.", "bsb": "I, John, your brother and partner in the tribulation and kingdom and perseverance that are in Jesus, was on the island of Patmos because of the word of God and my testimony about Jesus.", "web": "I John, your brother and partner with you in the oppression, Kingdom, and perseverance in Christ Jesus, was on the isle that is called Patmos because of God’s Word and the testimony of Jesus Christ.", "lsg": "Moi Jean, votre frère, et qui ai part avec vous à la tribulation et au royaume et à la persévérance en Jésus, j’étais dans l’île appelée Patmos, à cause de la parole de Dieu et du témoignage de Jésus.", "lsgRef": "Apocalypse 1:9"},
  "Revelation 22:21": {"kjv": "The grace of our Lord Jesus Christ be with you all. Amen.", "bsb": "The grace of the Lord Jesus be with all the saints. Amen.", "web": "The grace of the Lord Jesus Christ be with all the saints. Amen.", "lsg": "Que la grâce du Seigneur Jésus soit avec tous!", "lsgRef": "Apocalypse 22:21"},
  "Ruth 1:16": {"kjv": "And Ruth said, Intreat me not to leave thee, or to return from following after thee: for whither thou goest, I will go; and where thou lodgest, I will lodge: thy people shall be my people, and thy God my God:", "bsb": "But Ruth replied: “Do not urge me to leave you or to turn from following you. For wherever you go, I will go, and wherever you live, I will live; your people will be my people, and your God will be my God.", "web": "Ruth said, “Don’t urge me to leave you, and to return from following you, for where you go, I will go; and where you stay, I will stay. Your people will be my people, and your God my God.", "lsg": "Ruth répondit: Ne me presse pas de te laisser, de retourner loin de toi! Où tu iras j’irai, où tu demeureras je demeurerai; ton peuple sera mon peuple, et ton Dieu sera mon Dieu;", "lsgRef": "Ruth 1:16"},
  "Ruth 1:20": {"kjv": "And she said unto them, Call me not Naomi, call me Mara: for the Almighty hath dealt very bitterly with me.", "bsb": "“Do not call me Naomi,” she replied. “Call me Mara, because the Almighty has dealt quite bitterly with me.", "web": "She said to them, “Don’t call me Naomi. Call me Mara, for the Almighty has dealt very bitterly with me.", "lsg": "Elle leur dit: Ne m’appelez pas Naomi; appelez-moi Mara, car le Tout-Puissant m’a remplie d’amertume.", "lsgRef": "Ruth 1:20"},
  "Ruth 1:22": {"kjv": "So Naomi returned, and Ruth the Moabitess, her daughter in law, with her, which returned out of the country of Moab: and they came to Beth–lehem in the beginning of barley harvest.", "bsb": "So Naomi returned from the land of Moab with her daughter-in-law Ruth the Moabitess. And they arrived in Bethlehem at the beginning of the barley harvest.", "web": "So Naomi returned, and Ruth the Moabitess, her daughter-in-law, with her, who returned out of the country of Moab. They came to Bethlehem in the beginning of barley harvest.", "lsg": "Ainsi revinrent du pays de Moab Naomi et sa belle-fille, Ruth la Moabite. Elles arrivèrent à Bethléhem au commencement de la moisson des orges.", "lsgRef": "Ruth 1:22"},
  "Ruth 1:4": {"kjv": "And they took them wives of the women of Moab; the name of the one was Orpah, and the name of the other Ruth: and they dwelled there about ten years.", "bsb": "who took Moabite women as their wives, one named Orpah and the other named Ruth. And after they had lived in Moab about ten years,", "web": "They took for themselves wives of the women of Moab. The name of the one was Orpah, and the name of the other was Ruth. They lived there about ten years.", "lsg": "Ils prirent des femmes Moabites, dont l’une se nommait Orpa, et l’autre Ruth, et ils habitèrent là environ dix ans.", "lsgRef": "Ruth 1:4"},
  "Ruth 4:13": {"kjv": "So Boaz took Ruth, and she was his wife: and when he went in unto her, the LORD gave her conception, and she bare a son.", "bsb": "So Boaz took Ruth, and she became his wife. And when he had relations with her, the LORD enabled her to conceive, and she gave birth to a son.", "web": "So Boaz took Ruth and she became his wife; and he went in to her, and the LORD enabled her to conceive, and she bore a son.", "lsg": "Boaz prit Ruth, qui devint sa femme, et il alla vers elle. L’Éternel permit à Ruth de concevoir, et elle enfanta un fils.", "lsgRef": "Ruth 4:13"},
  "Ruth 4:17": {"kjv": "And the women her neighbours gave it a name, saying, There is a son born to Naomi; and they called his name Obed: he is the father of Jesse, the father of David.", "bsb": "The neighbor women said, “A son has been born to Naomi,” and they named him Obed. He became the father of Jesse, the father of David.", "web": "The women, her neighbors, gave him a name, saying, “A son is born to Naomi”. They named him Obed. He is the father of Jesse, the father of David.", "lsg": "Les voisines lui donnèrent un nom, en disant: Un fils est né à Naomi! Et elles l’appelèrent Obed. Ce fut le père d’Isaï père de David.", "lsgRef": "Ruth 4:17"}

// ---------- Helpers ----------
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function load(key, fallback) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch { return fallback; } }
function store(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
  if (key !== "lamp.badges") queueBadges();
}

// ---------- The App Store app ----------
// In the iPhone app (built with Capacitor, see app/README.md) Lamp runs from files inside the app. Its web view ignores
// download links, so files leave through the share sheet ("Save to Files", AirDrop, Messages…).
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
// The app build loads capacitor.js and the Share and LocalNotifications scripts, which expose those plugins as globals.
// Filesystem's script needs more of its own, so it (and anything else) is reached through registerPlugin, which talks to
// the plugin's native side directly.
const plugins = {};
function plugin(name) {
  if (!NATIVE) return null;
  if (plugins[name]) return plugins[name];
  const C = window.Capacitor, umd = window["capacitor" + name], reg = C.registerPlugin || (window.capacitorExports && capacitorExports.registerPlugin);
  return plugins[name] = (umd && umd[name]) || (reg ? reg(name) : C.Plugins && C.Plugins[name]) || null;
}
const blobBase64 = blob => new Promise((done, fail) => {
  const r = new FileReader(); r.onload = () => done(String(r.result).split(",")[1]); r.onerror = fail; r.readAsDataURL(blob);
});
const shareCancelled = err => /cancel/i.test(String(err && (err.message || err.errorMessage || err)));
// Writes the file to the app's cache, then opens the share sheet with it. Returns false if the person closed the sheet.
async function nativeShareFile(filename, blob) {
  const { uri } = await plugin("Filesystem").writeFile({ path: filename, data: await blobBase64(blob), directory: "CACHE" });
  try { await plugin("Share").share({ files: [uri] }); return true; }
  catch (err) { if (shareCancelled(err)) return false; throw err; }
}

// Lowercases and strips accents without changing the string's length, so match positions line up with the original text.
function fold(s) {
  let low = s.toLowerCase();
  if (low.length !== s.length) low = Array.from(s, ch => { const l = ch.toLowerCase(); return l.length === ch.length ? l : ch; }).join("");
  return low.replace(/[^\x00-\x7f]/gu, ch => {
    if (ch === "’") return "'";

const squash = s => fold(s).replace(/[^a-z0-9]/g, "");

function findBook(name) {
  const k = ALIASES[squash(name)] || squash(name);
  const order = lang === "fr" ? ["fr", "en"] : ["en", "fr"];
  for (const l of order) { const i = KEYS[l].indexOf(k); if (i >= 0) return i; }
  if (k.length >= 2) for (const l of order) { const i = KEYS[l].findIndex(b => b.startsWith(k)); if (i >= 0) return i; }

}

  const v = m[3] ? +m[3] - 1 : null;
  return { b, c: +m[2] - 1, v, v2: m[4] && v != null ? +m[4] - 1 : v };
}

const TABS = ["today","find","bible","quiz","saved","settings","memo","badges","start"];
function show(tab, leaving = false) {
  // Leaving a quiz or game: a round in progress asks first; either way the quiz starts fresh next time.
  // Reading an answer's chapter is a side trip to the Bible, and the round waits for the reader to come back.
  const onTrip = !!(quiz && quiz.trip) && !$("#s-bible").hidden;
  if (tab !== "quiz" && !leaving && quiz && (onTrip || !$("#s-quiz").hidden) && !(quiz.trip && tab === "bible")) {
    if (!quiz.over) { askLeave(() => { endRound(); show(tab, true); }); return; }
    endRound();
  }
  if (tab !== "bible" && listen.on) stopListening();
  TABS.forEach(n => { $("#s-" + n).hidden = n !== tab; });
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  clearSelection();
  $("main").classList.remove("wide");
  scrollTo(0, 0);
  if (tab === "today") renderToday();
  if (tab === "settings") renderBackup();
  if (tab === "memo") { memoView = null; renderMemo(); }
  if (tab === "saved") renderSaved();
  if (tab === "quiz" && !quiz) renderQuizStart();
  if (tab === "quiz" && quiz && quiz.trip) { scrollTo(0, quiz.trip.y); quiz.trip = null; }  // back from reading, to the same spot
  if (tab === "bible") drawBible();

}

// ---------- Find ----------
let lastMoods = null;
function renderFind() {
  $("#chips").innerHTML = CHIP_ORDER.map(k => `<button class="btn" type="button" data-mood="${k}">${MOODS[k].label[lang]}</button>`).join("");
  // Until something is typed or a feeling is tapped, the results area stays empty.
  if (lastMoods) showMoods(lastMoods.keys, lastMoods.crisis);
  else if ($("#mood").value.trim()) findFor($("#mood").value);
  else $("#results").innerHTML = "";
}
$("#chips").addEventListener("click", e => {
  const b = e.target.closest("[data-mood]"); if (!b) return;
  $("#mood").value = MOODS[b.dataset.mood].label[lang];
  showMoods([b.dataset.mood]);
});
$("#ask").addEventListener("submit", e => { e.preventDefault(); findFor($("#mood").value); });

// Mood words are matched in both languages, since people often mix them.
const MOOD_WORDS = Object.fromEntries(Object.entries(MOODS).map(([k, m]) => [k, [...m.en, ...m.fr].map(w => words(w).trim())]));
const CRISIS_WORDS = [...CRISIS.en, ...CRISIS.fr].map(w => words(w).trim());

function findFor(raw) {
  const text = words(raw);
  if (!text.trim()) { lastMoods = null; $("#results").innerHTML = `<div class="note">${t("find_empty")}</div>`; return; }
  const crisis = CRISIS_WORDS.some(w => text.includes(" " + w + " ") || text.includes(" " + w));
  const scores = Object.entries(MOOD_WORDS)
    .map(([k, ws]) => [k, ws.filter(w => text.includes(" " + w + " ") || (w.length > 4 && text.includes(" " + w))).length])
    .filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]);
  let keys = scores.slice(0, 2).map(([k]) => k);
  if (crisis && !keys.length) keys = ["hope"];
  showMoods(keys, crisis);
}

function showMoods(keys, crisis = false) {
  lastMoods = keys.length ? { keys, crisis } : null;
  const care = crisis ? `<div class="note care">${t("care")}</div>` : "";
  if (!keys.length) { $("#results").innerHTML = `<div class="note">${t("find_nomatch")}</div>`; return; }
  const pool = shuffle(VERSES.filter(v => v.t.some(x => keys.includes(x))));
  const labels = keys.map(k => MOODS[k].label[lang]).join(t("and"));
  $("#results").innerHTML = care +
    `<p class="muted" style="margin:0">${t("verses_for", labels)}</p>` +
    pool.slice(0, 3).map(v => verseCard(moodVerse(v), { small: true })).join("") +
    (pool.length > 3 ? `<div><button class="btn" id="more">${t("more")}</button></div>` : "");
  const more = $("#more");
  if (more) more.addEventListener("click", () => showMoods(keys, crisis));
}

// ---------- Bible ----------
// Each version is a file published next to this page: [book][chapter][verse] -> text. A verse a version leaves out is "".
const bibles = {}, loading = {}, folded = {};
function loadBible(v) {
  loading[v] ??= fetch(VERSIONS[v].file)
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(d => (bibles[v] = d), err => { delete loading[v]; throw err; });
  return loading[v];
}
const cur = () => bibles[ver];
// The version shown beside the main one, or null.
let cmp = load("lamp.cmp", null);
const cmpVer = () => (VERSIONS[cmp] && cmp !== ver ? cmp : null);

const rd = Object.assign({ view: "books", b: 0, c: 0 }, load("lamp.reader", {}), { v: null, q: "" });
let scale = load("lamp.scale", 1);
let selected = null;

// Highlights and notes, keyed "language.book.chapter.verse": the English versions share verse numbers, Louis Segond has its own.
let marks = load("lamp.marks", {});
const markKey = (v, b, c, i) => `${VERSIONS[v].lang}.${b}.${c}.${i}`;
const noteMark = () => `<span class="nmark" title="${esc(t("has_note"))}">✎</span>`;
// Extra class and note marker for verse i of the open chapter in version v.
function verseDeco(v, i) {
  const m = marks[markKey(v, rd.b, rd.c, i)];
  return { cls: m && m.hl ? " hl-" + m.hl : "", note: m && m.note ? noteMark() : "" };
}

function saveReader() { store("lamp.reader", { view: rd.view === "search" ? "books" : rd.view === "study" ? "read" : rd.view, b: rd.b, c: rd.c }); }
function setView(patch) { Object.assign(rd, patch); saveReader(); scrollTo(0, 0); drawBible(); }
// `plan` is set only when reading through a reading plan's chapters for the day.
function openChapter(b, c, v = null, plan = null) {
  Object.assign(rd, { view: "read", b, c, v, plan });
  saveReader();
  if ($("#s-bible").hidden) show("bible"); else { scrollTo(0, 0); drawBible(); }
}

async function drawBible() {
  if (listen.on && !listen.turning && (rd.view !== "read" || rd.b !== listen.b || rd.c !== listen.c || (listen.ver !== ver && listen.ver !== cmpVer()))) stopListening();
  const body = $("#bible-body"), trip = quiz && quiz.trip;
  $("#quiz-back").hidden = !trip;
  if (trip) $("#quiz-back button").textContent = t(quiz.kind ? "back_to_game" : "back_to_quiz", quiz.i + 1, ROUND);
  clearSelection();
  $("#bible-top").hidden = rd.view === "read" || rd.view === "plans" || rd.view === "study";
  $("main").classList.toggle("wide", rd.view === "read" && !!cmpVer());
  // Plans don't need the Bible text, so they show without waiting for it.
  if (rd.view === "plans") { body.innerHTML = plansHTML(); return; }
  while (!cur() || (rd.view === "read" && cmpVer() && !bibles[cmpVer()])) {
    body.innerHTML = `<div class="note muted">${t("opening")}</div>`;
    try { await Promise.all([loadBible(ver), rd.view === "read" && cmpVer() ? loadBible(cmpVer()) : null]); }
    catch { body.innerHTML = `<div class="note">${t("load_failed")}</div>`; return; }
  }
  const bible = cur();
  if (!bible[rd.b]) Object.assign(rd, { view: "books", b: 0, c: 0 });
  rd.c = Math.max(0, Math.min(rd.c, bible[rd.b].length - 1));
  if (rd.view === "chapters") body.innerHTML = chaptersHTML(bible);
  else if (rd.view === "read") { body.innerHTML = readHTML(bible); afterRead(); }
  else if (rd.view === "search") body.innerHTML = searchHTML(bible, rd.q);
  else if (rd.view === "study" && rd.study) {
    body.innerHTML = `<div class="note muted">${t("opening")}</div>`;
    const study = rd.study;
    studyHTML(study).then(html => { if (rd.study === study) body.innerHTML = html; },
      () => { body.innerHTML = `<div class="note">${t("study_failed")}</div>`; });
  }
  else body.innerHTML = booksHTML(bible);
}

function booksHTML(bible) {
  const group = (title, from, to) => `<div class="testament"><div class="eyebrow">${title}</div><div class="books">${
    BOOKS.slice(from, to).map((_, i) => `<button class="book" data-book="${from + i}">${bookName(from + i)}<small>${bible[from + i].length}</small></button>`).join("")
  }</div></div>`;
  const last = load("lamp.lastread", null);
  return `<button class="hit" data-bv="plans"><b>${t("plans_title")}</b><span>${t("plans_entry")}</span></button>`
    + (last ? `<button class="hit" data-open="${last.b},${last.c}"><b>${t("continue_reading")}</b><span>${chapterName(last.b, last.c)}</span></button>` : "")
    + group(t("ot"), 0, OT) + group(t("nt"), OT, BOOKS.length);
}

function chaptersHTML(bible) {
  const n = bible[rd.b].length, last = load("lamp.lastread", null);
  const here = i => last && last.b === rd.b && last.c === i ? ' class="here"' : "";
  return `<div><button class="btn" data-bv="books">${t("all_books")}</button></div>
    <h2>${bookName(rd.b)}</h2>
    <p class="muted" style="margin:0">${t("chapters_note", n, rd.b === PSALMS)}</p>
    <div class="chapters">${Array.from({ length: n }, (_, i) => `<button data-ch="${i}"${here(i)}>${i + 1}</button>`).join("")}</div>`;
}

function readHTML(bible) {
  const verses = bible[rd.b][rd.c];
  const prev = rd.c > 0 ? [rd.b, rd.c - 1] : rd.b > 0 ? [rd.b - 1, bible[rd.b - 1].length - 1] : null;
  const next = rd.c < bible[rd.b].length - 1 ? [rd.b, rd.c + 1] : rd.b < BOOKS.length - 1 ? [rd.b + 1, 0] : null;
  return `<div class="reader-head">
      <button class="btn" data-bv="chapters" aria-label="${esc(t("chapters_aria", bookName(rd.b)))}">${t("chapters_back")}</button>
      <h2 style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:center">${chapterName(rd.b, rd.c)}</h2>
      <span class="bar" style="flex-wrap:nowrap;gap:4px">
        <button class="btn" data-size="-1" aria-label="${t("smaller")}">A−</button><button class="btn" data-size="1" aria-label="${t("larger")}">A+</button>
      </span>
    </div>
    <div class="compare">
      <label for="cmp">${t("compare")}</label>
      <select class="pick" id="cmp">
        <option value="">${t("compare_none")}</option>
        ${Object.entries(VERSIONS).filter(([k]) => k !== ver)
          .map(([k, v]) => `<option value="${k}"${k === cmpVer() ? " selected" : ""}>${v.short} · ${v.name}</option>`).join("")}
      </select>
      ${TTS ? `<button class="btn listen-btn" type="button" data-listen>${SPEAKER}${t("listen")}</button>` : ""}
    </div>
    ${cmpVer() ? parallelHTML(bible, bibles[cmpVer()], cmpVer()) : `<div class="chapter-text" lang="${VERSIONS[ver].lang}" style="--scale:${scale}">${
      verses.map((x, i) => { if (!x) return ""; const d = verseDeco(ver, i);
        return `<span class="v${d.cls}" data-v="${i}" data-ver="${ver}"><sup>${i + 1}</sup>${d.note}${esc(x)}</span> `; }).join("")}</div>`}
    <p class="muted" style="margin:0;font-size:.85rem">${cmpVer() ? "" : VERSIONS[ver].name + ". "}${t("tap_verse")}</p>
    ${planBarHTML() || `<div class="pager">
      ${prev ? `<button class="btn" data-open="${prev[0]},${prev[1]}">‹ ${chapterName(...prev)}</button>` : "<span></span>"}
      ${next ? `<button class="btn" data-open="${next[0]},${next[1]}">${chapterName(...next)} ›</button>` : "<span></span>"}
    </div>`}`;
}

// Pairs up the verses of one chapter in two versions.
// Louis Segond numbers psalm titles as verses, so in Psalms its extra verses come first and have no partner.
function parallelHTML(bible, other, ov) {
  const a = bible[rd.b][rd.c], b = other[rd.b]?.[rd.c] || [];
  let shift = 0;
  if (rd.b === PSALMS && (ver === "lsg") !== (ov === "lsg")) shift = ver === "lsg" ? a.length - b.length : b.length - a.length;
  if (shift < 0) shift = 0;
  // Row i shows main verse ia and other verse ib; whichever side is Segond starts `shift` rows earlier.
  const offA = ver === "lsg" ? 0 : shift, offB = ver === "lsg" ? shift : 0;
  const rows = Math.max(a.length + offA, b.length + offB);
  const cell = (list, i, v, cls) => {
    if (!list[i]) return `<p class="v${cls}" aria-hidden="true"></p>`;
    const d = verseDeco(v, i);
    return `<p class="v${cls}${d.cls}" data-v="${i}" data-ver="${v}" lang="${VERSIONS[v].lang}"><sup>${i + 1}</sup>${d.note}${esc(list[i])}</p>`;
  };
  let html = "";
  for (let r = 0; r < rows; r++) {
    const ia = r - offA, ib = r - offB;
    if (!a[ia] && !b[ib]) continue;
    html += `<div class="pair">${cell(a, ia, ver, "")}${cell(b, ib, ov, " alt")}</div>`;
  }
  return `<div class="legend"><span class="a">${VERSIONS[ver].short} · ${VERSIONS[ver].name}</span><span class="b">${VERSIONS[ov].short} · ${VERSIONS[ov].name}</span></div>
    <div class="chapter-text parallel" style="--scale:${scale}">${html}</div>`;
}

$("#s-bible").addEventListener("change", e => {
  if (e.target.id !== "cmp") return;
  cmp = e.target.value || null;
  store("lamp.cmp", cmp);
  drawBible();
});

// ---------- Read aloud ----------
// The phone's own voices (Web Speech), offline, in the language of the Bible being read. A chapter is queued verse by
// verse, so the verse being read can be marked; at the end Lamp turns the page and carries on with the next chapter.
// Pause cancels and remembers the verse, since resuming paused speech is unreliable on iPhones.
const TTS = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window ? speechSynthesis : null;
const SPEAKER = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>`;
const PLAY = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>`;
const PAUSE = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>`;
const RATES = [0.8, 1, 1.25];
const listen = { on: false, playing: false, turning: false, b: 0, c: 0, ver: "kjv", i: 0, token: 0, rate: load("lamp.listen.rate", 1) };
function pickVoice(lang) {
  const all = TTS.getVoices().filter(v => v.lang.toLowerCase().replace("_", "-").startsWith(lang));
  const home = lang === "fr" ? /^fr-(FR|BE)/i : /^en-(US|GB)/i;
  // A voice from France/Belgium (or the US/UK) first, then the better-quality ones, then voices on the phone itself.
  const score = v => (home.test(v.lang.replace("_", "-")) ? 8 : 0) + (/premium|enhanced|natural|neural/i.test(v.name) ? 4 : 0) + (v.localService ? 2 : 0) + (v.default ? 1 : 0);
  return all.sort((a, b) => score(b) - score(a))[0] || null;
}
if (TTS) { TTS.getVoices(); TTS.addEventListener?.("voiceschanged", () => {}); }  // asks the phone to load its voices early
// If the phone's speech engine refuses, reading stops with a message rather than hanging.
function sayFrom(i) {
  try { speakFrom(i); } catch { stopListening(); toast(t("listen_novoice"), 3000); }
}
function speakFrom(i) {
  const token = ++listen.token;
  TTS.cancel();
  const verses = bibles[listen.ver][listen.b][listen.c], lang = VERSIONS[listen.ver].lang, voice = pickVoice(lang);
  const say = (text, onstart, onend) => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = voice ? voice.lang : lang === "fr" ? "fr-FR" : "en-US";
    if (voice) u.voice = voice;
    u.rate = listen.rate;
    u.onstart = () => { if (token === listen.token && onstart) onstart(); };
    u.onend = () => { if (token === listen.token && onend) onend(); };
    TTS.speak(u);
  };
  // The chapter's name first, in the Bible's own language ("Psaumes 23").
  const book = listen.b === PSALMS ? T[lang].psalm : (lang === "fr" ? BOOKS_FR : BOOKS)[listen.b];
  if (i === 0) say(`${book} ${listen.c + 1}`, () => markSpeaking(0));
  const left = verses.map((x, k) => [x, k]).filter(([x, k]) => x && k >= i);
  if (!left.length) { nextChapterAloud(); return; }
  left.forEach(([x, k], n) => say(x, () => { listen.i = k; markSpeaking(k); }, n === left.length - 1 ? nextChapterAloud : null));
  listen.playing = true;
  renderPlayer();
}
function markSpeaking(k) {
  document.querySelectorAll("#bible-body .v.speaking").forEach(el => el.classList.remove("speaking"));
  const el = document.querySelector(`#bible-body .v[data-v="${k}"][data-ver="${listen.ver}"]`);
  if (el && !$("#s-bible").hidden) { el.classList.add("speaking"); if (k > 0) el.scrollIntoView({ block: "center", behavior: "smooth" }); }
  renderPlayer();
}
function renderPlayer() {
  $("#listen").hidden = !listen.on;
  if (!listen.on) return;
  const tg = $("#listen-toggle");
  tg.innerHTML = listen.playing ? PAUSE : PLAY;
  tg.setAttribute("aria-label", t(listen.playing ? "listen_pause" : "listen_play"));
  $("#listen-what").textContent = t("listen_at", chapterName(listen.b, listen.c), listen.i + 1);
  $("#listen-rate").textContent = String(listen.rate).replace(".", lang === "fr" ? "," : ".") + "×";
}
async function startListening(i = 0, which = ver) {
  if (!TTS) return;
  if (!pickVoice(VERSIONS[which].lang)) toast(t("listen_novoice"), 3000);
  Object.assign(listen, { on: true, b: rd.b, c: rd.c, ver: which, i });
  try { await loadBible(which); } catch { stopListening(); toast(t("load_failed")); return; }
  sayFrom(i);
}
function pauseListening() { listen.token++; TTS.cancel(); listen.playing = false; renderPlayer(); }
function stopListening() {
  listen.token++; if (TTS) TTS.cancel();
  Object.assign(listen, { on: false, playing: false, turning: false });
  document.querySelectorAll("#bible-body .v.speaking").forEach(el => el.classList.remove("speaking"));
  renderPlayer();
}
// End of a chapter: open the next one in the reader and keep reading; the last chapter of Revelation ends it.
async function nextChapterAloud() {
  const bible = bibles[listen.ver];
  const next = listen.c < bible[listen.b].length - 1 ? [listen.b, listen.c + 1] : listen.b < BOOKS.length - 1 ? [listen.b + 1, 0] : null;
  if (!next) { stopListening(); return; }
  listen.turning = true;
  [listen.b, listen.c] = next; listen.i = 0;
  if (!$("#s-bible").hidden && rd.view === "read") {
    Object.assign(rd, { view: "read", b: next[0], c: next[1], v: null, plan: null });
    saveReader(); scrollTo(0, 0);
    await drawBible();
  }
  listen.turning = false;
  if (listen.on) sayFrom(0);
}
document.addEventListener("click", e => {
  if (e.target.closest("[data-listen]")) { if (listen.on && listen.b === rd.b && listen.c === rd.c) { if (!listen.playing) sayFrom(listen.i); } else startListening(0); }
  else if (e.target.closest("#listen-toggle")) { if (listen.playing) pauseListening(); else sayFrom(listen.i); }
  else if (e.target.closest("#listen-stop")) stopListening();
  else if (e.target.closest("#listen-rate")) {
    listen.rate = RATES[(RATES.indexOf(listen.rate) + 1) % RATES.length] ?? 1;
    store("lamp.listen.rate", listen.rate);
    if (listen.playing) sayFrom(listen.i); else renderPlayer();
  }
});

// The streak counts a chapter once its last verse has been on screen (above the tab bar).
let endWatch = null;
function watchChapterEnd() {
  if (endWatch) endWatch.disconnect();
  const text = [...document.querySelectorAll("#bible-body .chapter-text")].pop();

// Words must all appear; text in quotes ("still waters", « eaux paisibles ») must appear as written.
function parseQuery(q) {
  const phrases = [];
  const rest = q.replace(/["“”«»]\s*([^"“”«»]+?)\s*["“”«»]/g, (_, p) => { phrases.push(p); return " "; });
  return {
    phrases: phrases.map(p => fold(p).match(/[\p{L}\p{N}]+/gu) || []).filter(w => w.length),

}

  if (!terms.length && !phrases.length) return back + `<div class="note">${t("search_type")}</div>`;
  const edge = w => `(?<![\\p{L}\\p{N}])${w}(?![\\p{L}\\p{N}])`;
  const patterns = [...terms.map(edge), ...phrases.map(ws => edge(ws.join("[^\\p{L}\\p{N}]+")))];
  const tests = patterns.map(p => new RegExp(p, "u"));
  const all = searchIndex(bible).filter(([, , , f]) => tests.every(r => r.test(f)));
  const hits = all.filter(([b]) => inScope(b));
  const mark = new RegExp(patterns.join("|"), "gu");
  // How many matches each book has, most first, so one tap narrows the search to that book.
  const perBook = {};
  hits.forEach(([b]) => { perBook[b] = (perBook[b] || 0) + 1; });
  const top = Object.entries(perBook).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const chips = !rd.scope.startsWith("b:") && top.length > 1
    ? `<div class="eyebrow">${t("by_book")}</div><div class="chips">${top.map(([b, n]) =>
        `<button class="btn" data-scope-book="${b}">${bookName(+b)} · ${n}</button>`).join("")}</div>` : "";
  const highlight = (orig, f) => {
    let out = "", last = 0;
    for (const m of f.matchAll(mark)) {
      out += esc(orig.slice(last, m.index)) + "<mark>" + esc(orig.slice(m.index, m.index + m[0].length)) + "</mark>";
      last = m.index + m[0].length;

  const summary = (hits.length ? t("search_count", hits.length, what, hits.length > 200) : t("search_none", what))
    + (rd.scope !== "all" ? ` · ${esc(scopeName())}` : "");
  const widen = rd.scope !== "all" && all.length > hits.length

    <div class="hits">${hits.slice(0, 200).map(([b, c, v, f]) => `<button class="hit" data-open="${b},${c},${v}"><b>${formatRef(b, c, v)}</b><span lang="${VERSIONS[ver].lang}">${
      highlight(bible[b][c][v], f)}</span></button>`).join("")}</div>`;
}

const PLANS = [
  { id: "proverbs", days: 31, books: [19],
    name: { en: "Proverbs in a month", fr: "Les Proverbes en un mois" },
    desc: { en: "A chapter of wisdom for each day of the month.", fr: "Un chapitre de sagesse pour chaque jour du mois." } },
  { id: "gospels", days: 30, books: [39, 40, 41, 42],
    name: { en: "The Gospels in 30 days", fr: "Les Évangiles en 30 jours" },
    desc: { en: "The life of Jesus through Matthew, Mark, Luke and John.", fr: "La vie de Jésus à travers Matthieu, Marc, Luc et Jean." } },
  { id: "psalms", days: 30, books: [18],
    name: { en: "Psalms in 30 days", fr: "Les Psaumes en 30 jours" },
    desc: { en: "Prayers and songs for every season of life.", fr: "Des prières et des chants pour chaque saison de la vie." } },
  { id: "nt", days: 90, books: range(OT, 66),

const PLAN_BY_ID = Object.fromEntries(PLANS.map(p => [p.id, p]));
// A plan's days: its chapters, in order, shared out as evenly as possible.
function planDays(p) {

  const all = p.books.flatMap(b => range(0, CHAPTERS[b]).map(c => [b, c]));
  return (p.list = range(0, p.days).map(d => all.slice(Math.floor(d * all.length / p.days), Math.floor((d + 1) * all.length / p.days))));

  const p = PLAN_BY_ID[id], s = plans[id], days = planDays(p);
  let cur = 0;
  while (cur < days.length && s.done[cur]) cur++;
  const scheduled = Math.min(days.length - 1, dayNum(dateKey(new Date())) - dayNum(s.start));
  return { p, s, days, cur, finished: cur >= days.length, behind: Math.max(0, scheduled - cur), pct: Math.round(100 * Object.keys(s.done).length / days.length) };

// ---------- Streak ----------
// One streak for the whole app. A day counts when you read a chapter to its end, tick off a plan's reading, finish a

// going (a rest day); missing two in a row, or two within a week, starts it again.
// lamp.active: { "YYYY-MM-DD": 1 } for chapter ends and quiz rounds. Plan, question and lesson dates already exist,

function activeDays() {
  const days = new Set(Object.keys(load("lamp.active", {})));
  Object.values(plans).forEach(st => Object.values(st.done).forEach(k => days.add(k)));
  Object.keys(load("lamp.daily", { days: {} }).days).forEach(k => days.add(k));

// ---------- "Which book is it from?" ----------
// Easy ("be"): well-known verses from the Find list, with the testament as a hint.
// Hard ("bh"): any verse of the Bible, and the wrong answers come from the same part of the Bible.
const BOOK_GROUPS = [[0, 5], [5, 17], [17, 22], [22, 27], [27, 39], [39, 44], [44, 57], [57, 66]];  // law, history, poetry, prophets, minor prophets, gospels and Acts, Paul, other letters and Revelation
function bookOptions(b, hard) {
  const [from, to] = hard ? BOOK_GROUPS.find(([a, z]) => b >= a && b < z) : [0, BOOKS.length];
  return shuffle([b, ...shuffle(range(from, to).filter(x => x !== b)).slice(0, 3)]);
}
// A random verse long enough to guess from, that doesn't give its own book away by name.
function randomVerse(bible) {
  for (;;) {
    const b = Math.floor(Math.random() * BOOKS.length), c = Math.floor(Math.random() * bible[b].length);
    const v = Math.floor(Math.random() * bible[b][c].length), text = bible[b][c][v];
    if (!text || text.length < 60) continue;
    const f = fold(text);
    if ([BOOKS[b], BOOKS_FR[b]].some(n => f.includes(fold(n.replace(/^\d /, ""))))) continue;
    return remember({ ver, b, c, v1: v, v2: v, text });
  }
}
async function startBookGame(level) {
  const hard = level === "bh";
  let list;
  if (hard) {
    if (!cur()) {
      $("#s-quiz").innerHTML = `<div class="note muted">${t("opening")}</div>`;
      try { await loadBible(ver); } catch { $("#s-quiz").innerHTML = `<div class="note">${t("load_failed")}</div>`; return; }
    }
    list = range(0, ROUND).map(() => randomVerse(cur()));
  } else {
    // Ten famous verses from ten different books.
    const seen = new Set();
    list = [];
    for (const v of shuffle(VERSES)) {
      const x = moodVerse(v);
      if (!seen.has(x.b)) { seen.add(x.b); list.push(x); }
      if (list.length === ROUND) break;
    }
  }
  quiz = { kind: "book", level, i: 0, score: 0, qs: list.map(x => ({ x, opts: bookOptions(x.b, hard) })) };
  renderBookQ();
}

// Progress: lamp.start = { done: { lessonId: ms } }
let startView = null;   // null: the list; a number: that lesson
const startDone = () => load("lamp.start", { done: {} }).done;
function startVerse(at) {
  const e = START_TEXT[at], loc = parseRef(ver === "lsg" ? e.lsgRef : at);
  return remember({ ver, b: loc.b, c: loc.c, v1: loc.v, v2: loc.v2, text: e[ver] });
}
function renderStart() {
  const done = startDone(), n = START_LESSONS.filter(l => done[l.id]).length, el = $("#s-start");
  if (startView !== null) {
    const i = startView, l = START_LESSONS[i], L = l[lang], read = parseRef(l.read), isDone = !!done[l.id], last = i === START_LESSONS.length - 1;
    el.innerHTML = `
      <div><button class="btn" type="button" data-start-list>${t("start_all")}</button></div>
      <header class="top"><span class="eyebrow">${t("start_lesson_of", i + 1, START_LESSONS.length)}</span><h1>${esc(L.title)}</h1></header>
      ${L.body.map(p => `<p class="lesson-p">${esc(p)}</p>`).join("")}
      <div class="eyebrow">${t("start_verses")}</div>
      ${l.verses.map(v => verseCard(startVerse(v), { small: true })).join("")}
      <div class="note"><div class="eyebrow" style="margin-bottom:6px">${t("start_think")}</div>${esc(L.think)}</div>
      <div class="note lesson-pray"><div class="eyebrow" style="margin-bottom:6px">${t("start_pray")}</div><em>${esc(L.pray)}</em></div>
      <div class="bar">
        <button class="btn" type="button" data-open="${read.b},${read.c}">${t("start_read", chapterName(read.b, read.c))}</button>
      </div>
      <div class="bar">
        ${isDone ? `<span class="pmeta" style="color:var(--good)">✓ ${t("start_done_label")}</span>` : `<button class="btn primary" type="button" data-start-done="${l.id}">${t("start_mark_done")}</button>`}
        ${last ? "" : `<button class="btn${isDone ? " primary" : ""}" type="button" data-start-open="${i + 1}">${t("start_next")}</button>`}
      </div>`;
    return;
  }
  const word = w => { const loc = parseRef(w.at); return `<details class="word"><summary>${esc(w[lang][0])}</summary><p>${esc(w[lang][1])}</p>
      <button class="btn" type="button" data-open="${loc.b},${loc.c},${loc.v}">${formatRef(loc.b, loc.c, loc.v)}</button></details>`; };
  el.innerHTML = `
    <div><button class="btn" type="button" data-go="today">${t("back_today")}</button></div>
    <header class="top"><span class="eyebrow">${t("start_eyebrow")}</span><h1>${t("start_title")}</h1></header>
    <p class="muted" style="margin:0">${t("start_intro")}</p>
    <div class="bar"><span class="pmeta" style="flex:1">${t("start_progress", n, START_LESSONS.length)}</span></div>
    <div class="progress"><i style="width:${(n / START_LESSONS.length) * 100}%"></i></div>
    <div class="lessons">${START_LESSONS.map((l, i) => `<button class="lesson${done[l.id] ? " done" : ""}" type="button" data-start-open="${i}">
        <span class="num">${done[l.id] ? "✓" : i + 1}</span><span><b>${esc(l[lang].title)}</b><small>${esc(l[lang].sum)}</small></span></button>`).join("")}</div>

async function lookUpVerse(ref) {
  const p = parseRef(ref || "");
  if (!p || p.v == null) return null;
  try { await loadBible(ver); } catch { return null; }
  const ch = cur()[p.b]?.[p.c];
  if (!ch || !ch[p.v]) return null;
  const v2 = Math.min(p.v2 ?? p.v, p.v + 4, ch.length - 1);
  return { ver, b: p.b, c: p.c, v1: p.v, v2, text: ch.slice(p.v, v2 + 1).filter(Boolean).join(" ") };
}

// ---------- Study: cross-references and dictionary for one verse ----------
// xref.json: { psalmShift: { chapter: extra verses in Segond }, refs: { "b.c.v": "b.c.v;b.c.v-v2;…" } }, KJV numbering.
// easton.json: { headword: text }. Both load the first time a verse is studied.
let studyData = null, studyLoading = null;
function loadStudy() {
  studyLoading ??= Promise.all(["xref.json", "easton.json"].map(f => fetch(f).then(r => { if (!r.ok) throw new Error(f); return r.json(); })))
    .then(([x, e]) => {
      // Look up dictionary entries by their first word: "herod" finds "Herod the Great", "Herod Antipas"…
      const idx = {};
      Object.keys(e).forEach(h => { const k = fold(h.split(/[ ,]/)[0]).replace(/[^a-z]/g, ""); (idx[k] ||= []).push(h); });
      return (studyData = { x, e, idx });
    }, err => { studyLoading = null; throw err; });
  return studyLoading;
}
// Louis Segond counts psalm titles as verses, so its psalm verses sit later than the KJV numbers used by the data.
const shiftOf = (v, b, c) => v === "lsg" && b === PSALMS ? (studyData.x.psalmShift[c] || 0) : 0;
const STOP = new Set(("the and that for with his him her she they them their this then there these those which shall unto upon from have hath "
  + "were was are not but all said say saith also into out when what who whom will thou thee thy thine you your our its one two came come went "
  + "made make let did does done even every any before after over under again because thus how now yet nor neither may might can could would "
  + "should had has been being more most much many such than very").split(" "));

// Dictionary entries for a verse, grouped by word: "Herod" gathers Herod the Great, Herod Antipas and the others.
function dictionaryHits(text) {
  const { idx } = studyData, groups = [], seen = new Set();
  const words = text.match(/[A-Za-z][A-Za-z'’]*/g) || [];
  // Names (capitalized words) first, then other topics; at most 10 groups.
  const ordered = [...words.filter(w => /^[A-Z]/.test(w)), ...words.filter(w => !/^[A-Z]/.test(w))];
  for (const w of ordered) {
    let k = fold(w.replace(/['’]s$/i, "")).replace(/[^a-z]/g, "");
    if (k.length < 3 || STOP.has(k)) continue;
    if (!idx[k] && k.endsWith("s") && idx[k.slice(0, -1)]) k = k.slice(0, -1);
    if (!idx[k] || seen.has(k)) continue;
    seen.add(k);
    const heads = [...idx[k]].sort((a, b) => (fold(b) === k) - (fold(a) === k)).slice(0, 8);
    groups.push({ title: fold(heads[0]) === k ? heads[0] : k[0].toUpperCase() + k.slice(1), heads });
    if (groups.length >= 10) break;
  }
  return groups;
}

async function studyHTML({ ver: v, b, c, i }) {

  const bible = bibles[v], text = bible[b][c][i] || "";

  const kv = i - shiftOf(v, b, c);
  const refs = (kv >= 0 && studyData.x.refs[`${b}.${c}.${kv}`] || "").split(";").filter(Boolean).map(r => {
    const [tb, tc, rest] = r.split("."), [a, z] = rest.split("-").map(Number);
    const s = shiftOf(v, +tb, +tc), v1 = a + s, v2 = (z ?? a) + s;

  const dict = dictionaryHits(english).map(g => `<details><summary>${esc(g.title)}${g.heads.length > 1 ? ` <span class="muted">(${g.heads.length})</span>` : ""}</summary>${

    ${dict ? `<div class="dicts">${dict}</div>` : `<p class="muted" style="margin:0">${t("dict_none")}</p>`}
    <p class="small muted">${t("dict_credit")}</p>`;
}

// ---------- Memorize ----------
// Memory verses: { id, ver, b, c, v1, v2, text, stage: rounds passed (0–5), learned: ms | null, added: ms }
let memory = load("lamp.memory", []);
let memoView = null;   // null shows the list; otherwise the round being practiced
let memoError = false;
const saveMemory = () => store("lamp.memory", memory);
const MEMO_POPULAR = ["John 3:16", "Philippians 4:13", "Proverbs 3:5-6", "Joshua 1:9", "Romans 8:28", "Psalm 119:105"];
const wordCount = s => s.split(/\s+/).filter(Boolean).length;
const stepsHTML = n => `<span class="steps" aria-hidden="true">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= n ? "on" : ""}"></i>`).join("")}</span>`;
// Splits "LORD:" into "" + "LORD" + ":" so only the word itself is hidden.
const CORE = /^([^\p{L}\p{N}]*)([\p{L}\p{N}][\p{L}\p{N}'’-]*[\p{L}\p{N}]|[\p{L}\p{N}])([^\p{L}\p{N}]*)$/u;

function addToMemory(x) {
  if (memory.some(m => m.id === x.id)) { toast(t("memo_dup")); return false; }
  if (wordCount(x.text) > 60) { toast(t("memo_too_long")); return false; }
  memory.push({ id: x.id, ver: x.ver, b: x.b, c: x.c, v1: x.v1, v2: x.v2, text: x.text, stage: 0, learned: null, added: Date.now() });
  saveMemory();
  toast(t("toast_memo_added"));
  return true;
}

function renderMemo() {
  const el = $("#s-memo");
  if (memoView) { el.innerHTML = memoRoundHTML(); return; }
  const inList = x => memory.some(m => m.id === x.id);
  const fromSaved = saved.filter(s => !inList(s) && wordCount(s.text) <= 60).slice(0, 6);
  const popular = MEMO_POPULAR.map(r => moodVerse(VERSES.find(v => v.ref === r))).filter(x => !inList(x));
  const chip = x => `<button class="btn" type="button" data-memo-pick="${x.id}">${formatRef(x.b, x.c, x.v1, x.v2)}</button>`;
  el.innerHTML = `<div><button class="btn" type="button" data-go="today">${t("back_today")}</button></div>
    <header class="top"><span class="eyebrow">${t("memo_eyebrow")}</span><h1>${t("memo_title")}</h1></header>
    <p class="muted" style="margin:0">${t("memo_intro")}</p>
    ${memory.length ? `<div class="eyebrow">${t("memo_yours")}</div><div class="planlist">${memory.map(m => `<article class="markcard" lang="${VERSIONS[m.ver].lang}">
      <div class="mref">${formatRef(m.b, m.c, m.v1, m.v2)} <span class="muted" style="font-weight:500">· ${VERSIONS[m.ver].short}</span></div>
      <p class="memo-verse">${esc(m.text)}</p>
      <div class="bar">${stepsHTML(m.stage)}<span class="pmeta">${m.learned ? t("memo_learned", fmtDate(m.learned)) : m.stage ? t("memo_round", m.stage + 1) : t("memo_new")}</span></div>
      <div class="actions" lang="${lang}"><button class="btn primary" data-memo-practice="${m.id}">${m.learned ? t("review") : t("practice")}</button><button class="btn" data-memo-remove="${m.id}">${t("remove")}</button></div>
    </article>`).join("")}</div>` : ""}
    <div class="settings">
      <div class="eyebrow">${t("memo_add")}</div>
      <form class="bar" id="memoform"><input class="search" id="memoref" placeholder="${esc(t("verse_ref_ph"))}" aria-label="${esc(t("memo_add"))}"><button class="btn" type="submit">${t("add")}</button></form>
      ${memoError ? `<p class="small" style="color:var(--bad)">${t("verse_not_found")}</p>` : ""}
      ${fromSaved.length ? `<p class="small muted">${t("memo_from_saved")}</p><div class="chips">${fromSaved.map(chip).join("")}</div>` : ""}
      ${popular.length ? `<p class="small muted">${t("memo_popular")}</p><div class="chips">${popular.map(chip).join("")}</div>` : ""}
    </div>`;
}

// A round hides a fifth more of the words each time: round 1 hides 20%, round 5 hides them all.
function startRound(id) {
  const m = memory.find(x => x.id === id), r = Math.min(m.stage + 1, 5);
  const tokens = m.text.split(/\s+/).filter(Boolean).map(w => {
    const k = w.match(CORE);
    return k ? { pre: k[1], core: k[2], post: k[3] } : { pre: w, core: "", post: "" };
  });
  const words = tokens.map((_, i) => i).filter(i => tokens[i].core);
  const hidden = shuffle(words).slice(0, Math.max(1, Math.ceil(words.length * r / 5))).sort((a, b) => a - b);
  memoView = { id, r, phase: "read", tokens, hidden, pos: 0, mistakes: 0, shown: [], bad: -1,
    bank: shuffle(hidden.map(i => ({ w: tokens[i].core, used: false }))) };
  renderMemo();
  scrollTo(0, 0);
}

function memoRoundHTML() {
  const v = memoView, m = memory.find(x => x.id === v.id);
  const slot = new Map(v.hidden.map((ti, k) => [ti, k]));
  const text = v.tokens.map((tk, i) => {
    if (v.phase === "read" || !slot.has(i)) return esc(tk.pre + tk.core + tk.post);
    const k = slot.get(i), filled = k < v.pos;
    const cls = filled ? (v.shown.includes(k) ? "shown" : "done") : k === v.pos ? "next" : "";
    return `${esc(tk.pre)}<span class="blank ${cls}" style="--n:${tk.core.length}">${filled ? esc(tk.core) : "&nbsp;"}</span>${esc(tk.post)}`;
  }).join(" ");
  const head = `<div><button class="btn" type="button" data-memo-back>${t("back_memo")}</button></div>
    <div class="qmeta"><span>${formatRef(m.b, m.c, m.v1, m.v2)} · ${VERSIONS[m.ver].short}</span><span>${t("memo_round", v.r)}</span></div>
    ${stepsHTML(v.phase === "done" && v.mistakes <= 1 ? v.r : v.r - 1)}
    <div class="memo-text" lang="${VERSIONS[m.ver].lang}" style="--scale:${scale}">${text}</div>`;
  if (v.phase === "read") return head + `<p class="muted" style="margin:0">${t("memo_read_first")}</p>
    <div><button class="btn primary" data-memo-start>${t("start_round", v.r)}</button></div>`;
  if (v.phase === "play") return head + `<p class="muted" style="margin:0">${t("memo_tap")}</p>
    <div class="bank">${v.bank.map((b, i) => b.used ? "" : `<button class="word${i === v.bad ? " bad" : ""}" data-word="${i}">${esc(b.w)}</button>`).join("")}</div>
    <div class="bar"><button class="btn" data-memo-show>${t("show_word")}</button><span class="muted small">${t("memo_mistakes", v.mistakes)}</span></div>`;
  const pass = v.mistakes <= 1;
  return head + `<div class="note"><strong>${pass ? (v.r === 5 ? t("memo_pass_done") : t("memo_pass_next")) : t("memo_retry")}</strong> <span class="muted">${t("memo_mistakes", v.mistakes)}.</span></div>
    <div class="bar">${pass && v.r < 5 ? `<button class="btn primary" data-memo-next>${t("next_round")}</button>` : ""}
      ${!pass ? `<button class="btn primary" data-memo-next>${t("try_again")}</button>` : ""}
      <button class="btn${pass && v.r === 5 ? " primary" : ""}" data-memo-back>${t("back_memo")}</button></div>`;
}

// Moves to the next blank; at the end, a round with one mistake or fewer counts as passed.
function memoAdvance() {
  const v = memoView;
  v.pos++;
  v.bad = -1;
  if (v.pos < v.hidden.length) return;
  v.phase = "done";
  const m = memory.find(x => x.id === v.id);
  if (v.mistakes <= 1) {
    m.stage = Math.max(m.stage, v.r);
    if (v.r === 5 && !m.learned) m.learned = Date.now();
    saveMemory();
  }
}

$("#s-memo").addEventListener("click", e => {
  const el = e.target.closest("[data-memo-back],[data-memo-practice],[data-memo-remove],[data-memo-pick],[data-memo-start],[data-word],[data-memo-show],[data-memo-next]");
  if (!el) return;
  const d = el.dataset, v = memoView;
  if (d.memoBack !== undefined) { memoView = null; scrollTo(0, 0); }
  else if (d.memoPractice) { startRound(d.memoPractice); return; }
  else if (d.memoRemove) {
    // Removing loses progress, so it takes a second tap.
    if (!el.dataset.armed) { el.dataset.armed = "1"; el.textContent = t("delete_confirm"); return; }
    memory = memory.filter(m => m.id !== d.memoRemove); saveMemory();
  }
  else if (d.memoPick) { memoError = false; addToMemory(known.get(d.memoPick)); }
  else if (d.memoStart !== undefined) v.phase = "play";
  else if (d.word) {
    const b = v.bank[+d.word], expected = v.tokens[v.hidden[v.pos]].core;
    if (fold(b.w) === fold(expected)) { b.used = true; memoAdvance(); }
    else { v.mistakes++; v.bad = +d.word; }
  }
  else if (d.memoShow !== undefined) {
    const expected = fold(v.tokens[v.hidden[v.pos]].core);
    const b = v.bank.find(x => !x.used && fold(x.w) === expected);
    if (b) b.used = true;
    v.shown.push(v.pos); v.mistakes++;
    memoAdvance();
  }
  else if (d.memoNext !== undefined) { startRound(v.id); return; }
  renderMemo();
});

// A backup is every "lamp.*" entry this browser stores for Lamp, as JSON: { app: "lamp", version: 1, exported, data: { key: storedText } }.
function lampData() {
  const data = {};
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith("lamp.")) data[k] = localStorage.getItem(k);

  } catch {}
  return data;
}
function dataSummary(data) {
  const get = k => { try { return JSON.parse(data[k] ?? "null"); } catch { return null; } };
  return t("backup_counts", {

    saved: (get("lamp.saved") || []).length, plans: Object.keys(get("lamp.plans") || {}).length, memory: (get("lamp.memory") || []).length,
  });
}
