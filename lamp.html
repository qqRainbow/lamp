const pad = n => String(n).padStart(2, "0");
function reminderStart() {
  const [h, m] = ($("#rtime").value || "08:00").split(":").map(Number);
  const start = new Date(); start.setHours(h, m, 0, 0);
  if (start < new Date()) start.setDate(start.getDate() + 1);
  return start;
}
const stamp = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
function reminderLink() {
  const start = reminderStart(), end = new Date(start.getTime() + 10 * 60000);
  const params = new URLSearchParams({
    action: "TEMPLATE", text: t("reminder_event"), details: t("reminder_details", APP_URL),
    dates: `${stamp(start)}/${stamp(end)}`, recur: "RRULE:FREQ=DAILY",
    ctz: Intl.DateTimeFormat().resolvedOptions().timeZone,
  });
  return "https://calendar.google.com/calendar/render?" + params;
}
// The same daily event as a calendar file, for Apple Calendar and Outlook (floating local time, with a reminder at the start).
$("#rics").addEventListener("click", () => {
  const start = reminderStart(), end = new Date(start.getTime() + 10 * 60000);
  const text = s => s.replace(/[\\;,]/g, c => "\\" + c).replace(/\n/g, "\\n");
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Lamp//Bible Companion//EN", "BEGIN:VEVENT",
    `UID:lamp-reminder-${Date.now()}@lamp`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").slice(0, 15)}Z`,
    `DTSTART:${stamp(start)}`, `DTEND:${stamp(end)}`, "RRULE:FREQ=DAILY",
    `SUMMARY:${text(t("reminder_event"))}`, `DESCRIPTION:${text(t("reminder_details", APP_URL))}`, `URL:${APP_URL}`,
    "BEGIN:VALARM", "ACTION:DISPLAY", `DESCRIPTION:${text(t("reminder_event"))}`, "TRIGGER:PT0M", "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  saveFile("lamp-reminder.ics", ics, "text/calendar");
});
// Lamp's website calls this when a new version arrived while Lamp was open (see the service worker setup at the end of the page).
window.lampUpdated = () => { $("#updatebar").hidden = false; };
$("#update-go").addEventListener("click", () => location.reload());
$("#update-later").addEventListener("click", () => { $("#updatebar").hidden = true; });
// Installing: Chrome and Edge offer their own prompt; Safari needs the Share steps.
let installPrompt = null;
const isInstalled = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installPrompt = e; $("#install").hidden = false; });
addEventListener("appinstalled", () => { installPrompt = null; $("#install").hidden = true; });
$("#install").addEventListener("click", async () => {
  if (!installPrompt) return;
  installPrompt.prompt();
  await installPrompt.userChoice;
  installPrompt = null; $("#install").hidden = true;
});
if (STANDALONE && isInstalled()) {
  // Already opened from the home screen: no steps needed.
  $("#home-help").dataset.t = "installed";
  ["#home-ios", "#home-android"].forEach(s => $(s).hidden = true);
}
const LAMP_VERSION = "__LAMP_VERSION__";
function renderExtras() {
  $("#about-version").textContent = LAMP_VERSION.startsWith("__") ? "" : t("about_version", LAMP_VERSION);
  $("#rlink").href = reminderLink();
  $("#applink").textContent = APP_URL;
  // The app without its App Store link yet: "Tell a friend" shares the description only.
  ["#applink", "#copylink"].forEach(s => $(s).hidden = !APP_URL);
  $("#tellfriend").dataset.share = t("share_app");
  // The app's notifications are written in the current language and Bible, so they're rescheduled when either changes.
  if (NATIVE && renderExtras.seen !== lang + ver) { renderExtras.seen = lang + ver; scheduleReminders(); }
}
$("#rtime").value = load("lamp.remind", "08:00");
$("#rtime").addEventListener("change", () => { store("lamp.remind", $("#rtime").value); renderExtras(); scheduleReminders(); });

// App only. lamp.remind.on: the daily notification is switched on. Each notification carries that day's verse, so the
// next 30 are scheduled ahead (iOS keeps at most 64), and again whenever Lamp opens or its language or Bible changes.
let remindQueue = Promise.resolve();
const scheduleReminders = () => remindQueue = remindQueue.then(async () => {
  const LN = plugin("LocalNotifications");
  if (!LN) return;
  const { notifications } = await LN.getPending();
  if (notifications.length) await LN.cancel({ notifications: notifications.map(n => ({ id: n.id })) });
  const list = [];
  if (load("lamp.remind.on", false)) {
    const first = reminderStart();
    for (let i = 0; i < 30; i++) {
      const at = new Date(first); at.setDate(first.getDate() + i);
      const v = votdFor(at);
      list.push({ id: 1000 + i, title: t("votd"), body: `${t("quote", v.text)} ${formatRef(v.b, v.c, v.v1, v.v2)}`, schedule: { at, allowWhileIdle: true } });
    }
  }
  // The evening reminder: every evening for 30 days, except today once something has counted for the streak.
  // It's rescheduled whenever today starts counting and whenever Lamp comes back on screen.
  if (load("lamp.evening.on", false)) {
    const [h, m] = ($("#etime").value || "20:00").split(":").map(Number), now = new Date(), doneToday = activeToday();
    for (let i = 0; i < 30; i++) {
      const at = new Date(now); at.setDate(now.getDate() + i); at.setHours(h, m, 0, 0);
      if (at <= now || (i === 0 && doneToday)) continue;
      list.push({ id: 2000 + i, title: t("evening_title"), body: t("evening_body"), schedule: { at, allowWhileIdle: true } });
    }
  }
  if (list.length) await LN.schedule({ notifications: list });
}).catch(() => {});
async function askNotifications() {
  let granted = false;
  try { granted = (await plugin("LocalNotifications").requestPermissions()).display === "granted"; } catch {}
  if (!granted) toast(t("reminder_denied"), 4000);
  return granted;
}
$("#evening-seg").addEventListener("click", async e => {
  const b = e.target.closest("[data-set-evening]");
  if (!b) return;
  const on = b.dataset.setEvening === "1" && await askNotifications();
  store("lamp.evening.on", on);
  renderLookControls();
  scheduleReminders();
  if (on) toast(t("evening_on", $("#etime").value), 3200);
});
$("#etime").value = load("lamp.evening", "20:00");
$("#etime").addEventListener("change", () => { store("lamp.evening", $("#etime").value); scheduleReminders(); });
if (NATIVE) document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") scheduleReminders(); });
$("#remind-seg").addEventListener("click", async e => {
  const b = e.target.closest("[data-set-remind]");
  if (!b) return;
  let on = b.dataset.setRemind === "1";
  if (on) {
    let granted = false;
    try { granted = (await plugin("LocalNotifications").requestPermissions()).display === "granted"; } catch {}
    if (!granted) { on = false; toast(t("reminder_denied"), 4000); }
  }
  store("lamp.remind.on", on);
  renderLookControls();
  scheduleReminders();
  if (on) toast(t("reminder_on", $("#rtime").value));
});
// Open the steps for the phone this is, if we can tell.
const ua = navigator.userAgent;
if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) $("#home-ios").open = true;
else if (/Android/.test(ua)) $("#home-android").open = true;
$("#copylink").addEventListener("click", () => {
  navigator.clipboard.writeText(APP_URL).then(() => toast(t("toast_link")), () => {
    const r = document.createRange(); r.selectNodeContents($("#applink"));
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    toast(t("toast_selected"));
  });
});

refreshAll();
</script>
