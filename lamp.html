<title>Lamp Bible Companion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a single phone column, lamplit verse at the top of each screen, fixed tab bar at the bottom */
:root {
  --bg: #e9edf3;          /* cool evening stone */
  --surface: #f7f8fb;
  --ink: #1a2034;         /* scripture ink */
  --muted: #5d6680;
  --line: #d3d9e4;
  --gold: #a8741c;        /* lamp flame */
  --gold-soft: rgba(214, 160, 60, 0.22);
  --blue: #2c4580;        /* night sky */
  --good: #2f7a4f;
  --bad: #b2453a;
  --hl-y: rgba(247, 205, 70, 0.45);   /* highlighter colors */
  --hl-g: rgba(110, 196, 130, 0.36);
  --hl-b: rgba(110, 160, 240, 0.34);
  --hl-p: rgba(238, 130, 175, 0.34);
  --font-verse: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --font-ui: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-read: var(--font-verse);   /* Bible text; Settings can switch it to a book or modern face */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1220; --surface: #171c2e; --ink: #e8e9f0; --muted: #9aa1b8; --line: #2a3149;
    --gold: #e3b45a; --gold-soft: rgba(227, 180, 90, 0.16); --blue: #9fb4ea; --good: #6cc495; --bad: #ec8a7f;
    --hl-y: rgba(240, 200, 80, 0.3); --hl-g: rgba(110, 200, 140, 0.26); --hl-b: rgba(120, 165, 245, 0.28); --hl-p: rgba(240, 140, 185, 0.26);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1220; --surface: #171c2e; --ink: #e8e9f0; --muted: #9aa1b8; --line: #2a3149;
  --gold: #e3b45a; --gold-soft: rgba(227, 180, 90, 0.16); --blue: #9fb4ea; --good: #6cc495; --bad: #ec8a7f;
  --hl-y: rgba(240, 200, 80, 0.3); --hl-g: rgba(110, 200, 140, 0.26); --hl-b: rgba(120, 165, 245, 0.28); --hl-p: rgba(240, 140, 185, 0.26);
  color-scheme: dark;
}
/* Lamp's own "Reading look" setting wins over the device theme. */
:root[data-look="light"] {
  --bg: #e9edf3; --surface: #f7f8fb; --ink: #1a2034; --muted: #5d6680; --line: #d3d9e4;
  --gold: #a8741c; --gold-soft: rgba(214, 160, 60, 0.22); --blue: #2c4580; --good: #2f7a4f; --bad: #b2453a;
  --hl-y: rgba(247, 205, 70, 0.45); --hl-g: rgba(110, 196, 130, 0.36); --hl-b: rgba(110, 160, 240, 0.34); --hl-p: rgba(238, 130, 175, 0.34);
  color-scheme: light;
}
:root[data-look="sepia"] {
  --bg: #efe5cf; --surface: #f8f0de; --ink: #3a2d1e; --muted: #6e5d46; --line: #dccdae;
  --gold: #96630f; --gold-soft: rgba(176, 124, 40, 0.18); --blue: #46587e; --good: #3f6e43; --bad: #a3422d;
  --hl-y: rgba(240, 196, 60, 0.42); --hl-g: rgba(120, 180, 110, 0.34); --hl-b: rgba(110, 150, 220, 0.3); --hl-p: rgba(230, 125, 160, 0.3);
  color-scheme: light;
}
:root[data-look="dark"] {
  --bg: #0e1220; --surface: #171c2e; --ink: #e8e9f0; --muted: #9aa1b8; --line: #2a3149;
  --gold: #e3b45a; --gold-soft: rgba(227, 180, 90, 0.16); --blue: #9fb4ea; --good: #6cc495; --bad: #ec8a7f;
  --hl-y: rgba(240, 200, 80, 0.3); --hl-g: rgba(110, 200, 140, 0.26); --hl-b: rgba(120, 165, 245, 0.28); --hl-p: rgba(240, 140, 185, 0.26);
  color-scheme: dark;
}
/* Other reading fonts are scaled to Cormorant's small letters so text keeps the same size. */
:root[data-font="book"] { --font-read: "Literata", Georgia, serif; --read-adjust: 0.4; }
:root[data-font="modern"] { --font-read: var(--font-ui); --read-adjust: 0.4; }
/* Kids mode: everything a size larger */
:root[data-kids] { font-size: 112.5%; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 16px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
main {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  /* The status bar's height on top: 0 in a browser, the clock and Dynamic Island in the iPhone app. */
  padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(96px + env(safe-area-inset-bottom, 0px));
}
h1, h2 { font-family: var(--font-verse); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 2.1rem; }
h2 { font-size: 1.5rem; }
.eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.muted { color: var(--muted); }
/* Screens and the blocks inside them (like the Bible's top and body) stack with the same spacing. */
.screen { display: flex; flex-direction: column; gap: 18px; }
header.top { display: flex; flex-direction: column; gap: 4px; }

/* Verse card: the one lamplit object on each screen */
.verse {
  position: relative; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 26px 22px 18px; display: flex; flex-direction: column; gap: 14px;
}
.verse.lit::before {
  content: ""; position: absolute; inset: -40% -20% auto auto; width: 280px; height: 280px;
  background: radial-gradient(circle, var(--gold-soft), transparent 65%);
  pointer-events: none; animation: flicker 6s ease-in-out infinite;
}
@keyframes flicker { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .75; transform: scale(1.06); } }
.verse blockquote {
  position: relative; margin: 0; font-family: var(--font-read); font-size-adjust: var(--read-adjust, none); font-style: italic; font-weight: 500;
  font-size: 1.45rem; line-height: 1.35;
}
.verse.small blockquote { font-size: 1.22rem; }
.verse .ref { position: relative; font-weight: 600; font-size: .9rem; color: var(--blue); }
.actions { position: relative; display: flex; gap: 8px; flex-wrap: wrap; }

button { font: inherit; cursor: pointer; }
.btn {
  border: 1px solid var(--line); background: transparent; color: var(--ink);
  border-radius: 999px; padding: 7px 14px; font-size: .85rem; font-weight: 600;
}
.btn:hover { border-color: var(--gold); }
/* Verse card buttons stay on one row on a phone, French labels included. */
.verse .actions { gap: 6px; }
.verse .actions .btn { padding-inline: 10px; }
.btn.on { background: var(--gold-soft); border-color: var(--gold); color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); padding: 11px 20px; font-size: .95rem; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* Find */
form.ask { display: flex; flex-direction: column; gap: 10px; }
textarea {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-height: 92px; resize: vertical; width: 100%;
}
textarea:focus { outline: none; border-color: var(--gold); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.results { display: flex; flex-direction: column; gap: 12px; }
.note { font-size: .92rem; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
.note.care { border-color: var(--bad); }

/* Quiz */
.progress { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--gold); transition: width .3s; }
.qmeta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.question { font-family: var(--font-verse); font-size: 1.55rem; font-weight: 600; line-height: 1.25; text-wrap: balance; }
.options { display: flex; flex-direction: column; gap: 10px; }
.opt {
  text-align: left; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; font-size: 1rem; font-weight: 500;
}
.opt:hover:not(:disabled) { border-color: var(--gold); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); box-shadow: inset 4px 0 0 var(--good); }
.opt.wrong { border-color: var(--bad); box-shadow: inset 4px 0 0 var(--bad); }
.feedback { font-size: .92rem; display: flex; flex-direction: column; gap: 12px; }
.feedback:empty { display: none; }
.levels { display: flex; flex-direction: column; gap: 8px; }
.level {
  display: grid; gap: 1px; text-align: left; width: 100%; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px;
}
.level:hover { border-color: var(--gold); }
.lv-name { font-family: var(--font-verse); font-size: 1.3rem; font-weight: 600; line-height: 1.2; }
.lv-desc { color: var(--muted); font-size: .88rem; }
.lv-meta { color: var(--gold); font-size: .74rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; font-variant-numeric: tabular-nums; }
.lv-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
/* Timed mode: a fuse that burns down from full to empty */
.timer { display: flex; align-items: center; gap: 8px; color: var(--gold); }
.timer .ic svg { width: 18px; height: 18px; fill: currentColor; stroke: none; }
.fuse { flex: 1; height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; }
.fuse i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--bad), var(--gold)); animation: burn linear forwards; }
@keyframes burn { to { width: 0; } }
/* "Who said it?": the quotation, with a large opening mark */
.quote { margin: 0; font-family: var(--font-read); font-size-adjust: var(--read-adjust, none); font-style: italic; font-size: 1.4rem; line-height: 1.4; }
.quote::before { content: "“"; color: var(--gold); font-size: 2.6rem; line-height: 0; vertical-align: -.45em; margin-right: 4px; }
.quote cite { font-family: var(--font-ui); font-style: normal; font-size: .75rem; font-weight: 700; color: var(--muted); }
/* Difficulty shown as lamp flames: lit ones in gold, the rest faint */
.pips { display: flex; gap: 2px; color: var(--gold); }
.pips svg { width: 18px; height: 18px; fill: currentColor; }
.pips .off { opacity: .2; }

/* Small line icons, drawn with the text color */
.ic svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* Lamp's name above the Today greeting */
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-verse); font-size: 1.3rem; font-weight: 600; color: var(--ink); }
.brand .gear.ic {
  margin-left: auto; width: 40px; height: 40px; border-radius: 50%; padding: 0;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.brand .gear.ic:hover { border-color: var(--gold); }
.brand .ic { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--gold-soft); color: var(--gold); }

/* Shortcut tiles on Today */
#today-plans:empty, #today-stories:empty { display: none; }
/* Bible stories (kids mode) */
/* One row that swipes sideways, running to the screen's edges, and opening at the next story to read. */
.stories {
  display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain;
  margin-inline: -16px; padding: 2px 16px 4px; scroll-padding-inline: 16px;
}
.stories::-webkit-scrollbar { display: none; }
.story {
  flex: 0 0 min(40%, 170px); scroll-snap-align: start;
  display: grid; grid-template-rows: auto 1fr auto; gap: 6px; align-items: start; text-align: left; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; color: var(--ink);
}
.story:hover { border-color: var(--gold); }
.story .num {
  display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%;
  background: var(--gold-soft); color: var(--gold); font-weight: 700; font-size: .85rem; font-variant-numeric: tabular-nums;
}
.story.read .num { background: var(--good); color: var(--surface); }
.story b { font-size: .95rem; line-height: 1.25; }
.story small { color: var(--muted); font-size: .8rem; }
/* Study page: cross-references and dictionary */
.dicts { display: flex; flex-direction: column; gap: 8px; }
.dicts details p { margin: 8px 0 0; font-size: .95rem; line-height: 1.55; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile {
  display: flex; flex-direction: column; align-items: flex-start; gap: 10px; text-align: left; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; color: var(--ink);
}
.tile:hover { border-color: var(--gold); }
.tile .ic { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--gold-soft); color: var(--gold); }
.tile span:last-child { display: grid; gap: 2px; min-width: 0; }
.tile b { font-size: .98rem; line-height: 1.25; }
.tile small { color: var(--muted); font-size: .82rem; line-height: 1.3; overflow-wrap: anywhere; }
.tile.wide { grid-column: 1 / -1; flex-direction: row; align-items: center; }
/* The streak on Today: the flame fills in once today counts. */
.streak { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.streak .ic { display: grid; place-items: center; flex: none; width: 38px; height: 38px; border-radius: 12px; background: var(--gold-soft); color: var(--gold); }
.streak.lit .ic svg { fill: currentColor; }
.streak span:last-child { display: grid; gap: 2px; min-width: 0; }
.streak b { font-size: 1rem; line-height: 1.25; }
.streak small { color: var(--muted); font-size: .84rem; line-height: 1.35; }
/* First steps: numbered lessons, ticked when done */
.lessons { display: flex; flex-direction: column; gap: 10px; }
.lesson {
  display: flex; align-items: center; gap: 14px; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; color: var(--ink);
}
.lesson:hover { border-color: var(--gold); }
.lesson .num { flex: none; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--gold-soft); color: var(--gold); font-weight: 700; }
.lesson.done .num { background: var(--good); color: var(--surface); }
.lesson span:last-child { display: grid; gap: 2px; }
.lesson b { font-family: var(--font-verse); font-size: 1.25rem; font-weight: 600; line-height: 1.2; }
.lesson small { color: var(--muted); font-size: .85rem; }
.lesson-p { margin: 0; font-size: 1.02rem; line-height: 1.6; }
.lesson-pray em { font-family: var(--font-read); font-size: 1.15rem; line-height: 1.45; }
.words { display: flex; flex-direction: column; gap: 8px; }
.word { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
.word summary { font-weight: 700; cursor: pointer; }
.word p { margin: 8px 0 10px; line-height: 1.5; }
/* About Lamp */
.credits { margin: 0; padding-left: 18px; font-size: .88rem; color: var(--muted); line-height: 1.5; }
.credits li + li { margin-top: 4px; }
/* Badges: earned ones glow gold, the rest wait in grey */
.badges { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.badge {
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px;
  padding: 16px 12px; border-radius: 16px; border: 1px dashed var(--line); color: var(--muted);
}
.badge .ic { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: var(--line); }
.badge .ic svg { width: 26px; height: 26px; }
.badge b { font-size: .95rem; line-height: 1.25; color: var(--ink); opacity: .55; }
.badge small { font-size: .8rem; line-height: 1.3; }
.badge.on { border-style: solid; background: var(--surface); }
.badge.on .ic { background: radial-gradient(circle, var(--gold-soft) 35%, transparent 75%), var(--gold-soft); color: var(--gold); }
.badge.on b { opacity: 1; }
.badge .when { color: var(--gold); font-weight: 700; font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; }

/* Empty states: a lamplit icon, a line of text and the next step */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding-block: 28px 8px; }
.empty .glow {
  display: grid; place-items: center; width: 84px; height: 84px; border-radius: 50%; color: var(--gold);
  background: radial-gradient(circle, var(--gold-soft) 0%, transparent 70%);
}
.empty .glow svg { width: 40px; height: 40px; stroke-width: 1.4; }
.empty h2 { font-size: 1.45rem; }
.empty p { margin: 0; color: var(--muted); max-width: 32ch; }
.starters { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

/* "Did you know?" card on the quiz screen */
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.fact .head { display: flex; align-items: center; gap: 8px; }
.fact .head .ic { color: var(--gold); display: grid; }
.fact p { margin: 0; font-family: var(--font-verse); font-size: 1.2rem; line-height: 1.4; }

/* Memorize */
.memo-verse { margin: 0; font-family: var(--font-read); font-size-adjust: var(--read-adjust, none); font-size: 1.12rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.steps { display: flex; gap: 6px; align-items: center; }
.steps i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.steps i.on { background: var(--gold); }
.memo-text { font-family: var(--font-read); font-size-adjust: var(--read-adjust, none); font-size: calc(1.4rem * var(--scale, 1)); line-height: 2; }
.blank {
  display: inline-block; min-width: calc(var(--n) * .52em + .6em); padding-inline: 2px; text-align: center;
  border-bottom: 2px solid var(--muted); border-radius: 3px 3px 0 0; line-height: 1.3; vertical-align: baseline;
}
.blank.next { border-color: var(--gold); background: var(--gold-soft); }
.blank.done { border-color: var(--good); color: var(--good); }
.blank.shown { border-color: var(--bad); color: var(--bad); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; }
.word {
  font: inherit; font-weight: 600; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
}
.word:hover { border-color: var(--gold); }
.word.bad { border-color: var(--bad); color: var(--bad); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@media (prefers-reduced-motion: reduce) { .word.bad { animation: none; } }
.score { font-family: var(--font-verse); font-size: 4rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }

/* Bible reader */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.search {
  flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px;
}
.search:focus { outline: none; border-color: var(--gold); }
.testament { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
.books { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.book {
  text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 13px 14px; color: var(--ink); font-weight: 600; font-size: .95rem;
  display: flex; justify-content: space-between; align-items: baseline; gap: 6px;
}
.book:hover, .chapters button:hover, .hit:hover { border-color: var(--gold); }
.book small { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.chapters { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 10px; }
.chapters button {
  aspect-ratio: 1; max-width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums;
}
.chapters button.here { border-color: var(--gold); background: var(--gold-soft); }
.reader-head {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding-block: 12px; margin-top: -12px; border-bottom: 1px solid var(--line);
}
.reader-head h2 { font-size: 1.35rem; white-space: nowrap; }
.chapter-text { font-family: var(--font-read); font-size-adjust: var(--read-adjust, none); font-size: calc(1.28rem * var(--scale, 1)); line-height: 1.55; }
/* Each verse starts on its own line, with a little air between verses. */
.chapter-text:not(.parallel) .v { display: block; padding: 3px 6px; margin: 0 -6px .65em; }
.chapter-text .v { border-radius: 5px; cursor: pointer; transition: background .4s; }
.chapter-text .v sup { font-family: var(--font-ui); font-size: .58em; font-weight: 700; color: var(--gold); margin-right: 3px; }

  "Psalm 147:3": {"bsb": "He heals the brokenhearted and binds up their wounds.", "web": "He heals the broken in heart, and binds up their wounds.", "lsg": "Il guérit ceux qui ont le cœur brisé, Et il panse leurs blessures.", "lsgRef": "Psaume 147:3"},
  "Deuteronomy 31:6": {"bsb": "Be strong and courageous; do not be afraid or terrified of them, for it is the LORD your God who goes with you; He will never leave you nor forsake you.”", "web": "Be strong and courageous. Don’t be afraid or scared of them, for the LORD your God himself is who goes with you. He will not fail you nor forsake you.”", "lsg": "Fortifiez-vous et ayez du courage! Ne craignez point et ne soyez point effrayés devant eux; car l’Éternel, ton Dieu, marchera lui-même avec toi, il ne te délaissera point, il ne t’abandonnera point.", "lsgRef": "Deutéronome 31:6"},
  "Hebrews 13:5": {"bsb": "Keep your lives free from the love of money and be content with what you have, for God has said: “Never will I leave you, never will I forsake you.”", "web": "Be free from the love of money, content with such things as you have, for he has said, “I will in no way leave you, neither will I in any way forsake you.”", "lsg": "Ne vous livrez pas à l’amour de l’argent; contentez-vous de ce que vous avez; car Dieu lui-même a dit: Je ne te délaisserai point, et je ne t’abandonnerai point.", "lsgRef": "Hébreux 13:5"},
  "Matthew 28:20": {"bsb": "and teaching them to obey all that I have commanded you. And surely I am with you always, even to the end of the age.”", "web": "teaching them to observe all things that I commanded you. Behold, I am with you always, even to the end of the age.” Amen.", "lsg": "et enseignez-leur à observer tout ce que je vous ai prescrit. Et voici, je suis avec vous tous les jours, jusqu’à la fin du monde.", "lsgRef": "Matthieu 28:20"},
  "Matthew 11:28": {"bsb": "Come to Me, all you who are weary and burdened, and I will give you rest.", "web": "“Come to me, all you who labor and are heavily burdened, and I will give you rest.", "lsg": "Venez à moi, vous tous qui êtes fatigués et chargés, et je vous donnerai du repos.", "lsgRef": "Matthieu 11:28"},
  "Isaiah 40:31": {"bsb": "But those who wait upon the LORD will renew their strength; they will mount up with wings like eagles; they will run and not grow weary, they will walk and not faint.", "web": "but those who wait for the LORD will renew their strength. They will mount up with wings like eagles. They will run, and not be weary. They will walk, and not faint.", "lsg": "Mais ceux qui se confient en l’Éternel renouvellent leur force. Ils prennent le vol comme les aigles; Ils courent, et ne se lassent point, Ils marchent, et ne se fatiguent point.", "lsgRef": "Ésaïe 40:31"},
  "Galatians 6:9": {"bsb": "Let us not grow weary in well-doing, for in due time we will reap a harvest if we do not give up.", "web": "Let’s not be weary in doing good, for we will reap in due season if we don’t give up.", "lsg": "Ne nous lassons pas de faire le bien; car nous moissonnerons au temps convenable, si nous ne nous relâchons pas.", "lsgRef": "Galates 6:9"},
  "Philippians 4:13": {"bsb": "I can do all things through Christ who gives me strength.", "web": "I can do all things through Christ who strengthens me.", "lsg": "Je puis tout par celui qui me fortifie.", "lsgRef": "Philippiens 4:13"},
  "2 Corinthians 12:9": {"bsb": "But He said to me, “My grace is sufficient for you, for My power is perfected in weakness.” Therefore I will boast all the more gladly in my weaknesses, so that the power of Christ may rest on me.", "web": "He has said to me, “My grace is sufficient for you, for my power is made perfect in weakness.” Most gladly therefore I will rather glory in my weaknesses, that the power of Christ may rest on me.", "lsg": "et il m’a dit: Ma grâce te suffit, car ma puissance s’accomplit dans la faiblesse. Je me glorifierai donc bien plus volontiers de mes faiblesses, afin que la puissance de Christ repose sur moi.", "lsgRef": "2 Corinthiens 12:9"},
  "Psalm 46:1": {"bsb": "God is our refuge and strength, an ever-present help in times of trouble.", "web": "God is our refuge and strength, a very present help in trouble.", "lsg": "Dieu est pour nous un refuge et un appui, Un secours qui ne manque jamais dans la détresse.", "lsgRef": "Psaume 46:2"},
  "Proverbs 3:5-6": {"bsb": "Trust in the LORD with all your heart, and lean not on your own understanding; in all your ways acknowledge Him, and He will make your paths straight.", "web": "Trust in the LORD with all your heart, and don’t lean on your own understanding. In all your ways acknowledge him, and he will make your paths straight.", "lsg": "Confie-toi en l’Éternel de tout ton cœur, Et ne t’appuie pas sur ta sagesse; Reconnais-le dans toutes tes voies, Et il aplanira tes sentiers.", "lsgRef": "Proverbes 3:5-6"},
  "James 1:5": {"bsb": "Now if any of you lacks wisdom, he should ask God, who gives generously to all without finding fault, and it will be given to him.", "web": "But if any of you lacks wisdom, let him ask of God, who gives to all liberally and without reproach, and it will be given to him.", "lsg": "Si quelqu’un d’entre vous manque de sagesse, qu’il la demande à Dieu, qui donne à tous simplement et sans reproche, et elle lui sera donnée.", "lsgRef": "Jacques 1:5"},
  "Psalm 119:105": {"bsb": "Your word is a lamp to my feet and a light to my path.", "web": "Your word is a lamp to my feet, and a light for my path.", "lsg": "Ta parole est une lampe à mes pieds, Et une lumière sur mon sentier.", "lsgRef": "Psaume 119:105"},
  "Psalm 32:8": {"bsb": "I will instruct you and teach you the way you should go; I will give you counsel and watch over you.", "web": "I will instruct you and teach you in the way which you shall go. I will counsel you with my eye on you.", "lsg": "Je t’instruirai et te montrerai la voie que tu dois suivre; Je te conseillerai, j’aurai le regard sur toi.", "lsgRef": "Psaume 32:8"},
  "1 John 1:9": {"bsb": "If we confess our sins, He is faithful and just to forgive us our sins and to cleanse us from all unrighteousness.", "web": "If we confess our sins, he is faithful and righteous to forgive us the sins and to cleanse us from all unrighteousness.", "lsg": "Si nous confessons nos péchés, il est fidèle et juste pour nous les pardonner, et pour nous purifier de toute iniquité.", "lsgRef": "1 Jean 1:9"},
  "Romans 8:1": {"bsb": "Therefore, there is now no condemnation for those who are in Christ Jesus.", "web": "There is therefore now no condemnation to those who are in Christ Jesus, who don’t walk according to the flesh, but according to the Spirit.", "lsg": "Il n’y a donc maintenant aucune condamnation pour ceux qui sont en Jésus-Christ.", "lsgRef": "Romains 8:1"},
  "Psalm 103:12": {"bsb": "As far as the east is from the west, so far has He removed our transgressions from us.", "web": "As far as the east is from the west, so far has he removed our transgressions from us.", "lsg": "Autant l’orient est éloigné de l’occident, Autant il éloigne de nous nos transgressions.", "lsgRef": "Psaume 103:12"},
  "Isaiah 1:18": {"bsb": "“Come now, let us reason together,” says the LORD. “Though your sins are like scarlet, they will be as white as snow; though they are as red as crimson, they will become like wool.", "web": "“Come now, and let’s reason together,” says the LORD: “Though your sins are as scarlet, they shall be as white as snow. Though they are red like crimson, they shall be as wool.", "lsg": "Venez et plaidons! Dit l’Éternel. Si vos péchés sont comme le cramoisi, ils deviendront blancs comme la neige; S’ils sont rouges comme la pourpre, ils deviendront comme la laine.", "lsgRef": "Ésaïe 1:18"},
  "1 Corinthians 10:13": {"bsb": "No temptation has seized you except what is common to man. And God is faithful; He will not let you be tempted beyond what you can bear. But when you are tempted, He will also provide an escape, so that you can stand up under it.", "web": "No temptation has taken you except what is common to man. God is faithful, who will not allow you to be tempted above what you are able, but will with the temptation also make the way of escape, that you may be able to endure it.", "lsg": "Aucune tentation ne vous est survenue qui n’ait été humaine, et Dieu, qui est fidèle, ne permettra pas que vous soyez tentés au-delà de vos forces; mais avec la tentation il préparera aussi le moyen d’en sortir, afin que vous puissiez la supporter.", "lsgRef": "1 Corinthiens 10:13"},
  "James 4:7": {"bsb": "Submit yourselves, then, to God. Resist the devil, and he will flee from you.", "web": "Be subject therefore to God. Resist the devil, and he will flee from you.", "lsg": "Soumettez-vous donc à Dieu; résistez au diable, et il fuira loin de vous.", "lsgRef": "Jacques 4:7"},
  "1 Thessalonians 5:16-18": {"bsb": "Rejoice at all times. Pray without ceasing. Give thanks in every circumstance, for this is God’s will for you in Christ Jesus.", "web": "Always rejoice. Pray without ceasing. In everything give thanks, for this is the will of God in Christ Jesus toward you.", "lsg": "Soyez toujours joyeux. Priez sans cesse. Rendez grâces en toutes choses, car c’est à votre égard la volonté de Dieu en Jésus-Christ.", "lsgRef": "1 Thessaloniciens 5:16-18"},
  "Psalm 118:24": {"bsb": "This is the day that the LORD has made; we will rejoice and be glad in it.", "web": "This is the day that the LORD has made. We will rejoice and be glad in it!", "lsg": "C’est ici la journée que l’Éternel a faite: Qu’elle soit pour nous un sujet d’allégresse et de joie!", "lsgRef": "Psaume 118:24"},
  "Psalm 107:1": {"bsb": "Give thanks to the LORD, for He is good; His loving devotion endures forever.", "web": "Give thanks to the LORD, for he is good, for his loving kindness endures forever.", "lsg": "Louez l’Éternel, car il est bon, Car sa miséricorde dure à toujours!", "lsgRef": "Psaume 107:1"},
  "James 1:17": {"bsb": "Every good and perfect gift is from above, coming down from the Father of the heavenly lights, with whom there is no change or shifting shadow.", "web": "Every good gift and every perfect gift is from above, coming down from the Father of lights, with whom can be no variation nor turning shadow.", "lsg": "toute grâce excellente et tout don parfait descendent d’en haut, du Père des lumières, chez lequel il n’y a ni changement ni ombre de variation.", "lsgRef": "Jacques 1:17"},
  "Psalm 16:11": {"bsb": "You have made known to me the path of life; You will fill me with joy in Your presence, with eternal pleasures at Your right hand.", "web": "You will show me the path of life. In your presence is fullness of joy. In your right hand there are pleasures forever more.", "lsg": "Tu me feras connaître le sentier de la vie; Il y a d’abondantes joies devant ta face, Des délices éternelles à ta droite.", "lsgRef": "Psaume 16:11"},
  "Jeremiah 29:11": {"bsb": "For I know the plans I have for you, declares the LORD, plans to prosper you and not to harm you, to give you a future and a hope.", "web": "For I know the thoughts that I think toward you,” says the LORD, “thoughts of peace, and not of evil, to give you hope and a future.", "lsg": "Car je connais les projets que j’ai formés sur vous, dit l’Éternel, projets de paix et non de malheur, afin de vous donner un avenir et de l’espérance.", "lsgRef": "Jérémie 29:11"},
  "Romans 8:28": {"bsb": "And we know that God works all things together for the good of those who love Him, who are called according to His purpose.", "web": "We know that all things work together for good for those who love God, for those who are called according to his purpose.", "lsg": "Nous savons, du reste, que toutes choses concourent au bien de ceux qui aiment Dieu, de ceux qui sont appelés selon son dessein.", "lsgRef": "Romains 8:28"},
  "Romans 15:13": {"bsb": "Now may the God of hope fill you with all joy and peace as you believe in Him, so that you may overflow with hope by the power of the Holy Spirit.", "web": "Now may the God of hope fill you with all joy and peace in believing, that you may abound in hope in the power of the Holy Spirit.", "lsg": "Que le Dieu de l’espérance vous remplisse de toute joie et de toute paix dans la foi, pour que vous abondiez en espérance, par la puissance du Saint-Esprit!", "lsgRef": "Romains 15:13"},
  "Lamentations 3:22-23": {"bsb": "Because of the loving devotion of the LORD we are not consumed, for His mercies never fail. They are new every morning; great is Your faithfulness!", "web": "It is because of the LORD’s loving kindnesses that we are not consumed, because his mercies don’t fail. They are new every morning. Great is your faithfulness.", "lsg": "Les bontés de l’Éternel ne sont pas épuisées, Ses compassions ne sont pas à leur terme; Elles se renouvellent chaque matin. Oh! Que ta fidélité est grande!", "lsgRef": "Lamentations 3:22-23"},
  "Ephesians 4:26": {"bsb": "“Be angry, yet do not sin.” Do not let the sun set upon your anger,", "web": "“Be angry, and don’t sin.” Don’t let the sun go down on your wrath,", "lsg": "Si vous vous mettez en colère, ne péchez point; que le soleil ne se couche pas sur votre colère,", "lsgRef": "Éphésiens 4:26"},
  "James 1:19-20": {"bsb": "My beloved brothers, understand this: Everyone should be quick to listen, slow to speak, and slow to anger, for man’s anger does not bring about the righteousness that God desires.", "web": "So, then, my beloved brothers, let every man be swift to hear, slow to speak, and slow to anger; for the anger of man doesn’t produce the righteousness of God.", "lsg": "Sachez-le, mes frères bien-aimés. Ainsi, que tout homme soit prompt à écouter, lent à parler, lent à se mettre en colère; car la colère de l’homme n’accomplit pas la justice de Dieu.", "lsgRef": "Jacques 1:19-20"},
  "Proverbs 15:1": {"bsb": "A gentle answer turns away wrath, but a harsh word stirs up anger.", "web": "A gentle answer turns away wrath, but a harsh word stirs up anger.", "lsg": "Une réponse douce calme la fureur, Mais une parole dure excite la colère.", "lsgRef": "Proverbes 15:1"},
  "Ephesians 4:32": {"bsb": "Be kind and tenderhearted to one another, forgiving each other just as in Christ God forgave you.", "web": "And be kind to one another, tender hearted, forgiving each other, just as God also in Christ forgave you.", "lsg": "Soyez bons les uns envers les autres, compatissants, vous pardonnant réciproquement, comme Dieu vous a pardonné en Christ.", "lsgRef": "Éphésiens 4:32"},
  "Jeremiah 17:14": {"bsb": "Heal me, O LORD, and I will be healed; save me, and I will be saved, for You are my praise.", "web": "Heal me, O LORD, and I will be healed. Save me, and I will be saved; for you are my praise.", "lsg": "Guéris-moi, Éternel, et je serai guéri; Sauve-moi, et je serai sauvé; Car tu es ma gloire.", "lsgRef": "Jérémie 17:14"},
  "James 5:15": {"bsb": "And the prayer offered in faith will restore the one who is sick. The Lord will raise him up. If he has sinned, he will be forgiven.", "web": "and the prayer of faith will heal him who is sick, and the Lord will raise him up. If he has committed sins, he will be forgiven.", "lsg": "la prière de la foi sauvera le malade, et le Seigneur le relèvera; et s’il a commis des péchés, il lui sera pardonné.", "lsgRef": "Jacques 5:15"},
  "Matthew 6:33": {"bsb": "But seek first the kingdom of God and His righteousness, and all these things will be added unto you.", "web": "But seek first God’s Kingdom and his righteousness; and all these things will be given to you as well.", "lsg": "Cherchez premièrement le royaume et la justice de Dieu; et toutes ces choses vous seront données par-dessus.", "lsgRef": "Matthieu 6:33"},
  "Philippians 4:19": {"bsb": "And my God will supply all your needs according to His glorious riches in Christ Jesus.", "web": "My God will supply every need of yours according to his riches in glory in Christ Jesus.", "lsg": "Et mon Dieu pourvoira à tous vos besoins selon sa richesse, avec gloire, en Jésus-Christ.", "lsgRef": "Philippiens 4:19"},
  "Romans 8:38-39": {"bsb": "For I am convinced that neither death nor life, neither angels nor principalities, neither the present nor the future, nor any powers, neither height nor depth, nor anything else in all creation, will be able to separate us from the love of God that is in Christ Jesus our Lord.", "web": "For I am persuaded that neither death, nor life, nor angels, nor principalities, nor things present, nor things to come, nor powers, nor height, nor depth, nor any other created thing will be able to separate us from God’s love which is in Christ Jesus our Lord.", "lsg": "Car j’ai l’assurance que ni la mort ni la vie, ni les anges ni les dominations, ni les choses présentes ni les choses à venir, ni les puissances, ni la hauteur, ni la profondeur, ni aucune autre créature ne pourra nous séparer de l’amour de Dieu manifesté en Jésus-Christ notre Seigneur.", "lsgRef": "Romains 8:38-39"},
  "John 3:16": {"bsb": "For God so loved the world that He gave His one and only Son, that everyone who believes in Him shall not perish but have eternal life.", "web": "For God so loved the world, that he gave his only born Son, that whoever believes in him should not perish, but have eternal life.", "lsg": "Car Dieu a tant aimé le monde qu’il a donné son Fils unique, afin que quiconque croit en lui ne périsse point, mais qu’il ait la vie éternelle.", "lsgRef": "Jean 3:16"},
  "1 John 4:19": {"bsb": "We love because He first loved us.", "web": "We love him, because he first loved us.", "lsg": "Pour nous, nous l’aimons, parce qu’il nous a aimés le premier.", "lsgRef": "1 Jean 4:19"},
  "Zephaniah 3:17": {"bsb": "The LORD your God is among you; He is mighty to save. He will rejoice over you with gladness; He will quiet you with His love; He will rejoice over you with singing.”", "web": "The LORD, your God, is among you, a mighty one who will save. He will rejoice over you with joy. He will calm you in his love. He will rejoice over you with singing.", "lsg": "L’Éternel, ton Dieu, est au milieu de toi, comme un héros qui sauve; Il fera de toi sa plus grande joie; Il gardera le silence dans son amour; Il aura pour toi des transports d’allégresse.", "lsgRef": "Sophonie 3:17"},
  "Mark 9:24": {"bsb": "Immediately the boy’s father cried out, “I do believe; help my unbelief!”", "web": "Immediately the father of the child cried out with tears, “I believe. Help my unbelief!”", "lsg": "Aussitôt le père de l’enfant s’écria: Je crois! Viens au secours de mon incrédulité!", "lsgRef": "Marc 9:24"},
  "Hebrews 11:1": {"bsb": "Now faith is the assurance of what we hope for and the certainty of what we do not see.", "web": "Now faith is assurance of things hoped for, proof of things not seen.", "lsg": "Or la foi est une ferme assurance des choses qu’on espère, une démonstration de celles qu’on ne voit pas.", "lsgRef": "Hébreux 11:1"},
  "Psalm 27:14": {"bsb": "Wait patiently for the LORD; be strong and courageous. Wait patiently for the LORD!", "web": "Wait for the LORD. Be strong, and let your heart take courage. Yes, wait for the LORD.", "lsg": "Espère en l’Éternel! Fortifie-toi et que ton cœur s’affermisse! Espère en l’Éternel!", "lsgRef": "Psaume 27:14"},
  "Romans 12:12": {"bsb": "Be joyful in hope, patient in affliction, persistent in prayer.", "web": "rejoicing in hope, enduring in troubles, continuing steadfastly in prayer,", "lsg": "Réjouissez-vous en espérance. Soyez patients dans l’affliction. Persévérez dans la prière.", "lsgRef": "Romains 12:12"}
};

  "1 Samuel 16:11": {"kjv": "And Samuel said unto Jesse, Are here all thy children? And he said, There remaineth yet the youngest, and, behold, he keepeth the sheep. And Samuel said unto Jesse, Send and fetch him: for we will not sit down till he come hither.", "bsb": "And Samuel asked him, “Are these all the sons you have?” “There is still the youngest,” Jesse replied, “but he is tending the sheep.” “Send for him,” Samuel replied. “For we will not sit down to eat until he arrives.”", "web": "Samuel said to Jesse, “Are all your children here?” He said, “There remains yet the youngest. Behold, he is keeping the sheep.” Samuel said to Jesse, “Send and get him, for we will not sit down until he comes here.”", "lsg": "Puis Samuel dit à Isaï: Sont-ce là tous tes fils? Et il répondit: Il reste encore le plus jeune, mais il fait paître les brebis. Alors Samuel dit à Isaï: Envoie-le chercher, car nous ne nous placerons pas avant qu’il ne soit venu ici.", "lsgRef": "1 Samuel 16:11"},

  "1 Samuel 17:45": {"kjv": "Then said David to the Philistine, Thou comest to me with a sword, and with a spear, and with a shield: but I come to thee in the name of the LORD of hosts, the God of the armies of Israel, whom thou hast defied.", "bsb": "But David said to the Philistine, “You come against me with sword and spear and javelin, but I come against you in the name of the LORD of Hosts, the God of the armies of Israel, whom you have defied.", "web": "Then David said to the Philistine, “You come to me with a sword, with a spear, and with a javelin; but I come to you in the name of the LORD of Armies, the God of the armies of Israel, whom you have defied.", "lsg": "David dit au Philistin: Tu marches contre moi avec l’épée, la lance et le javelot; et moi, je marche contre toi au nom de l’Éternel des armées, du Dieu de l’armée d’Israël, que tu as insultée.", "lsgRef": "1 Samuel 17:45"},
  "1 Samuel 17:49": {"kjv": "And David put his hand in his bag, and took thence a stone, and slang it, and smote the Philistine in his forehead, that the stone sunk into his forehead; and he fell upon his face to the earth.", "bsb": "Then David reached into his bag, took out a stone, and slung it, striking the Philistine on the forehead. The stone sank into his forehead, and he fell facedown on the ground.", "web": "David put his hand in his bag, took a stone and slung it, and struck the Philistine in his forehead. The stone sank into his forehead, and he fell on his face to the earth.", "lsg": "Il mit la main dans sa gibecière, y prit une pierre, et la lança avec sa fronde; il frappa le Philistin au front, et la pierre s’enfonça dans le front du Philistin, qui tomba le visage contre terre.", "lsgRef": "1 Samuel 17:49"},
  "1 Samuel 17:50": {"kjv": "So David prevailed over the Philistine with a sling and with a stone, and smote the Philistine, and slew him; but there was no sword in the hand of David.", "bsb": "Thus David prevailed over the Philistine with a sling and a stone; without a sword in his hand he struck down the Philistine and killed him.", "web": "So David prevailed over the Philistine with a sling and with a stone, and struck the Philistine and killed him; but there was no sword in David’s hand.", "lsg": "Ainsi, avec une fronde et une pierre, David fut plus fort que le Philistin; il le terrassa et lui ôta la vie, sans avoir d’épée à la main.", "lsgRef": "1 Samuel 17:50"},
  "1 Samuel 18:1": {"kjv": "And it came to pass, when he had made an end of speaking unto Saul, that the soul of Jonathan was knit with the soul of David, and Jonathan loved him as his own soul.", "bsb": "After David had finished speaking with Saul, the souls of Jonathan and David were knit together, and Jonathan loved him as himself.", "web": "When he had finished speaking to Saul, the soul of Jonathan was knit with the soul of David, and Jonathan loved him as his own soul.", "lsg": "David avait achevé de parler à Saül. Et dès lors l’âme de Jonathan fut attachée à l’âme de David, et Jonathan l’aima comme son âme.", "lsgRef": "1 Samuel 18:1"},

  "1 Samuel 1:3": {"kjv": "And this man went up out of his city yearly to worship and to sacrifice unto the LORD of hosts in Shiloh. And the two sons of Eli, Hophni and Phinehas, the priests of the LORD, were there.", "bsb": "Year after year Elkanah would go up from his city to worship and sacrifice to the LORD of Hosts at Shiloh, where Eli’s two sons, Hophni and Phinehas, were priests to the LORD.", "web": "This man went up out of his city from year to year to worship and to sacrifice to the LORD of Armies in Shiloh. The two sons of Eli, Hophni and Phinehas, priests to the LORD, were there.", "lsg": "Chaque année, cet homme montait de sa ville à Silo, pour se prosterner devant l’Éternel des armées et pour lui offrir des sacrifices. Là se trouvaient les deux fils d’Éli, Hophni et Phinées, sacrificateurs de l’Éternel.", "lsgRef": "1 Samuel 1:3"},
  "1 Samuel 25:3": {"kjv": "Now the name of the man was Nabal; and the name of his wife Abigail: and she was a woman of good understanding, and of a beautiful countenance: but the man was churlish and evil in his doings; and he was of the house of Caleb.", "bsb": "His name was Nabal, and his wife’s name was Abigail. She was an intelligent and beautiful woman, but her husband, a Calebite, was harsh and evil in his dealings.", "web": "Now the name of the man was Nabal; and the name of his wife Abigail. This woman was intelligent and had a beautiful face; but the man was surly and evil in his doings. He was of the house of Caleb.", "lsg": "Le nom de cet homme était Nabal, et sa femme s’appelait Abigaïl; c’était une femme de bon sens et belle de figure, mais l’homme était dur et méchant dans ses actions. Il descendait de Caleb.", "lsgRef": "1 Samuel 25:3"},
  "1 Samuel 28:7": {"kjv": "Then said Saul unto his servants, Seek me a woman that hath a familiar spirit, that I may go to her, and enquire of her. And his servants said to him, Behold, there is a woman that hath a familiar spirit at En–dor.", "bsb": "Then Saul said to his servants, “Find me a woman who is a medium, so I can go and consult her.” “There is a medium at Endor,” his servants replied.", "web": "Then Saul said to his servants, “Seek for me a woman who has a familiar spirit, that I may go to her and inquire of her.” His servants said to him, “Behold, there is a woman who has a familiar spirit at Endor.”", "lsg": "Et Saül dit à ses serviteurs: Cherchez-moi une femme qui évoque les morts, et j’irai la consulter. Ses serviteurs lui dirent: Voici, à En-Dor il y a une femme qui évoque les morts.", "lsgRef": "1 Samuel 28:7"},
  "1 Samuel 3:10": {"kjv": "And the LORD came, and stood, and called as at other times, Samuel, Samuel. Then Samuel answered, Speak; for thy servant heareth.", "bsb": "Then the LORD came and stood there, calling as before, “Samuel! Samuel!” And Samuel answered, “Speak, for Your servant is listening.”", "web": "The LORD came, and stood, and called as at other times, “Samuel! Samuel!” Then Samuel said, “Speak; for your servant hears.”", "lsg": "L’Éternel vint et se présenta, et il appela comme les autres fois: Samuel, Samuel! Et Samuel répondit: Parle, car ton serviteur écoute.", "lsgRef": "1 Samuel 3:10"},
  "1 Samuel 3:4": {"kjv": "That the LORD called Samuel: and he answered, Here am I.", "bsb": "Then the LORD called to Samuel, and he answered, “Here I am.”", "web": "The LORD called Samuel. He said, “Here I am.”", "lsg": "Alors l’Éternel appela Samuel. Il répondit: Me voici!", "lsgRef": "1 Samuel 3:4"},
  "2 Chronicles 24:1": {"kjv": "Joash was seven years old when he began to reign, and he reigned forty years in Jerusalem. His mother’s name also was Zibiah of Beer–sheba.", "bsb": "Joash was seven years old when he became king, and he reigned in Jerusalem forty years. His mother’s name was Zibiah; she was from Beersheba.", "web": "Joash was seven years old when he began to reign, and he reigned forty years in Jerusalem. His mother’s name was Zibiah, of Beersheba.", "lsg": "Joas avait sept ans lorsqu’il devint roi, et il régna quarante ans à Jérusalem. Sa mère s’appelait Tsibja, de Beer-Schéba.", "lsgRef": "2 Chroniques 24:1"},
  "2 Kings 20:6": {"kjv": "And I will add unto thy days fifteen years; and I will deliver thee and this city out of the hand of the king of Assyria; and I will defend this city for mine own sake, and for my servant David’s sake.", "bsb": "I will add fifteen years to your life. And I will deliver you and this city from the hand of the king of Assyria. I will defend this city for My sake and for the sake of My servant David.’”", "web": "I will add to your days fifteen years. I will deliver you and this city out of the hand of the king of Assyria. I will defend this city for my own sake, and for my servant David’s sake.”’”", "lsg": "J’ajouterai à tes jours quinze années. Je te délivrerai, toi et cette ville, de la main du roi d’Assyrie; je protégerai cette ville, à cause de moi, et à cause de David, mon serviteur.", "lsgRef": "2 Rois 20:6"},
  "2 Kings 22:8": {"kjv": "And Hilkiah the high priest said unto Shaphan the scribe, I have found the book of the law in the house of the LORD. And Hilkiah gave the book to Shaphan, and he read it.", "bsb": "Then Hilkiah the high priest said to Shaphan the scribe, “I have found the Book of the Law in the house of the LORD!” And he gave it to Shaphan, who read it.", "web": "Hilkiah the high priest said to Shaphan the scribe, “I have found the book of the law in the LORD’s house.” Hilkiah delivered the book to Shaphan, and he read it.", "lsg": "Alors Hilkija, le souverain sacrificateur, dit à Schaphan, le secrétaire: J’ai trouvé le livre de la loi dans la maison de l’Éternel. Et Hilkija donna le livre à Schaphan, et Schaphan le lut.", "lsgRef": "2 Rois 22:8"},
  "2 Kings 2:11": {"kjv": "And it came to pass, as they still went on, and talked, that, behold, there appeared a chariot of fire, and horses of fire, and parted them both asunder; and Elijah went up by a whirlwind into heaven.", "bsb": "As they were walking along and talking together, suddenly a chariot of fire with horses of fire appeared and separated the two of them, and Elijah went up into heaven in a whirlwind.", "web": "As they continued on and talked, behold, a chariot of fire and horses of fire separated them; and Elijah went up by a whirlwind into heaven.", "lsg": "Comme ils continuaient à marcher en parlant, voici, un char de feu et des chevaux de feu les séparèrent l’un de l’autre, et Élie monta au ciel dans un tourbillon.", "lsgRef": "2 Rois 2:11"},
  "2 Kings 2:9": {"kjv": "And it came to pass, when they were gone over, that Elijah said unto Elisha, Ask what I shall do for thee, before I be taken away from thee. And Elisha said, I pray thee, let a double portion of thy spirit be upon me.", "bsb": "After they had crossed over, Elijah said to Elisha, “Tell me, what can I do for you before I am taken away from you?” “Please, let me inherit a double portion of your spirit,” Elisha replied.", "web": "When they had gone over, Elijah said to Elisha, “Ask what I shall do for you, before I am taken from you.” Elisha said, “Please let a double portion of your spirit be on me.”", "lsg": "Lorsqu’ils eurent passé, Élie dit à Élisée: Demande ce que tu veux que je fasse pour toi, avant que je sois enlevé d’avec toi. Élisée répondit: Qu’il y ait sur moi, je te prie, une double portion de ton esprit!", "lsgRef": "2 Rois 2:9"},
  "2 Kings 5:1": {"kjv": "Now Naaman, captain of the host of the king of Syria, was a great man with his master, and honourable, because by him the LORD had given deliverance unto Syria: he was also a mighty man in valour, but he was a leper.", "bsb": "Now Naaman, the commander of the army of the king of Aram, was a great man in his master’s sight and highly regarded, for through him the LORD had given victory to Aram. And he was a mighty man of valor, but he was a leper.", "web": "Now Naaman, captain of the army of the king of Syria, was a great man with his master, and honorable, because by him the LORD had given victory to Syria; he was also a mighty man of valor, but he was a leper.", "lsg": "Naaman, chef de l’armée du roi de Syrie, jouissait de la faveur de son maître et d’une grande considération; car c’était par lui que l’Éternel avait délivré les Syriens. Mais cet homme fort et vaillant était lépreux.", "lsgRef": "2 Rois 5:1"},
  "2 Kings 5:14": {"kjv": "Then went he down, and dipped himself seven times in Jordan, according to the saying of the man of God: and his flesh came again like unto the flesh of a little child, and he was clean.", "bsb": "So Naaman went down and dipped himself in the Jordan seven times, according to the word of the man of God, and his flesh was restored and became like that of a little child, and he was clean.", "web": "Then went he down and dipped himself seven times in the Jordan, according to the saying of the man of God; and his flesh was restored like the flesh of a little child, and he was clean.", "lsg": "Il descendit alors et se plongea sept fois dans le Jourdain, selon la parole de l’homme de Dieu; et sa chair redevint comme la chair d’un jeune enfant, et il fut pur.", "lsgRef": "2 Rois 5:14"},
  "2 Samuel 11:3": {"kjv": "And David sent and enquired after the woman. And one said, Is not this Bath–sheba, the daughter of Eliam, the wife of Uriah the Hittite?", "bsb": "So David sent and inquired about the woman, and he was told, “This is Bathsheba, the daughter of Eliam and the wife of Uriah the Hittite.”", "web": "David sent and inquired after the woman. One said, “Isn’t this Bathsheba, the daughter of Eliam, Uriah the Hittite’s wife?”", "lsg": "David fit demander qui était cette femme, et on lui dit: N’est-ce pas Bath-Schéba, fille d’Éliam, femme d’Urie, le Héthien?", "lsgRef": "2 Samuel 11:3"},
  "2 Samuel 12:7": {"kjv": "And Nathan said to David, Thou art the man. Thus saith the LORD God of Israel, I anointed thee king over Israel, and I delivered thee out of the hand of Saul;", "bsb": "Then Nathan said to David, “You are that man! This is what the LORD, the God of Israel, says: ‘I anointed you king over Israel, and I delivered you from the hand of Saul.", "web": "Nathan said to David, “You are the man! This is what the LORD, the God of Israel, says: ‘I anointed you king over Israel, and I delivered you out of the hand of Saul.", "lsg": "Et Nathan dit à David: Tu es cet homme-là! Ainsi parle l’Éternel, le Dieu d’Israël: Je t’ai oint pour roi sur Israël, et je t’ai délivré de la main de Saül;", "lsgRef": "2 Samuel 12:7"},
  "2 Samuel 18:9": {"kjv": "And Absalom met the servants of David. And Absalom rode upon a mule, and the mule went under the thick boughs of a great oak, and his head caught hold of the oak, and he was taken up between the heaven and the earth; and the mule that was under him went away.", "bsb": "Now Absalom was riding on his mule when he met the servants of David, and as the mule went under the thick branches of a large oak, Absalom’s head was caught fast in the tree. The mule under him kept going, so that he was suspended in midair.", "web": "Absalom happened to meet David’s servants. Absalom was riding on his mule, and the mule went under the thick boughs of a great oak; and his head caught hold of the oak, and he was hanging between the sky and earth; and the mule that was under him went on.", "lsg": "Absalom se trouva en présence des gens de David. Il était monté sur un mulet. Le mulet pénétra sous les branches entrelacées d’un grand térébinthe, et la tête d’Absalom fut prise au térébinthe; il demeura suspendu entre le ciel et la terre, et le mulet qui était sous lui passa outre.", "lsgRef": "2 Samuel 18:9"},
  "2 Samuel 6:6-7": {"kjv": "And when they came to Nachon’s threshingfloor, Uzzah put forth his hand to the ark of God, and took hold of it; for the oxen shook it. And the anger of the LORD was kindled against Uzzah; and God smote him there for his error; and there he died by the ark of God.", "bsb": "When they came to the threshing floor of Nacon, Uzzah reached out and took hold of the ark of God, because the oxen had stumbled. And the anger of the LORD burned against Uzzah, and God struck him down on the spot for his irreverence, and he died there beside the ark of God.", "web": "When they came to the threshing floor of Nacon, Uzzah reached for God’s ark and took hold of it, for the cattle stumbled. The LORD’s anger burned against Uzzah, and God struck him there for his error; and he died there by God’s ark.", "lsg": "Lorsqu’ils furent arrivés à l’aire de Nacon, Uzza étendit la main vers l’arche de Dieu et la saisit, parce que les bœufs la faisaient pencher. La colère de l’Éternel s’enflamma contre Uzza, et Dieu le frappa sur place à cause de sa faute. Uzza mourut là, près de l’arche de Dieu.", "lsgRef": "2 Samuel 6:6-7"},
  "2 Samuel 9:6": {"kjv": "Now when Mephibosheth, the son of Jonathan, the son of Saul, was come unto David, he fell on his face, and did reverence. And David said, Mephibosheth. And he answered, Behold thy servant!", "bsb": "And when Mephibosheth son of Jonathan, the son of Saul, came to David, he fell facedown in reverence. Then David said, “Mephibosheth!” “I am your servant,” he replied.", "web": "Mephibosheth, the son of Jonathan, the son of Saul, came to David, fell on his face, and showed respect. David said, “Mephibosheth?” He answered, “Behold, your servant!”", "lsg": "Et Mephiboscheth, fils de Jonathan, fils de Saül, vint auprès de David, tomba sur sa face et se prosterna. David dit: Mephiboscheth! Et il répondit: Voici ton serviteur.", "lsgRef": "2 Samuel 9:6"},
  "2 Timothy 1:5": {"kjv": "When I call to remembrance the unfeigned faith that is in thee, which dwelt first in thy grandmother Lois, and thy mother Eunice; and I am persuaded that in thee also.", "bsb": "I am reminded of your sincere faith, which first dwelt in your grandmother Lois and your mother Eunice, and I am convinced is in you as well.", "web": "having been reminded of the sincere faith that is in you, which lived first in your grandmother Lois and your mother Eunice and, I am persuaded, in you also.", "lsg": "gardant le souvenir de la foi sincère qui est en toi, qui habita d’abord dans ton aïeule Loïs et dans ta mère Eunice, et qui, j’en suis persuadé, habite aussi en toi.", "lsgRef": "2 Timothée 1:5"},
  "2 Timothy 4:7": {"kjv": "I have fought a good fight, I have finished my course, I have kept the faith:", "bsb": "I have fought the good fight, I have finished the race, I have kept the faith.", "web": "I have fought the good fight. I have finished the course. I have kept the faith.", "lsg": "J’ai combattu le bon combat, j’ai achevé la course, j’ai gardé la foi.", "lsgRef": "2 Timothée 4:7"},
  "Acts 10:1": {"kjv": "There was a certain man in Cesarea called Cornelius, a centurion of the band called the Italian band,", "bsb": "At Caesarea there was a man named Cornelius, a centurion in what was called the Italian Regiment.", "web": "Now there was a certain man in Caesarea, Cornelius by name, a centurion of what was called the Italian Regiment,", "lsg": "Il y avait à Césarée un homme nommé Corneille, centenier dans la cohorte dite italienne.", "lsgRef": "Actes 10:1"},
  "Acts 12:13": {"kjv": "And as Peter knocked at the door of the gate, a damsel came to hearken, named Rhoda.", "bsb": "He knocked at the outer gate, and a servant girl named Rhoda came to answer it.", "web": "When Peter knocked at the door of the gate, a servant girl named Rhoda came to answer.", "lsg": "Il frappa à la porte du vestibule, et une servante, nommée Rhode, s’approcha pour écouter.", "lsgRef": "Actes 12:13"},
  "Acts 13:2": {"kjv": "As they ministered to the Lord, and fasted, the Holy Ghost said, Separate me Barnabas and Saul for the work whereunto I have called them.", "bsb": "While they were worshiping the Lord and fasting, the Holy Spirit said, “Set apart for Me Barnabas and Saul for the work to which I have called them.”", "web": "As they served the Lord and fasted, the Holy Spirit said, “Separate Barnabas and Saul for me, for the work to which I have called them.”", "lsg": "Pendant qu’ils servaient le Seigneur dans leur ministère et qu’ils jeûnaient, le Saint-Esprit dit: Mettez-moi à part Barnabas et Saul pour l’œuvre à laquelle je les ai appelés.", "lsgRef": "Actes 13:2"},
  "Acts 13:9": {"kjv": "Then Saul, (who also is called Paul,) filled with the Holy Ghost, set his eyes on him,", "bsb": "Then Saul, who was also called Paul, filled with the Holy Spirit, looked directly at Elymas", "web": "But Saul, who is also called Paul, filled with the Holy Spirit, fastened his eyes on him", "lsg": "Alors Saul, appelé aussi Paul, rempli du Saint-Esprit, fixa les regards sur lui, et dit:", "lsgRef": "Actes 13:9"},
  "Acts 16:14": {"kjv": "And a certain woman named Lydia, a seller of purple, of the city of Thyatira, which worshipped God, heard us: whose heart the Lord opened, that she attended unto the things which were spoken of Paul.", "bsb": "Among those listening was a woman named Lydia, a dealer in purple cloth from the city of Thyatira, who was a worshiper of God. The Lord opened her heart to respond to Paul’s message.", "web": "A certain woman named Lydia, a seller of purple, of the city of Thyatira, one who worshiped God, heard us. The Lord opened her heart to listen to the things which were spoken by Paul.", "lsg": "L’une d’elles, nommée Lydie, marchande de pourpre, de la ville de Thyatire, était une femme craignant Dieu, et elle écoutait. Le Seigneur lui ouvrit le cœur, pour qu’elle fût attentive à ce que disait Paul.", "lsgRef": "Actes 16:14"},
  "Acts 16:25": {"kjv": "And at midnight Paul and Silas prayed, and sang praises unto God: and the prisoners heard them.", "bsb": "About midnight Paul and Silas were praying and singing hymns to God, and the other prisoners were listening to them.", "web": "But about midnight Paul and Silas were praying and singing hymns to God, and the prisoners were listening to them.", "lsg": "Vers le milieu de la nuit, Paul et Silas priaient et chantaient les louanges de Dieu, et les prisonniers les entendaient.", "lsgRef": "Actes 16:25"},
  "Acts 16:30": {"kjv": "And brought them out, and said, Sirs, what must I do to be saved?", "bsb": "Then he brought them out and asked, “Sirs, what must I do to be saved?”", "web": "brought them out, and said, “Sirs, what must I do to be saved?”", "lsg": "il les fit sortir, et dit: Seigneurs, que faut-il que je fasse pour être sauvé?", "lsgRef": "Actes 16:30"},
  "Acts 18:2-3": {"kjv": "And found a certain Jew named Aquila, born in Pontus, lately come from Italy, with his wife Priscilla; (because that Claudius had commanded all Jews to depart from Rome:) and came unto them. And because he was of the same craft, he abode with them, and wrought: for by their occupation they were tentmakers.", "bsb": "There he found a Jew named Aquila, a native of Pontus, who had recently come from Italy with his wife Priscilla because Claudius had ordered all the Jews to leave Rome. Paul went to visit them, and he stayed and worked with them because they were tentmakers by trade, just as he was.", "web": "He found a certain Jew named Aquila, a man of Pontus by race, who had recently come from Italy with his wife Priscilla, because Claudius had commanded all the Jews to depart from Rome. He came to them, and because he practiced the same trade, he lived with them and worked, for by trade they were tent makers.", "lsg": "Il y trouva un Juif nommé Aquilas, originaire du Pont, récemment arrivé d’Italie avec sa femme Priscille, parce que Claude avait ordonné à tous les Juifs de sortir de Rome. Il se lia avec eux; et, comme il avait le même métier, il demeura chez eux et y travailla: ils étaient faiseurs de tentes.", "lsgRef": "Actes 18:2-3"},
  "Acts 18:24": {"kjv": "And a certain Jew named Apollos, born at Alexandria, an eloquent man, and mighty in the scriptures, came to Ephesus.", "bsb": "Meanwhile a Jew named Apollos, a native of Alexandria, came to Ephesus. He was an eloquent man, well versed in the Scriptures.", "web": "Now a certain Jew named Apollos, an Alexandrian by race, an eloquent man, came to Ephesus. He was mighty in the Scriptures.", "lsg": "Un Juif nommé Apollos, originaire d’Alexandrie, homme éloquent et versé dans les Écritures, vint à Éphèse.", "lsgRef": "Actes 18:24"},
  "Acts 1:23": {"kjv": "And they appointed two, Joseph called Barsabas, who was surnamed Justus, and Matthias.", "bsb": "So they proposed two men: Joseph called Barsabbas (also known as Justus) and Matthias.", "web": "They put forward two: Joseph called Barsabbas, who was also called Justus, and Matthias.", "lsg": "Ils en présentèrent deux: Joseph appelé Barsabbas, surnommé Justus, et Matthias.", "lsgRef": "Actes 1:23"},
  "Acts 1:26": {"kjv": "And they gave forth their lots; and the lot fell upon Matthias; and he was numbered with the eleven apostles.", "bsb": "Then they cast lots, and the lot fell to Matthias; so he was added to the eleven apostles.", "web": "They drew lots for them, and the lot fell on Matthias; and he was counted with the eleven apostles.", "lsg": "Ils tirèrent au sort, et le sort tomba sur Matthias, qui fut associé aux onze apôtres.", "lsgRef": "Actes 1:26"},
  "Acts 1:9": {"kjv": "And when he had spoken these things, while they beheld, he was taken up; and a cloud received him out of their sight.", "bsb": "After He had said this, they watched as He was taken up, and a cloud hid Him from their sight.", "web": "When he had said these things, as they were looking, he was taken up, and a cloud received him out of their sight.", "lsg": "Après avoir dit cela, il fut élevé pendant qu’ils le regardaient, et une nuée le déroba à leurs yeux.", "lsgRef": "Actes 1:9"},
  "Acts 20:9": {"kjv": "And there sat in a window a certain young man named Eutychus, being fallen into a deep sleep: and as Paul was long preaching, he sunk down with sleep, and fell down from the third loft, and was taken up dead.", "bsb": "And a certain young man named Eutychus, seated in the window, was sinking into a deep sleep as Paul talked on and on. When he was sound asleep, he fell from the third story and was picked up dead.", "web": "A certain young man named Eutychus sat in the window, weighed down with deep sleep. As Paul spoke still longer, being weighed down by his sleep, he fell down from the third floor and was taken up dead.", "lsg": "Or, un jeune homme nommé Eutychus, qui était assis sur la fenêtre, s’endormit profondément pendant le long discours de Paul; entraîné par le sommeil, il tomba du troisième étage en bas, et il fut relevé mort.", "lsgRef": "Actes 20:9"},
  "Acts 21:39": {"kjv": "But Paul said, I am a man which am a Jew of Tarsus, a city in Cilicia, a citizen of no mean city: and, I beseech thee, suffer me to speak unto the people.", "bsb": "But Paul answered, “I am a Jew from Tarsus in Cilicia, a citizen of no ordinary city. Now I beg you to allow me to speak to the people.”", "web": "But Paul said, “I am a Jew from Tarsus in Cilicia, a citizen of no insignificant city. I beg you, allow me to speak to the people.”", "lsg": "Je suis Juif, reprit Paul, de Tarse en Cilicie, citoyen d’une ville qui n’est pas sans importance. Permets-moi, je te prie, de parler au peuple.", "lsgRef": "Actes 21:39"},
  "Acts 26:28": {"kjv": "Then Agrippa said unto Paul, Almost thou persuadest me to be a Christian.", "bsb": "Then Agrippa said to Paul, “Can you persuade me in such a short time to become a Christian?”", "web": "Agrippa said to Paul, “With a little persuasion are you trying to make me a Christian?”", "lsg": "Et Agrippa dit à Paul: Tu vas bientôt me persuader de devenir chrétien!", "lsgRef": "Actes 26:28"},
  "Acts 28:1": {"kjv": "And when they were escaped, then they knew that the island was called Melita.", "bsb": "Once we were safely ashore, we learned that the island was called Malta.", "web": "When we had escaped, then they learned that the island was called Malta.", "lsg": "Après nous être sauvés, nous reconnûmes que l’île s’appelait Malte.", "lsgRef": "Actes 28:1"},
  "Acts 2:4": {"kjv": "And they were all filled with the Holy Ghost, and began to speak with other tongues, as the Spirit gave them utterance.", "bsb": "And they were all filled with the Holy Spirit and began to speak in other tongues as the Spirit enabled them.", "web": "They were all filled with the Holy Spirit and began to speak with other languages, as the Spirit gave them the ability to speak.", "lsg": "Et ils furent tous remplis du Saint-Esprit, et se mirent à parler en d’autres langues, selon que l’Esprit leur donnait de s’exprimer.", "lsgRef": "Actes 2:4"},
  "Acts 5:1-2": {"kjv": "But a certain man named Ananias, with Sapphira his wife, sold a possession, And kept back part of the price, his wife also being privy to it, and brought a certain part, and laid it at the apostles’ feet.", "bsb": "Now a man named Ananias, together with his wife Sapphira, also sold a piece of property. With his wife’s full knowledge, he kept back some of the proceeds for himself, but brought a portion and laid it at the apostles’ feet.", "web": "But a certain man named Ananias, with Sapphira his wife, sold a possession, and kept back part of the price, his wife also being aware of it, then brought a certain part and laid it at the apostles’ feet.", "lsg": "Mais un homme nommé Ananias, avec Saphira sa femme, vendit une propriété, et retint une partie du prix, sa femme le sachant; puis il apporta le reste, et le déposa aux pieds des apôtres.", "lsgRef": "Actes 5:1-2"},
  "Acts 7:59": {"kjv": "And they stoned Stephen, calling upon God, and saying, Lord Jesus, receive my spirit.", "bsb": "While they were stoning him, Stephen appealed, “Lord Jesus, receive my spirit.”", "web": "They stoned Stephen as he called out, saying, “Lord Jesus, receive my spirit!”", "lsg": "Et ils lapidaient Étienne, qui priait et disait: Seigneur Jésus, reçois mon esprit!", "lsgRef": "Actes 7:59"},
  "Acts 8:27": {"kjv": "And he arose and went: and, behold, a man of Ethiopia, an eunuch of great authority under Candace queen of the Ethiopians, who had the charge of all her treasure, and had come to Jerusalem for to worship,", "bsb": "So he started out, and on his way he met an Ethiopian eunuch, a court official in charge of the entire treasury of Candace, queen of the Ethiopians. He had gone to Jerusalem to worship,", "web": "He arose and went; and behold, there was a man of Ethiopia, a eunuch of great authority under Candace, queen of the Ethiopians, who was over all her treasure, who had come to Jerusalem to worship.", "lsg": "Il se leva, et partit. Et voici, un Éthiopien, un eunuque, ministre de Candace, reine d’Éthiopie, et surintendant de tous ses trésors, venu à Jérusalem pour adorer,", "lsgRef": "Actes 8:27"},
  "Acts 9:3": {"kjv": "And as he journeyed, he came near Damascus: and suddenly there shined round about him a light from heaven:", "bsb": "As Saul drew near to Damascus on his journey, suddenly a light from heaven flashed around him.", "web": "As he traveled, he got close to Damascus, and suddenly a light from the sky shone around him.", "lsg": "Comme il était en chemin, et qu’il approchait de Damas, tout à coup une lumière venant du ciel resplendit autour de lui.", "lsgRef": "Actes 9:3"},
  "Acts 9:36": {"kjv": "Now there was at Joppa a certain disciple named Tabitha, which by interpretation is called Dorcas: this woman was full of good works and almsdeeds which she did.", "bsb": "In Joppa there was a disciple named Tabitha (which is translated as Dorcas), who was always occupied with works of kindness and charity.", "web": "Now there was at Joppa a certain disciple named Tabitha, which when translated means Dorcas. This woman was full of good works and acts of mercy which she did.", "lsg": "Il y avait à Joppé, parmi les disciples, une femme nommée Tabitha, ce qui signifie Dorcas: elle faisait beaucoup de bonnes œuvres et d’aumônes.", "lsgRef": "Actes 9:36"},
  "Acts 9:6": {"kjv": "And he trembling and astonished said, Lord, what wilt thou have me to do? And the Lord said unto him, Arise, and go into the city, and it shall be told thee what thou must do.", "bsb": "“Now get up and go into the city, and you will be told what you must do.”", "web": "But rise up and enter into the city, then you will be told what you must do.”", "lsg": "Tremblant et saisi d’effroi, il dit: Seigneur, que veux-tu que je fasse? Et le Seigneur lui dit: Lève-toi, entre dans la ville, et on te dira ce que tu dois faire.", "lsgRef": "Actes 9:6"},
  "Amos 7:14": {"kjv": "Then answered Amos, and said to Amaziah, I was no prophet, neither was I a prophet’s son; but I was an herdman, and a gatherer of sycomore fruit:", "bsb": "“I was not a prophet,” Amos replied, “nor was I the son of a prophet; rather, I was a herdsman and a tender of sycamore-fig trees.", "web": "Then Amos answered Amaziah, “I was no prophet, neither was I a prophet’s son, but I was a herdsman, and a farmer of sycamore figs;", "lsg": "Amos répondit à Amatsia: Je ne suis ni prophète, ni fils de prophète; mais je suis berger, et je cultive des sycomores.", "lsgRef": "Amos 7:14"},
  "Daniel 1:7": {"kjv": "Unto whom the prince of the eunuchs gave names: for he gave unto Daniel the name of Belteshazzar; and to Hananiah, of Shadrach; and to Mishael, of Meshach; and to Azariah, of Abed–nego.", "bsb": "The chief official gave them new names: To Daniel he gave the name Belteshazzar; to Hananiah, Shadrach; to Mishael, Meshach; and to Azariah, Abednego.", "web": "The prince of the eunuchs gave names to them: to Daniel he gave the name Belteshazzar; to Hananiah, Shadrach; to Mishael, Meshach; and to Azariah, Abednego.", "lsg": "Le chef des eunuques leur donna des noms, à Daniel celui de Beltschatsar, à Hanania celui de Schadrac, à Mischaël celui de Méschac, et à Azaria celui d’Abed-Nego.", "lsgRef": "Daniel 1:7"},
  "Daniel 3:17": {"kjv": "If it be so, our God whom we serve is able to deliver us from the burning fiery furnace, and he will deliver us out of thine hand, O king.", "bsb": "If the God whom we serve exists, then He is able to deliver us from the blazing fiery furnace and from your hand, O king.", "web": "If it happens, our God whom we serve is able to deliver us from the burning fiery furnace; and he will deliver us out of your hand, O king.", "lsg": "Voici, notre Dieu que nous servons peut nous délivrer de la fournaise ardente, et il nous délivrera de ta main, ô roi.", "lsgRef": "Daniel 3:17"},
  "Daniel 3:23": {"kjv": "And these three men, Shadrach, Meshach, and Abed–nego, fell down bound into the midst of the burning fiery furnace.", "bsb": "And these three men, Shadrach, Meshach, and Abednego, firmly bound, fell into the blazing fiery furnace.", "web": "These three men, Shadrach, Meshach, and Abednego, fell down bound into the middle of the burning fiery furnace.", "lsg": "Et ces trois hommes, Schadrac, Méschac et Abed-Nego, tombèrent liés au milieu de la fournaise ardente.", "lsgRef": "Daniel 3:23"},
  "Daniel 5:25": {"kjv": "And this is the writing that was written, MENE, MENE, TEKEL, UPHARSIN.", "bsb": "Now this is the inscription that was written: MENE, MENE, TEKEL, PARSIN.", "web": "“This is the writing that was inscribed: ‘MENE, MENE, TEKEL, UPHARSIN.’", "lsg": "Voici l’écriture qui a été tracée: Compté, compté, pesé, et divisé.", "lsgRef": "Daniel 5:25"},
  "Daniel 6:16": {"kjv": "Then the king commanded, and they brought Daniel, and cast him into the den of lions. Now the king spake and said unto Daniel, Thy God whom thou servest continually, he will deliver thee.", "bsb": "So the king gave the order, and they brought Daniel and threw him into the den of lions. The king said to Daniel, “May your God, whom you serve continually, deliver you!”", "web": "Then the king commanded, and they brought Daniel and cast him into the den of lions. The king spoke and said to Daniel, “Your God whom you serve continually, he will deliver you.”", "lsg": "Alors le roi donna l’ordre qu’on amenât Daniel, et qu’on le jetât dans la fosse aux lions. Le roi prit la parole et dit à Daniel: Puisse ton Dieu, que tu sers avec persévérance, te délivrer!", "lsgRef": "Daniel 6:16"},
  "Deuteronomy 3:11": {"kjv": "For only Og king of Bashan remained of the remnant of giants; behold, his bedstead was a bedstead of iron; is it not in Rabbath of the children of Ammon? nine cubits was the length thereof, and four cubits the breadth of it, after the cubit of a man.", "bsb": "(For only Og king of Bashan had remained of the remnant of the Rephaim. His bed of iron, nine cubits long and four cubits wide, is still in Rabbah of the Ammonites.)", "web": "(For only Og king of Bashan remained of the remnant of the Rephaim. Behold, his bedstead was a bedstead of iron. Isn’t it in Rabbah of the children of Ammon? Nine cubits was its length, and four cubits its width, after the cubit of a man.)", "lsg": "(Og, roi de Basan, était resté seul de la race des Rephaïm. Voici, son lit, un lit de fer, n’est-il pas à Rabbath, ville des enfants d’Ammon? Sa longueur est de neuf coudées, et sa largeur de quatre coudées, en coudées d’homme.)", "lsgRef": "Deutéronome 3:11"},
  "Esther 2:7": {"kjv": "And he brought up Hadassah, that is, Esther, his uncle’s daughter: for she had neither father nor mother, and the maid was fair and beautiful; whom Mordecai, when her father and mother were dead, took for his own daughter.", "bsb": "And Mordecai had brought up Hadassah (that is, Esther), the daughter of his uncle, because she did not have a father or mother. The young woman was lovely in form and appearance, and when her father and mother had died, Mordecai had taken her in as his own daughter.", "web": "He brought up Hadassah, that is, Esther, his uncle’s daughter; for she had neither father nor mother. The maiden was fair and beautiful; and when her father and mother were dead, Mordecai took her for his own daughter.", "lsg": "Il élevait Hadassa, qui est Esther, fille de son oncle; car elle n’avait ni père ni mère. La jeune fille était belle de taille et belle de figure. A la mort de son père et de sa mère, Mardochée l’avait adoptée pour fille.", "lsgRef": "Esther 2:7"},
