  "Esther 4:16": {"kjv": "Go, gather together all the Jews that are present in Shushan, and fast ye for me, and neither eat nor drink three days, night or day: I also and my maidens will fast likewise; and so will I go in unto the king, which is not according to the law: and if I perish, I perish.", "bsb": "“Go and assemble all the Jews who can be found in Susa, and fast for me. Do not eat or drink for three days, night or day, and I and my maidens will fast as you do. After that, I will go to the king, even though it is against the law. And if I perish, I perish!”", "web": "“Go, gather together all the Jews who are present in Susa, and fast for me, and neither eat nor drink three days, night or day. I and my maidens will also fast the same way. Then I will go in to the king, which is against the law; and if I perish, I perish.”", "lsg": "Va, rassemble tous les Juifs qui se trouvent à Suse, et jeûnez pour moi, sans manger ni boire pendant trois jours, ni la nuit ni le jour. Moi aussi, je jeûnerai de même avec mes servantes, puis j’entrerai chez le roi, malgré la loi; et si je dois périr, je périrai.", "lsgRef": "Esther 4:16"},
  "Esther 7:10": {"kjv": "So they hanged Haman on the gallows that he had prepared for Mordecai. Then was the king’s wrath pacified.", "bsb": "So they hanged Haman on the gallows he had prepared for Mordecai. Then the fury of the king subsided.", "web": "So they hanged Haman on the gallows that he had prepared for Mordecai. Then the king’s wrath was pacified.", "lsg": "Et l’on pendit Haman au bois qu’il avait préparé pour Mardochée. Et la colère du roi s’apaisa.", "lsgRef": "Esther 7:10"},
  "Exodus 13:21": {"kjv": "And the LORD went before them by day in a pillar of a cloud, to lead them the way; and by night in a pillar of fire, to give them light; to go by day and night:", "bsb": "And the LORD went before them in a pillar of cloud to guide their way by day, and in a pillar of fire to give them light by night, so that they could travel by day or night.", "web": "The LORD went before them by day in a pillar of cloud, to lead them on their way, and by night in a pillar of fire, to give them light, that they might go by day and by night:", "lsg": "L’Éternel allait devant eux, le jour dans une colonne de nuée pour les guider dans leur chemin, et la nuit dans une colonne de feu pour les éclairer, afin qu’ils marchassent jour et nuit.", "lsgRef": "Exode 13:21"},
  "Exodus 14:21": {"kjv": "And Moses stretched out his hand over the sea; and the LORD caused the sea to go back by a strong east wind all that night, and made the sea dry land, and the waters were divided.", "bsb": "Then Moses stretched out his hand over the sea, and all that night the LORD drove back the sea with a strong east wind that turned it into dry land. So the waters were divided,", "web": "Moses stretched out his hand over the sea, and the LORD caused the sea to go back by a strong east wind all night, and made the sea dry land, and the waters were divided.", "lsg": "Moïse étendit sa main sur la mer. Et l’Éternel refoula la mer par un vent d’orient, qui souffla avec impétuosité toute la nuit; il mit la mer à sec, et les eaux se fendirent.", "lsgRef": "Exode 14:21"},
  "Exodus 16:31": {"kjv": "And the house of Israel called the name thereof Manna: and it was like coriander seed, white; and the taste of it was like wafers made with honey.", "bsb": "Now the house of Israel called the bread manna. It was white like coriander seed and tasted like wafers made with honey.", "web": "The house of Israel called its name “Manna”, and it was like coriander seed, white; and its taste was like wafers with honey.", "lsg": "La maison d’Israël donna à cette nourriture le nom de manne. Elle ressemblait à de la graine de coriandre; elle était blanche, et avait le goût d’un gâteau au miel.", "lsgRef": "Exode 16:31"},
  "Exodus 17:12": {"kjv": "But Moses’ hands were heavy; and they took a stone, and put it under him, and he sat thereon; and Aaron and Hur stayed up his hands, the one on the one side, and the other on the other side; and his hands were steady until the going down of the sun.", "bsb": "When Moses’ hands grew heavy, they took a stone and put it under him, and he sat on it. Then Aaron and Hur held his hands up, one on each side, so that his hands remained steady until the sun went down.", "web": "But Moses’ hands were heavy; so they took a stone, and put it under him, and he sat on it. Aaron and Hur held up his hands, the one on the one side, and the other on the other side. His hands were steady until sunset.", "lsg": "Les mains de Moïse étant fatiguées, ils prirent une pierre qu’ils placèrent sous lui, et il s’assit dessus. Aaron et Hur soutenaient ses mains, l’un d’un côté, l’autre de l’autre; et ses mains restèrent fermes jusqu’au coucher du soleil.", "lsgRef": "Exode 17:12"},
  "Exodus 19:20": {"kjv": "And the LORD came down upon mount Sinai, on the top of the mount: and the LORD called Moses up to the top of the mount; and Moses went up.", "bsb": "The LORD descended to the top of Mount Sinai and called Moses to the summit. So Moses went up,", "web": "The LORD came down on Mount Sinai, to the top of the mountain. The LORD called Moses to the top of the mountain, and Moses went up.", "lsg": "Ainsi l’Éternel descendit sur la montagne de Sinaï, sur le sommet de la montagne; l’Éternel appela Moïse sur le sommet de la montagne. Et Moïse monta.", "lsgRef": "Exode 19:20"},
  "Exodus 2:21": {"kjv": "And Moses was content to dwell with the man: and he gave Moses Zipporah his daughter.", "bsb": "Moses agreed to stay with the man, and he gave his daughter Zipporah to Moses in marriage.", "web": "Moses was content to dwell with the man. He gave Moses Zipporah, his daughter.", "lsg": "Moïse se décida à demeurer chez cet homme, qui lui donna pour femme Séphora, sa fille.", "lsgRef": "Exode 2:21"},
  "Exodus 2:5": {"kjv": "And the daughter of Pharaoh came down to wash herself at the river; and her maidens walked along by the river’s side; and when she saw the ark among the flags, she sent her maid to fetch it.", "bsb": "Soon the daughter of Pharaoh went down to bathe in the Nile, and her attendants were walking along the riverbank. And when she saw the basket among the reeds, she sent her maidservant to retrieve it.", "web": "Pharaoh’s daughter came down to bathe at the river. Her maidens walked along by the riverside. She saw the basket among the reeds, and sent her servant to get it.", "lsg": "La fille de Pharaon descendit au fleuve pour se baigner, et ses compagnes se promenèrent le long du fleuve. Elle aperçut la caisse au milieu des roseaux, et elle envoya sa servante pour la prendre.", "lsgRef": "Exode 2:5"},
  "Exodus 31:2-3": {"kjv": "See, I have called by name Bezaleel the son of Uri, the son of Hur, of the tribe of Judah: And I have filled him with the spirit of God, in wisdom, and in understanding, and in knowledge, and in all manner of workmanship,", "bsb": "“See, I have called by name Bezalel son of Uri, the son of Hur, of the tribe of Judah. And I have filled him with the Spirit of God, with skill, ability, and knowledge in all kinds of craftsmanship,", "web": "“Behold, I have called by name Bezalel the son of Uri, the son of Hur, of the tribe of Judah. I have filled him with the Spirit of God, in wisdom, and in understanding, and in knowledge, and in all kinds of workmanship,", "lsg": "Sache que j’ai choisi Betsaleel, fils d’Uri, fils de Hur, de la tribu de Juda. Je l’ai rempli de l’Esprit de Dieu, de sagesse, d’intelligence, et de savoir pour toutes sortes d’ouvrages,", "lsgRef": "Exode 31:2-3"},
  "Exodus 32:4": {"kjv": "And he received them at their hand, and fashioned it with a graving tool, after he had made it a molten calf: and they said, These be thy gods, O Israel, which brought thee up out of the land of Egypt.", "bsb": "He took the gold from their hands, and with an engraving tool he fashioned it into a molten calf. And they said, “These, O Israel, are your gods, who brought you up out of the land of Egypt!”", "web": "He received what they handed him, fashioned it with an engraving tool, and made it a molded calf. Then they said, “These are your gods, Israel, which brought you up out of the land of Egypt.”", "lsg": "Il les reçut de leurs mains, jeta l’or dans un moule, et fit un veau en fonte. Et ils dirent: Israël! Voici ton dieu, qui t’a fait sortir du pays d’Égypte.", "lsgRef": "Exode 32:4"},
  "Exodus 34:28": {"kjv": "And he was there with the LORD forty days and forty nights; he did neither eat bread, nor drink water. And he wrote upon the tables the words of the covenant, the ten commandments.", "bsb": "So Moses was there with the LORD forty days and forty nights without eating bread or drinking water. He wrote on the tablets the words of the covenant—the Ten Commandments.", "web": "He was there with the LORD forty days and forty nights; he neither ate bread, nor drank water. He wrote on the tablets the words of the covenant, the ten commandments.", "lsg": "Moïse fut là avec l’Éternel quarante jours et quarante nuits. Il ne mangea point de pain, et il ne but point d’eau. Et l’Éternel écrivit sur les tables les paroles de l’alliance, les dix paroles.", "lsgRef": "Exode 34:28"},
  "Exodus 3:2": {"kjv": "And the angel of the LORD appeared unto him in a flame of fire out of the midst of a bush: and he looked, and, behold, the bush burned with fire, and the bush was not consumed.", "bsb": "There the angel of the LORD appeared to him in a blazing fire from within a bush. Moses saw the bush ablaze with fire, but it was not consumed.", "web": "The LORD’s angel appeared to him in a flame of fire out of the middle of a bush. He looked, and behold, the bush burned with fire, and the bush was not consumed.", "lsg": "L’ange de l’Éternel lui apparut dans une flamme de feu, au milieu d’un buisson. Moïse regarda; et voici, le buisson était tout en feu, et le buisson ne se consumait point.", "lsgRef": "Exode 3:2"},
  "Exodus 4:10": {"kjv": "And Moses said unto the LORD, O my Lord, I am not eloquent, neither heretofore, nor since thou hast spoken unto thy servant: but I am slow of speech, and of a slow tongue.", "bsb": "“Please, Lord,” Moses replied, “I have never been eloquent, neither in the past nor since You have spoken to Your servant, for I am slow of speech and tongue.”", "web": "Moses said to the LORD, “O Lord, I am not eloquent, neither before now, nor since you have spoken to your servant; for I am slow of speech, and of a slow tongue.”", "lsg": "Moïse dit à l’Éternel: Ah! Seigneur, je ne suis pas un homme qui ait la parole facile, et ce n’est ni d’hier ni d’avant-hier, ni même depuis que tu parles à ton serviteur; car j’ai la bouche et la langue embarrassées.", "lsgRef": "Exode 4:10"},
  "Exodus 4:14": {"kjv": "And the anger of the LORD was kindled against Moses, and he said, Is not Aaron the Levite thy brother? I know that he can speak well. And also, behold, he cometh forth to meet thee: and when he seeth thee, he will be glad in his heart.", "bsb": "Then the anger of the LORD burned against Moses, and He said, “Is not Aaron the Levite your brother? I know that he can speak well, and he is now on his way to meet you. When he sees you, he will be glad in his heart.", "web": "The LORD’s anger burned against Moses, and he said, “What about Aaron, your brother, the Levite? I know that he can speak well. Also, behold, he is coming out to meet you. When he sees you, he will be glad in his heart.", "lsg": "Alors la colère de l’Éternel s’enflamma contre Moïse, et il dit: N’y a t-il pas ton frère Aaron, le Lévite? Je sais qu’il parlera facilement. Le voici lui-même, qui vient au-devant de toi; et, quand il te verra, il se réjouira dans son cœur.", "lsgRef": "Exode 4:14"},
  "Exodus 5:2": {"kjv": "And Pharaoh said, Who is the LORD, that I should obey his voice to let Israel go? I know not the LORD, neither will I let Israel go.", "bsb": "But Pharaoh replied, “Who is the LORD that I should obey His voice and let Israel go? I do not know the LORD, and I will not let Israel go.”", "web": "Pharaoh said, “Who is the LORD, that I should listen to his voice to let Israel go? I don’t know the LORD, and moreover I will not let Israel go.”", "lsg": "Pharaon répondit: Qui est l’Éternel, pour que j’obéisse à sa voix, en laissant aller Israël? Je ne connais point l’Éternel, et je ne laisserai point aller Israël.", "lsgRef": "Exode 5:2"},
  "Exodus 6:20": {"kjv": "And Amram took him Jochebed his father’s sister to wife; and she bare him Aaron and Moses: and the years of the life of Amram were an hundred and thirty and seven years.", "bsb": "And Amram married his father’s sister Jochebed, and she bore him Aaron and Moses. Amram lived 137 years.", "web": "Amram took Jochebed his father’s sister to himself as wife; and she bore him Aaron and Moses. The years of the life of Amram were one hundred thirty-seven years.", "lsg": "Amram prit pour femme Jokébed, sa tante; et elle lui enfanta Aaron, et Moïse. Les années de la vie d’Amram furent de cent trente-sept ans.", "lsgRef": "Exode 6:20"},
  "Ezra 1:1": {"kjv": "Now in the first year of Cyrus king of Persia, that the word of the LORD by the mouth of Jeremiah might be fulfilled, the LORD stirred up the spirit of Cyrus king of Persia, that he made a proclamation throughout all his kingdom, and put it also in writing, saying,", "bsb": "In the first year of Cyrus king of Persia, to fulfill the word of the LORD spoken through Jeremiah, the LORD stirred the spirit of Cyrus king of Persia to send a proclamation throughout his kingdom and to put it in writing as follows:", "web": "Now in the first year of Cyrus king of Persia, that the LORD’s word by Jeremiah’s mouth might be accomplished, the LORD stirred up the spirit of Cyrus king of Persia, so that he made a proclamation throughout all his kingdom, and put it also in writing, saying,", "lsg": "La première année de Cyrus, roi de Perse, afin que s’accomplît la parole de l’Éternel prononcée par la bouche de Jérémie, l’Éternel réveilla l’esprit de Cyrus, roi de Perse, qui fit faire de vive voix et par écrit cette publication dans tout son royaume:", "lsgRef": "Esdras 1:1"},
  "Genesis 10:9": {"kjv": "He was a mighty hunter before the LORD: wherefore it is said, Even as Nimrod the mighty hunter before the LORD.", "bsb": "He was a mighty hunter before the LORD; so it is said, “Like Nimrod, a mighty hunter before the LORD.”", "web": "He was a mighty hunter before the LORD. Therefore it is said, “like Nimrod, a mighty hunter before the LORD”.", "lsg": "Il fut un vaillant chasseur devant l’Éternel; c’est pourquoi l’on dit: Comme Nimrod, vaillant chasseur devant l’Éternel.", "lsgRef": "Genèse 10:9"},
  "Genesis 11:31": {"kjv": "And Terah took Abram his son, and Lot the son of Haran his son’s son, and Sarai his daughter in law, his son Abram’s wife; and they went forth with them from Ur of the Chaldees, to go into the land of Canaan; and they came unto Haran, and dwelt there.", "bsb": "And Terah took his son Abram, his grandson Lot son of Haran, and his daughter-in-law Sarai the wife of Abram, and they set out from Ur of the Chaldeans for the land of Canaan. But when they arrived in Haran, they settled there.", "web": "Terah took Abram his son, Lot the son of Haran, his son’s son, and Sarai his daughter-in-law, his son Abram’s wife. They went from Ur of the Chaldees, to go into the land of Canaan. They came to Haran and lived there.", "lsg": "Térach prit Abram, son fils, et Lot, fils d’Haran, fils de son fils, et Saraï, sa belle-fille, femme d’Abram, son fils. Ils sortirent ensemble d’Ur en Chaldée, pour aller au pays de Canaan. Ils vinrent jusqu’à Charan, et ils y habitèrent.", "lsgRef": "Genèse 11:31"},
  "Genesis 11:9": {"kjv": "Therefore is the name of it called Babel; because the LORD did there confound the language of all the earth: and from thence did the LORD scatter them abroad upon the face of all the earth.", "bsb": "That is why it is called Babel, for there the LORD confused the language of the whole world, and from that place the LORD scattered them over the face of all the earth.", "web": "Therefore its name was called Babel, because there the LORD confused the language of all the earth. From there, the LORD scattered them abroad on the surface of all the earth.", "lsg": "C’est pourquoi on l’appela du nom de Babel, car c’est là que l’Éternel confondit le langage de toute la terre, et c’est de là que l’Éternel les dispersa sur la face de toute la terre.", "lsgRef": "Genèse 11:9"},
  "Genesis 13:12": {"kjv": "Abram dwelled in the land of Canaan, and Lot dwelled in the cities of the plain, and pitched his tent toward Sodom.", "bsb": "Abram lived in the land of Canaan, but Lot settled in the cities of the plain and pitched his tent toward Sodom.", "web": "Abram lived in the land of Canaan, and Lot lived in the cities of the plain, and moved his tent as far as Sodom.", "lsg": "Abram habita dans le pays de Canaan; et Lot habita dans les villes de la plaine, et dressa ses tentes jusqu’à Sodome.", "lsgRef": "Genèse 13:12"},
  "Genesis 14:18": {"kjv": "And Melchizedek king of Salem brought forth bread and wine: and he was the priest of the most high God.", "bsb": "Then Melchizedek king of Salem brought out bread and wine—since he was priest of God Most High—", "web": "Melchizedek king of Salem brought out bread and wine. He was priest of God Most High.", "lsg": "Melchisédek, roi de Salem, fit apporter du pain et du vin: il était sacrificateur du Dieu Très-Haut.", "lsgRef": "Genèse 14:18"},
  "Genesis 17:15": {"kjv": "And God said unto Abraham, As for Sarai thy wife, thou shalt not call her name Sarai, but Sarah shall her name be.", "bsb": "Then God said to Abraham, “As for Sarai your wife, do not call her Sarai, for her name is to be Sarah.", "web": "God said to Abraham, “As for Sarai your wife, you shall not call her name Sarai, but her name shall be Sarah.", "lsg": "Dieu dit à Abraham: Tu ne donneras plus à Saraï, ta femme, le nom de Saraï; mais son nom sera Sara.", "lsgRef": "Genèse 17:15"},
  "Genesis 19:26": {"kjv": "But his wife looked back from behind him, and she became a pillar of salt.", "bsb": "But Lot’s wife looked back, and she became a pillar of salt.", "web": "But Lot’s wife looked back from behind him, and she became a pillar of salt.", "lsg": "La femme de Lot regarda en arrière, et elle devint une statue de sel.", "lsgRef": "Genèse 19:26"},
  "Genesis 1:1": {"kjv": "In the beginning God created the heaven and the earth.", "bsb": "In the beginning God created the heavens and the earth.", "web": "In the beginning, God created the heavens and the earth.", "lsg": "Au commencement, Dieu créa les cieux et la terre.", "lsgRef": "Genèse 1:1"},
  "Genesis 1:3": {"kjv": "And God said, Let there be light: and there was light.", "bsb": "And God said, “Let there be light,” and there was light.", "web": "God said, “Let there be light,” and there was light.", "lsg": "Dieu dit: Que la lumière soit! Et la lumière fut.", "lsgRef": "Genèse 1:3"},
  "Genesis 21:3": {"kjv": "And Abraham called the name of his son that was born unto him, whom Sarah bare to him, Isaac.", "bsb": "And Abraham gave the name Isaac to the son Sarah bore to him.", "web": "Abraham called his son who was born to him, whom Sarah bore to him, Isaac.", "lsg": "Abraham donna le nom d’Isaac au fils qui lui était né, que Sara lui avait enfanté.", "lsgRef": "Genèse 21:3"},
  "Genesis 22:2": {"kjv": "And he said, Take now thy son, thine only son Isaac, whom thou lovest, and get thee into the land of Moriah; and offer him there for a burnt offering upon one of the mountains which I will tell thee of.", "bsb": "“Take your son,” God said, “your only son Isaac, whom you love, and go to the land of Moriah. Offer him there as a burnt offering on one of the mountains, which I will show you.”", "web": "He said, “Now take your son, your only son, Isaac, whom you love, and go into the land of Moriah. Offer him there as a burnt offering on one of the mountains which I will tell you of.”", "lsg": "Dieu dit: Prends ton fils, ton unique, celui que tu aimes, Isaac; va-t’en au pays de Morija, et là offre-le en holocauste sur l’une des montagnes que je te dirai.", "lsgRef": "Genèse 22:2"},
  "Genesis 22:8": {"kjv": "And Abraham said, My son, God will provide himself a lamb for a burnt offering: so they went both of them together.", "bsb": "Abraham answered, “God Himself will provide the lamb for the burnt offering, my son.” And the two walked on together.", "web": "Abraham said, “God will provide himself the lamb for a burnt offering, my son.” So they both went together.", "lsg": "Abraham répondit: Mon fils, Dieu se pourvoira lui-même de l’agneau pour l’holocauste. Et ils marchèrent tous deux ensemble.", "lsgRef": "Genèse 22:8"},
  "Genesis 23:19": {"kjv": "And after this, Abraham buried Sarah his wife in the cave of the field of Machpelah before Mamre: the same is Hebron in the land of Canaan.", "bsb": "After this, Abraham buried his wife Sarah in the cave of the field at Machpelah near Mamre (that is, Hebron) in the land of Canaan.", "web": "After this, Abraham buried Sarah his wife in the cave of the field of Machpelah before Mamre (that is, Hebron), in the land of Canaan.", "lsg": "Après cela, Abraham enterra Sara, sa femme, dans la caverne du champ de Macpéla, vis-à-vis de Mamré, qui est Hébron, dans le pays de Canaan.", "lsgRef": "Genèse 23:19"},
  "Genesis 25:25": {"kjv": "And the first came out red, all over like an hairy garment; and they called his name Esau.", "bsb": "The first one came out red, covered with hair like a fur coat; so they named him Esau.", "web": "The first came out red all over, like a hairy garment. They named him Esau.", "lsg": "Le premier sortit entièrement roux, comme un manteau de poil; et on lui donna le nom d’Ésaü.", "lsgRef": "Genèse 25:25"},
  "Genesis 25:33": {"kjv": "And Jacob said, Swear to me this day; and he sware unto him: and he sold his birthright unto Jacob.", "bsb": "“Swear to me first,” Jacob said. So Esau swore to Jacob and sold him the birthright.", "web": "Jacob said, “Swear to me first.” He swore to him. He sold his birthright to Jacob.", "lsg": "Et Jacob dit: Jure-le moi d’abord. Il le lui jura, et il vendit son droit d’aînesse à Jacob.", "lsgRef": "Genèse 25:33"},
  "Genesis 28:12": {"kjv": "And he dreamed, and behold a ladder set up on the earth, and the top of it reached to heaven: and behold the angels of God ascending and descending on it.", "bsb": "And Jacob had a dream about a ladder that rested on the earth with its top reaching up to heaven, and God’s angels were going up and down the ladder.", "web": "He dreamed and saw a stairway set upon the earth, and its top reached to heaven. Behold, the angels of God were ascending and descending on it.", "lsg": "Il eut un songe. Et voici, une échelle était appuyée sur la terre, et son sommet touchait au ciel. Et voici, les anges de Dieu montaient et descendaient par cette échelle.", "lsgRef": "Genèse 28:12"},
  "Genesis 29:30": {"kjv": "And he went in also unto Rachel, and he loved also Rachel more than Leah, and served with him yet seven other years.", "bsb": "Jacob slept with Rachel as well, and indeed, he loved Rachel more than Leah. So he worked for Laban another seven years.", "web": "He went in also to Rachel, and he loved also Rachel more than Leah, and served with him seven more years.", "lsg": "Jacob alla aussi vers Rachel, qu’il aimait plus que Léa; et il servit encore chez Laban pendant sept nouvelles années.", "lsgRef": "Genèse 29:30"},
  "Genesis 2:2": {"kjv": "And on the seventh day God ended his work which he had made; and he rested on the seventh day from all his work which he had made.", "bsb": "And by the seventh day God had finished the work He had been doing; so on that day He rested from all His work.", "web": "On the seventh day God finished his work which he had done; and he rested on the seventh day from all his work which he had done.", "lsg": "Dieu acheva au septième jour son œuvre, qu’il avait faite: et il se reposa au septième jour de toute son œuvre, qu’il avait faite.", "lsgRef": "Genèse 2:2"},
  "Genesis 2:22": {"kjv": "And the rib, which the LORD God had taken from man, made he a woman, and brought her unto the man.", "bsb": "And from the rib that the LORD God had taken from the man, He made a woman and brought her to him.", "web": "The LORD God made a woman from the rib which he had taken from the man, and brought her to the man.", "lsg": "L’Éternel Dieu forma une femme de la côte qu’il avait prise de l’homme, et il l’amena vers l’homme.", "lsgRef": "Genèse 2:22"},
  "Genesis 2:8": {"kjv": "And the LORD God planted a garden eastward in Eden; and there he put the man whom he had formed.", "bsb": "And the LORD God planted a garden in Eden, in the east, where He placed the man He had formed.", "web": "The LORD God planted a garden eastward, in Eden, and there he put the man whom he had formed.", "lsg": "Puis l’Éternel Dieu planta un jardin en Éden, du côté de l’orient, et il y mit l’homme qu’il avait formé.", "lsgRef": "Genèse 2:8"},
  "Genesis 35:10": {"kjv": "And God said unto him, Thy name is Jacob: thy name shall not be called any more Jacob, but Israel shall be thy name: and he called his name Israel.", "bsb": "And God said to him, “Though your name is Jacob, you will no longer be called Jacob. Instead, your name will be Israel.” So God named him Israel.", "web": "God said to him, “Your name is Jacob. Your name shall not be Jacob any more, but your name will be Israel.” He named him Israel.", "lsg": "Dieu lui dit: Ton nom est Jacob; tu ne seras plus appelé Jacob, mais ton nom sera Israël. Et il lui donna le nom d’Israël.", "lsgRef": "Genèse 35:10"},
  "Genesis 37:28": {"kjv": "Then there passed by Midianites merchantmen; and they drew and lifted up Joseph out of the pit, and sold Joseph to the Ishmeelites for twenty pieces of silver: and they brought Joseph into Egypt.", "bsb": "So when the Midianite traders passed by, his brothers pulled Joseph out of the pit and sold him for twenty shekels of silver to the Ishmaelites, who took him to Egypt.", "web": "Midianites who were merchants passed by, and they drew and lifted up Joseph out of the pit, and sold Joseph to the Ishmaelites for twenty pieces of silver. The merchants brought Joseph into Egypt.", "lsg": "Au passage des marchands madianites, ils tirèrent et firent remonter Joseph hors de la citerne; et ils le vendirent pour vingt sicles d’argent aux Ismaélites, qui l’emmenèrent en Égypte.", "lsgRef": "Genèse 37:28"},
  "Genesis 37:3": {"kjv": "Now Israel loved Joseph more than all his children, because he was the son of his old age: and he made him a coat of many colours.", "bsb": "Now Israel loved Joseph more than his other sons, because Joseph had been born to him in his old age; so he made him a robe of many colors.", "web": "Now Israel loved Joseph more than all his children, because he was the son of his old age, and he made him a tunic of many colors.", "lsg": "Israël aimait Joseph plus que tous ses autres fils, parce qu’il l’avait eu dans sa vieillesse; et il lui fit une tunique de plusieurs couleurs.", "lsgRef": "Genèse 37:3"},
  "Genesis 3:1": {"kjv": "Now the serpent was more subtil than any beast of the field which the LORD God had made. And he said unto the woman, Yea, hath God said, Ye shall not eat of every tree of the garden?", "bsb": "Now the serpent was more crafty than any beast of the field that the LORD God had made. And he said to the woman, “Did God really say, ‘You must not eat from any tree in the garden?’”", "web": "Now the serpent was more subtle than any animal of the field which the LORD God had made. He said to the woman, “Has God really said, ‘You shall not eat of any tree of the garden’?”", "lsg": "Le serpent était le plus rusé de tous les animaux des champs, que l’Éternel Dieu avait faits. Il dit à la femme: Dieu a-t-il réellement dit: Vous ne mangerez pas de tous les arbres du jardin?", "lsgRef": "Genèse 3:1"},
  "Genesis 3:13": {"kjv": "And the LORD God said unto the woman, What is this that thou hast done? And the woman said, The serpent beguiled me, and I did eat.", "bsb": "Then the LORD God said to the woman, “What is this you have done?” “The serpent deceived me,” she replied, “and I ate.”", "web": "The LORD God said to the woman, “What have you done?” The woman said, “The serpent deceived me, and I ate.”", "lsg": "Et l’Éternel Dieu dit à la femme: Pourquoi as-tu fait cela? La femme répondit: Le serpent m’a séduite, et j’en ai mangé.", "lsgRef": "Genèse 3:13"},
  "Genesis 3:20": {"kjv": "And Adam called his wife’s name Eve; because she was the mother of all living.", "bsb": "And Adam named his wife Eve, because she would be the mother of all the living.", "web": "The man called his wife Eve because she would be the mother of all the living.", "lsg": "Adam donna à sa femme le nom d’Ève: car elle a été la mère de tous les vivants.", "lsgRef": "Genèse 3:20"},
  "Genesis 41:29": {"kjv": "Behold, there come seven years of great plenty throughout all the land of Egypt:", "bsb": "Behold, seven years of great abundance are coming throughout the land of Egypt,", "web": "Behold, seven years of great plenty throughout all the land of Egypt are coming.", "lsg": "Voici, il y aura sept années de grande abondance dans tout le pays d’Égypte.", "lsgRef": "Genèse 41:29"},
  "Genesis 4:21": {"kjv": "And his brother’s name was Jubal: he was the father of all such as handle the harp and organ.", "bsb": "And his brother’s name was Jubal; he was the father of all who play the harp and flute.", "web": "His brother’s name was Jubal, who was the father of all who handle the harp and pipe.", "lsg": "Le nom de son frère était Jubal: il fut le père de tous ceux qui jouent de la harpe et du chalumeau.", "lsgRef": "Genèse 4:21"},
  "Genesis 4:22": {"kjv": "And Zillah, she also bare Tubal–cain, an instructer of every artificer in brass and iron: and the sister of Tubal–cain was Naamah.", "bsb": "And Zillah gave birth to Tubal-cain, a forger of every implement of bronze and iron. And the sister of Tubal-cain was Naamah.", "web": "Zillah also gave birth to Tubal Cain, the forger of every cutting instrument of bronze and iron. Tubal Cain’s sister was Naamah.", "lsg": "Tsilla, de son côté, enfanta Tubal-Caïn, qui forgeait tous les instruments d’airain et de fer. La sœur de Tubal-Caïn était Naama.", "lsgRef": "Genèse 4:22"},
  "Genesis 4:8": {"kjv": "And Cain talked with Abel his brother: and it came to pass, when they were in the field, that Cain rose up against Abel his brother, and slew him.", "bsb": "Then Cain said to his brother Abel, “Let us go out to the field.” And while they were in the field, Cain rose up against his brother Abel and killed him.", "web": "Cain said to Abel, his brother, “Let’s go into the field.” While they were in the field, Cain rose up against Abel, his brother, and killed him.", "lsg": "Cependant, Caïn adressa la parole à son frère Abel; mais, comme ils étaient dans les champs, Caïn se jeta sur son frère Abel, et le tua.", "lsgRef": "Genèse 4:8"},
  "Genesis 4:9": {"kjv": "And the LORD said unto Cain, Where is Abel thy brother? And he said, I know not: Am I my brother’s keeper?", "bsb": "And the LORD said to Cain, “Where is your brother Abel?” “I do not know!” he answered. “Am I my brother’s keeper?”", "web": "The LORD said to Cain, “Where is Abel, your brother?” He said, “I don’t know. Am I my brother’s keeper?”", "lsg": "L’Éternel dit à Caïn: Où est ton frère Abel? Il répondit: Je ne sais pas; suis-je le gardien de mon frère?", "lsgRef": "Genèse 4:9"},
  "Genesis 50:20": {"kjv": "But as for you, ye thought evil against me; but God meant it unto good, to bring to pass, as it is this day, to save much people alive.", "bsb": "As for you, what you intended against me for evil, God intended for good, in order to accomplish a day like this—to preserve the lives of many people.", "web": "As for you, you meant evil against me, but God meant it for good, to save many people alive, as is happening today.", "lsg": "Vous aviez médité de me faire du mal: Dieu l’a changé en bien, pour accomplir ce qui arrive aujourd’hui, pour sauver la vie à un peuple nombreux.", "lsgRef": "Genèse 50:20"},
  "Genesis 5:24": {"kjv": "And Enoch walked with God: and he was not; for God took him.", "bsb": "Enoch walked with God, and then he was no more, because God had taken him away.", "web": "Enoch walked with God, and he was not found, for God took him.", "lsg": "Hénoc marcha avec Dieu; puis il ne fut plus, parce que Dieu le prit.", "lsgRef": "Genèse 5:24"},
  "Genesis 5:27": {"kjv": "And all the days of Methuselah were nine hundred sixty and nine years: and he died.", "bsb": "So Methuselah lived a total of 969 years, and then he died.", "web": "All the days of Methuselah were nine hundred sixty-nine years, then he died.", "lsg": "Tous les jours de Metuschélah furent de neuf cent soixante-neuf ans; puis il mourut.", "lsgRef": "Genèse 5:27"},
  "Genesis 6:14": {"kjv": "Make thee an ark of gopher wood; rooms shalt thou make in the ark, and shalt pitch it within and without with pitch.", "bsb": "Make for yourself an ark of gopher wood; make rooms in the ark and coat it with pitch inside and out.", "web": "Make a ship of gopher wood. You shall make rooms in the ship, and shall seal it inside and outside with pitch.", "lsg": "Fais-toi une arche de bois de gopher; tu disposeras cette arche en cellules, et tu l’enduiras de poix en dedans et en dehors.", "lsgRef": "Genèse 6:14"},
  "Genesis 7:12": {"kjv": "And the rain was upon the earth forty days and forty nights.", "bsb": "And the rain fell upon the earth for forty days and forty nights.", "web": "It rained on the earth forty days and forty nights.", "lsg": "La pluie tomba sur la terre quarante jours et quarante nuits.", "lsgRef": "Genèse 7:12"},
  "Genesis 8:11": {"kjv": "And the dove came in to him in the evening; and, lo, in her mouth was an olive leaf pluckt off: so Noah knew that the waters were abated from off the earth.", "bsb": "And behold, the dove returned to him in the evening with a freshly plucked olive leaf in her beak. So Noah knew that the waters had receded from the earth.", "web": "The dove came back to him at evening and, behold, in her mouth was a freshly plucked olive leaf. So Noah knew that the waters were abated from the earth.", "lsg": "La colombe revint à lui sur le soir; et voici, une feuille d’olivier arrachée était dans son bec. Noé connut ainsi que les eaux avaient diminué sur la terre.", "lsgRef": "Genèse 8:11"},
  "Genesis 9:13": {"kjv": "I do set my bow in the cloud, and it shall be for a token of a covenant between me and the earth.", "bsb": "I have set My rainbow in the clouds, and it will be a sign of the covenant between Me and the earth.", "web": "I set my rainbow in the cloud, and it will be a sign of a covenant between me and the earth.", "lsg": "j’ai placé mon arc dans la nue, et il servira de signe d’alliance entre moi et la terre.", "lsgRef": "Genèse 9:13"},
  "Hebrews 11:30": {"kjv": "By faith the walls of Jericho fell down, after they were compassed about seven days.", "bsb": "By faith the walls of Jericho fell, after the people had marched around them for seven days.", "web": "By faith the walls of Jericho fell down after they had been encircled for seven days.", "lsg": "C’est par la foi que les murailles de Jéricho tombèrent, après qu’on en eut fait le tour pendant sept jours.", "lsgRef": "Hébreux 11:30"},
  "Hebrews 11:7": {"kjv": "By faith Noah, being warned of God of things not seen as yet, moved with fear, prepared an ark to the saving of his house; by the which he condemned the world, and became heir of the righteousness which is by faith.", "bsb": "By faith Noah, when warned about things not yet seen, in godly fear built an ark to save his family. By faith he condemned the world and became heir of the righteousness that comes by faith.", "web": "By faith Noah, being warned about things not yet seen, moved with godly fear, prepared a ship for the saving of his house, through which he condemned the world and became heir of the righteousness which is according to faith.", "lsg": "C’est par la foi que Noé, divinement averti des choses qu’on ne voyait pas encore, et saisi d’une crainte respectueuse, construisit une arche pour sauver sa famille; c’est par elle qu’il condamna le monde, et devint héritier de la justice qui s’obtient par la foi.", "lsgRef": "Hébreux 11:7"},
  "Hosea 1:2-3": {"kjv": "The beginning of the word of the LORD by Hosea. And the LORD said to Hosea, Go, take unto thee a wife of whoredoms and children of whoredoms: for the land hath committed great whoredom, departing from the LORD. So he went and took Gomer the daughter of Diblaim; which conceived, and bare him a son.", "bsb": "When the LORD first spoke through Hosea, He told him, “Go, take a prostitute as your wife and have children of adultery, because this land is flagrantly prostituting itself by departing from the LORD.” So Hosea went and married Gomer daughter of Diblaim, and she conceived and bore him a son.", "web": "When the LORD spoke at first by Hosea, the LORD said to Hosea, “Go, take for yourself a wife of prostitution and children of unfaithfulness; for the land commits great adultery, forsaking the LORD.” So he went and took Gomer the daughter of Diblaim; and she conceived, and bore him a son.", "lsg": "La première fois que l’Éternel adressa la parole à Osée, l’Éternel dit à Osée: Va, prends une femme prostituée et des enfants de prostitution; car le pays se prostitue, il abandonne l’Éternel! Il alla, et il prit Gomer, fille de Diblaïm. Elle conçut, et lui enfanta un fils.", "lsgRef": "Osée 1:2-3"},
  "Isaiah 6:8": {"kjv": "Also I heard the voice of the Lord, saying, Whom shall I send, and who will go for us? Then said I, Here am I; send me.", "bsb": "Then I heard the voice of the Lord saying: “Whom shall I send? Who will go for Us?” And I said: “Here am I. Send me!”", "web": "I heard the Lord’s voice, saying, “Whom shall I send, and who will go for us?” Then I said, “Here I am. Send me!”", "lsg": "J’entendis la voix du Seigneur, disant: Qui enverrai-je, et qui marchera pour nous? Je répondis: Me voici, envoie-moi.", "lsgRef": "Ésaïe 6:8"},
  "Jeremiah 1:6": {"kjv": "Then said I, Ah, Lord GOD! behold, I cannot speak: for I am a child.", "bsb": "“Ah, Lord GOD,” I said, “I surely do not know how to speak, for I am only a child!”", "web": "Then I said, “Ah, Lord GOD! Behold, I don’t know how to speak; for I am a child.”", "lsg": "Je répondis: Ah! Seigneur Éternel! Voici, je ne sais point parler, car je suis un enfant.", "lsgRef": "Jérémie 1:6"},
  "Job 19:25": {"kjv": "For I know that my redeemer liveth, and that he shall stand at the latter day upon the earth:", "bsb": "But I know that my Redeemer lives, and in the end He will stand upon the earth.", "web": "But as for me, I know that my Redeemer lives. In the end, he will stand upon the earth.", "lsg": "Mais je sais que mon rédempteur est vivant, Et qu’il se lèvera le dernier sur la terre.", "lsgRef": "Job 19:25"},
  "Job 1:1": {"kjv": "There was a man in the land of Uz, whose name was Job; and that man was perfect and upright, and one that feared God, and eschewed evil.", "bsb": "There was a man in the land of Uz whose name was Job. And this man was blameless and upright, fearing God and shunning evil.", "web": "There was a man in the land of Uz, whose name was Job. That man was blameless and upright, and one who feared God, and turned away from evil.", "lsg": "Il y avait dans le pays d’Uts un homme qui s’appelait Job. Et cet homme était intègre et droit; il craignait Dieu, et se détournait du mal.", "lsgRef": "Job 1:1"},
  "Job 1:21": {"kjv": "And said, Naked came I out of my mother’s womb, and naked shall I return thither: the LORD gave, and the LORD hath taken away; blessed be the name of the LORD.", "bsb": "saying: “Naked I came from my mother’s womb, and naked I will return. The LORD gave, and the LORD has taken away. Blessed be the name of the LORD.”", "web": "He said, “Naked I came out of my mother’s womb, and naked will I return there. The LORD gave, and the LORD has taken away. Blessed be the LORD’s name.”", "lsg": "et dit: Je suis sorti nu du sein de ma mère, et nu je retournerai dans le sein de la terre. L’Éternel a donné, et l’Éternel a ôté; que le nom de l’Éternel soit béni!", "lsgRef": "Job 1:21"},
  "John 11:25": {"kjv": "Jesus said unto her, I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live:", "bsb": "Jesus said to her, “I am the resurrection and the life. Whoever believes in Me will live, even though he dies.", "web": "Jesus said to her, “I am the resurrection and the life. He who believes in me will still live, even if he dies.", "lsg": "Jésus lui dit: Je suis la résurrection et la vie. Celui qui croit en moi vivra, quand même il serait mort;", "lsgRef": "Jean 11:25"},
  "John 11:27": {"kjv": "She saith unto him, Yea, Lord: I believe that thou art the Christ, the Son of God, which should come into the world.", "bsb": "“Yes, Lord,” she answered, “I believe that You are the Christ, the Son of God, who was to come into the world.”", "web": "She said to him, “Yes, Lord. I have come to believe that you are the Christ, God’s Son, he who comes into the world.”", "lsg": "Elle lui dit: Oui, Seigneur, je crois que tu es le Christ, le Fils de Dieu, qui devait venir dans le monde.", "lsgRef": "Jean 11:27"},
  "John 11:35": {"kjv": "Jesus wept.", "bsb": "Jesus wept.", "web": "Jesus wept.", "lsg": "Jésus pleura.", "lsgRef": "Jean 11:35"},
  "John 11:43": {"kjv": "And when he thus had spoken, he cried with a loud voice, Lazarus, come forth.", "bsb": "After Jesus had said this, He called out in a loud voice, “Lazarus, come out!”", "web": "When he had said this, he cried with a loud voice, “Lazarus, come out!”", "lsg": "Ayant dit cela, il cria d’une voix forte: Lazare, sors!", "lsgRef": "Jean 11:43"},
  "John 12:14": {"kjv": "And Jesus, when he had found a young ass, sat thereon; as it is written,", "bsb": "Finding a young donkey, Jesus sat on it, as it is written:", "web": "Jesus, having found a young donkey, sat on it. As it is written,", "lsg": "Jésus trouva un ânon, et s’assit dessus, selon ce qui est écrit:", "lsgRef": "Jean 12:14"},
  "John 13:5": {"kjv": "After that he poureth water into a bason, and began to wash the disciples’ feet, and to wipe them with the towel wherewith he was girded.", "bsb": "After that, He poured water into a basin and began to wash the disciples’ feet and dry them with the towel that was around Him.", "web": "Then he poured water into the basin, and began to wash the disciples’ feet and to wipe them with the towel that was wrapped around him.", "lsg": "Ensuite il versa de l’eau dans un bassin, et il se mit à laver les pieds des disciples, et à les essuyer avec le linge dont il était ceint.", "lsgRef": "Jean 13:5"},
  "John 18:10": {"kjv": "Then Simon Peter having a sword drew it, and smote the high priest’s servant, and cut off his right ear. The servant’s name was Malchus.", "bsb": "Then Simon Peter drew his sword and struck the servant of the high priest, cutting off his right ear. The servant’s name was Malchus.", "web": "Simon Peter therefore, having a sword, drew it, struck the high priest’s servant, and cut off his right ear. The servant’s name was Malchus.", "lsg": "Simon Pierre, qui avait une épée, la tira, frappa le serviteur du souverain sacrificateur, et lui coupa l’oreille droite. Ce serviteur s’appelait Malchus.", "lsgRef": "Jean 18:10"},
  "John 19:38": {"kjv": "And after this Joseph of Arimathea, being a disciple of Jesus, but secretly for fear of the Jews, besought Pilate that he might take away the body of Jesus: and Pilate gave him leave. He came therefore, and took the body of Jesus.", "bsb": "Afterward, Joseph of Arimathea, who was a disciple of Jesus (but secretly for fear of the Jews), asked Pilate to let him remove the body of Jesus. Pilate gave him permission, so he came and removed His body.", "web": "After these things, Joseph of Arimathaea, being a disciple of Jesus, but secretly for fear of the Jews, asked of Pilate that he might take away Jesus’ body. Pilate gave him permission. He came therefore and took away his body.", "lsg": "Après cela, Joseph d’Arimathée, qui était disciple de Jésus, mais en secret par crainte des Juifs, demanda à Pilate la permission de prendre le corps de Jésus. Et Pilate le permit. Il vint donc, et prit le corps de Jésus.", "lsgRef": "Jean 19:38"},
  "John 1:29": {"kjv": "The next day John seeth Jesus coming unto him, and saith, Behold the Lamb of God, which taketh away the sin of the world.", "bsb": "The next day John saw Jesus coming toward him and said, “Look, the Lamb of God, who takes away the sin of the world!", "web": "The next day, he saw Jesus coming to him, and said, “Behold, the Lamb of God, who takes away the sin of the world!", "lsg": "Le lendemain, il vit Jésus venant à lui, et il dit: Voici l’Agneau de Dieu, qui ôte le péché du monde.", "lsgRef": "Jean 1:29"},
  "John 1:40-41": {"kjv": "One of the two which heard John speak, and followed him, was Andrew, Simon Peter’s brother. He first findeth his own brother Simon, and saith unto him, We have found the Messias, which is, being interpreted, the Christ.", "bsb": "Andrew, Simon Peter’s brother, was one of the two who heard John’s testimony and followed Jesus. He first found his brother Simon and told him, “We have found the Messiah” (which is translated as Christ).", "web": "One of the two who heard John and followed him was Andrew, Simon Peter’s brother. He first found his own brother, Simon, and said to him, “We have found the Messiah!” (which is, being interpreted, Christ).", "lsg": "André, frère de Simon Pierre, était l’un des deux qui avaient entendu les paroles de Jean, et qui avaient suivi Jésus. Ce fut lui qui rencontra le premier son frère Simon, et il lui dit: Nous avons trouvé le Messie (ce qui signifie Christ).", "lsgRef": "Jean 1:40-41"},
  "John 1:45": {"kjv": "Philip findeth Nathanael, and saith unto him, We have found him, of whom Moses in the law, and the prophets, did write, Jesus of Nazareth, the son of Joseph.", "bsb": "Philip found Nathanael and told him, “We have found the One Moses wrote about in the Law, the One the prophets foretold—Jesus of Nazareth, the son of Joseph.”", "web": "Philip found Nathanael, and said to him, “We have found him of whom Moses in the law and also the prophets, wrote: Jesus of Nazareth, the son of Joseph.”", "lsg": "Philippe rencontra Nathanaël, et lui dit: Nous avons trouvé celui de qui Moïse a écrit dans la loi et dont les prophètes ont parlé, Jésus de Nazareth, fils de Joseph.", "lsgRef": "Jean 1:45"},
  "John 1:46": {"kjv": "And Nathanael said unto him, Can there any good thing come out of Nazareth? Philip saith unto him, Come and see.", "bsb": "“Can anything good come from Nazareth?” Nathanael asked. “Come and see,” said Philip.", "web": "Nathanael said to him, “Can any good thing come out of Nazareth?” Philip said to him, “Come and see.”", "lsg": "Nathanaël lui dit: Peut-il venir de Nazareth quelque chose de bon? Philippe lui répondit: Viens, et vois.", "lsgRef": "Jean 1:46"},
  "John 20:24-25": {"kjv": "But Thomas, one of the twelve, called Didymus, was not with them when Jesus came. The other disciples therefore said unto him, We have seen the Lord. But he said unto them, Except I shall see in his hands the print of the nails, and put my finger into the print of the nails, and thrust my hand into his side, I will not believe.", "bsb": "Now Thomas called Didymus, one of the Twelve, was not with the disciples when Jesus came. So the other disciples told him, “We have seen the Lord!” But he replied, “Unless I see the nail marks in His hands, and put my finger where the nails have been, and put my hand into His side, I will never believe.”", "web": "But Thomas, one of the twelve, called Didymus, wasn’t with them when Jesus came. The other disciples therefore said to him, “We have seen the Lord!” But he said to them, “Unless I see in his hands the print of the nails, put my finger into the print of the nails, and put my hand into his side, I will not believe.”", "lsg": "Thomas, appelé Didyme, l’un des douze, n’était pas avec eux lorsque Jésus vint. Les autres disciples lui dirent donc: Nous avons vu le Seigneur. Mais il leur dit: Si je ne vois dans ses mains la marque des clous, et si je ne mets mon doigt dans la marque des clous, et si je ne mets ma main dans son côté, je ne croirai point.", "lsgRef": "Jean 20:24-25"},
  "John 20:28": {"kjv": "And Thomas answered and said unto him, My Lord and my God.", "bsb": "Thomas replied, “My Lord and my God!”", "web": "Thomas answered him, “My Lord and my God!”", "lsg": "Thomas lui répondit: Mon Seigneur et mon Dieu! Jésus lui dit:", "lsgRef": "Jean 20:28"},
  "John 2:9": {"kjv": "When the ruler of the feast had tasted the water that was made wine, and knew not whence it was: (but the servants which drew the water knew;) the governor of the feast called the bridegroom,", "bsb": "and the master of the banquet tasted the water that had been turned into wine. He did not know where it was from, but the servants who had drawn the water knew. Then he called the bridegroom aside", "web": "When the ruler of the feast tasted the water now become wine, and didn’t know where it came from (but the servants who had drawn the water knew), the ruler of the feast called the bridegroom", "lsg": "Quand l’ordonnateur du repas eut goûté l’eau changée en vin, ne sachant d’où venait ce vin, tandis que les serviteurs, qui avaient puisé l’eau, le savaient bien, il appela l’époux,", "lsgRef": "Jean 2:9"},
  "John 3:16": {"kjv": "For God so loved the world, that he gave his only begotten Son, that whosoever believeth in him should not perish, but have everlasting life.", "bsb": "For God so loved the world that He gave His one and only Son, that everyone who believes in Him shall not perish but have eternal life.", "web": "For God so loved the world, that he gave his only born Son, that whoever believes in him should not perish, but have eternal life.", "lsg": "Car Dieu a tant aimé le monde qu’il a donné son Fils unique, afin que quiconque croit en lui ne périsse point, mais qu’il ait la vie éternelle.", "lsgRef": "Jean 3:16"},
  "John 3:4": {"kjv": "Nicodemus saith unto him, How can a man be born when he is old? can he enter the second time into his mother’s womb, and be born?", "bsb": "“How can a man be born when he is old?” Nicodemus asked. “Can he enter his mother’s womb a second time to be born?”", "web": "Nicodemus said to him, “How can a man be born when he is old? Can he enter a second time into his mother’s womb and be born?”", "lsg": "Nicodème lui dit: Comment un homme peut-il naître quand il est vieux? Peut-il rentrer dans le sein de sa mère et naître?", "lsgRef": "Jean 3:4"},
  "John 4:6": {"kjv": "Now Jacob’s well was there. Jesus therefore, being wearied with his journey, sat thus on the well: and it was about the sixth hour.", "bsb": "Since Jacob’s well was there, Jesus, weary from His journey, sat down by the well. It was about the sixth hour.", "web": "Jacob’s well was there. Jesus therefore, being tired from his journey, sat down by the well. It was about the sixth hour.", "lsg": "Là se trouvait le puits de Jacob. Jésus, fatigué du voyage, était assis au bord du puits. C’était environ la sixième heure.", "lsgRef": "Jean 4:6"},
  "John 5:2": {"kjv": "Now there is at Jerusalem by the sheep market a pool, which is called in the Hebrew tongue Bethesda, having five porches.", "bsb": "Now there is in Jerusalem near the Sheep Gate a pool with five covered colonnades, which in Hebrew is called Bethesda.", "web": "Now in Jerusalem by the sheep gate, there is a pool, which is called in Hebrew, “Bethesda”, having five porches.", "lsg": "Or, à Jérusalem, près de la porte des brebis, il y a une piscine qui s’appelle en hébreu Béthesda, et qui a cinq portiques.", "lsgRef": "Jean 5:2"},
  "John 6:68": {"kjv": "Then Simon Peter answered him, Lord, to whom shall we go? thou hast the words of eternal life.", "bsb": "Simon Peter replied, “Lord, to whom would we go? You have the words of eternal life.", "web": "Simon Peter answered him, “Lord, to whom would we go? You have the words of eternal life.", "lsg": "Simon Pierre lui répondit: Seigneur, à qui irions-nous? Tu as les paroles de la vie éternelle.", "lsgRef": "Jean 6:68"},
  "John 6:9": {"kjv": "There is a lad here, which hath five barley loaves, and two small fishes: but what are they among so many?", "bsb": "“Here is a boy with five barley loaves and two small fish. But what difference will these make among so many?”", "web": "“There is a boy here who has five barley loaves and two fish, but what are these among so many?”", "lsg": "Il y a ici un jeune garçon qui a cinq pains d’orge et deux poissons; mais qu’est-ce que cela pour tant de gens?", "lsgRef": "Jean 6:9"},
  "John 9:7": {"kjv": "And said unto him, Go, wash in the pool of Siloam, (which is by interpretation, Sent.) He went his way therefore, and washed, and came seeing.", "bsb": "Then He told him, “Go, wash in the Pool of Siloam” (which means “Sent”). So the man went and washed, and came back seeing.", "web": "and said to him, “Go, wash in the pool of Siloam” (which means “Sent”). So he went away, washed, and came back seeing.", "lsg": "et lui dit: Va, et lave-toi au réservoir de Siloé (nom qui signifie envoyé). Il y alla, se lava, et s’en retourna voyant clair.", "lsgRef": "Jean 9:7"},
  "Jonah 1:17": {"kjv": "Now the LORD had prepared a great fish to swallow up Jonah. And Jonah was in the belly of the fish three days and three nights.", "bsb": "Now the LORD had appointed a great fish to swallow Jonah, and Jonah spent three days and three nights in the belly of the fish.", "web": "The LORD prepared a huge fish to swallow up Jonah, and Jonah was in the belly of the fish three days and three nights.", "lsg": "L’Éternel fit venir un grand poisson pour engloutir Jonas, et Jonas fut dans le ventre du poisson trois jours et trois nuits.", "lsgRef": "Jonas 2:1"},
  "Jonah 1:2": {"kjv": "Arise, go to Nineveh, that great city, and cry against it; for their wickedness is come up before me.", "bsb": "“Get up! Go to the great city of Nineveh and preach against it, because its wickedness has come up before Me.”", "web": "“Arise, go to Nineveh, that great city, and preach against it, for their wickedness has come up before me.”", "lsg": "Lève-toi, va à Ninive, la grande ville, et crie contre elle! Car sa méchanceté est montée jusqu’à moi.", "lsgRef": "Jonas 1:2"},
  "Jonah 1:3": {"kjv": "But Jonah rose up to flee unto Tarshish from the presence of the LORD, and went down to Joppa; and he found a ship going to Tarshish: so he paid the fare thereof, and went down into it, to go with them unto Tarshish from the presence of the LORD.", "bsb": "Jonah, however, got up to flee to Tarshish, away from the presence of the LORD. He went down to Joppa and found a ship bound for Tarshish. So he paid the fare and went aboard to sail for Tarshish, away from the presence of the LORD.", "web": "But Jonah rose up to flee to Tarshish from the presence of the LORD. He went down to Joppa, and found a ship going to Tarshish; so he paid its fare, and went down into it, to go with them to Tarshish from the presence of the LORD.", "lsg": "Et Jonas se leva pour s’enfuir à Tarsis, loin de la face de l’Éternel. Il descendit à Japho, et il trouva un navire qui allait à Tarsis; il paya le prix du transport, et s’embarqua pour aller avec les passagers à Tarsis, loin de la face de l’Éternel.", "lsgRef": "Jonas 1:3"},
  "Joshua 24:15": {"kjv": "And if it seem evil unto you to serve the LORD, choose you this day whom ye will serve; whether the gods which your fathers served that were on the other side of the flood, or the gods of the Amorites, in whose land ye dwell: but as for me and my house, we will serve the LORD.", "bsb": "But if it is unpleasing in your sight to serve the LORD, then choose for yourselves this day whom you will serve, whether the gods your fathers served beyond the Euphrates, or the gods of the Amorites in whose land you are living. As for me and my house, we will serve the LORD!”", "web": "If it seems evil to you to serve the LORD, choose today whom you will serve; whether the gods which your fathers served that were beyond the River, or the gods of the Amorites, in whose land you dwell; but as for me and my house, we will serve the LORD.”", "lsg": "Et si vous ne trouvez pas bon de servir l’Éternel, choisissez aujourd’hui qui vous voulez servir, ou les dieux que servaient vos pères au-delà du fleuve, ou les dieux des Amoréens dans le pays desquels vous habitez. Moi et ma maison, nous servirons l’Éternel.", "lsgRef": "Josué 24:15"},
  "Joshua 2:1": {"kjv": "And Joshua the son of Nun sent out of Shittim two men to spy secretly, saying, Go view the land, even Jericho. And they went, and came into an harlot’s house, named Rahab, and lodged there.", "bsb": "Then Joshua son of Nun secretly sent two spies from Shittim, saying, “Go, inspect the land, especially Jericho.” So they went and entered the house of a prostitute named Rahab and stayed there.", "web": "Joshua the son of Nun secretly sent two men out of Shittim as spies, saying, “Go, view the land, including Jericho.” They went and came into the house of a prostitute whose name was Rahab, and slept there.", "lsg": "Josué, fils de Nun, fit partir secrètement de Sittim deux espions, en leur disant: Allez, examinez le pays, et en particulier Jéricho. Ils partirent, et ils arrivèrent dans la maison d’une prostituée, qui se nommait Rahab, et ils y couchèrent.", "lsgRef": "Josué 2:1"},
  "Joshua 7:20-21": {"kjv": "And Achan answered Joshua, and said, Indeed I have sinned against the LORD God of Israel, and thus and thus have I done: When I saw among the spoils a goodly Babylonish garment, and two hundred shekels of silver, and a wedge of gold of fifty shekels weight, then I coveted them, and took them; and, behold, they are hid in the earth in the midst of my tent, and the silver under it.", "bsb": "“It is true,” Achan replied, “I have sinned against the LORD, the God of Israel. This is what I did: When I saw among the spoils a beautiful cloak from Shinar, two hundred shekels of silver, and a bar of gold weighing fifty shekels, I coveted them and took them. They are hidden in the ground inside my tent, with the silver underneath.”", "web": "Achan answered Joshua, and said, “I have truly sinned against the LORD, the God of Israel, and this is what I have done. When I saw among the plunder a beautiful Babylonian robe, two hundred shekels of silver, and a wedge of gold weighing fifty shekels, then I coveted them and took them. Behold, they are hidden in the ground in the middle of my tent, with the silver under it.”", "lsg": "Acan répondit à Josué, et dit: Il est vrai que j’ai péché contre l’Éternel, le Dieu d’Israël, et voici ce que j’ai fait. J’ai vu dans le butin un beau manteau de Schinear, deux cents sicles d’argent, et un lingot d’or du poids de cinquante sicles; je les ai convoités, et je les ai pris; ils sont cachés dans la terre au milieu de ma tente, et l’argent est dessous.", "lsgRef": "Josué 7:20-21"},
  "Jude 1:9": {"kjv": "Yet Michael the archangel, when contending with the devil he disputed about the body of Moses, durst not bring against him a railing accusation, but said, The Lord rebuke thee.", "bsb": "But even the archangel Michael, when he disputed with the devil over the body of Moses, did not presume to bring a slanderous charge against him, but said, “The Lord rebuke you!”", "web": "But Michael, the archangel, when contending with the devil and arguing about the body of Moses, dared not bring against him an abusive condemnation, but said, “May the Lord rebuke you!”", "lsg": "Or, l’archange Michel, lorsqu’il contestait avec le diable et lui disputait le corps de Moïse, n’osa pas porter contre lui un jugement injurieux, mais il dit: Que le Seigneur te réprime!", "lsgRef": "Jude 1:9"},
  "Judges 11:30-31": {"kjv": "And Jephthah vowed a vow unto the LORD, and said, If thou shalt without fail deliver the children of Ammon into mine hands, Then it shall be, that whatsoever cometh forth of the doors of my house to meet me, when I return in peace from the children of Ammon, shall surely be the LORD’s, and I will offer it up for a burnt offering.", "bsb": "Jephthah made this vow to the LORD: “If indeed You will deliver the Ammonites into my hand, then whatever comes out the door of my house to greet me on my triumphant return from the Ammonites will belong to the LORD, and I will offer it up as a burnt offering.”", "web": "Jephthah vowed a vow to the LORD, and said, “If you will indeed deliver the children of Ammon into my hand, then it shall be, that whatever comes out of the doors of my house to meet me when I return in peace from the children of Ammon, it shall be the LORD’s, and I will offer it up for a burnt offering.”", "lsg": "Jephthé fit un vœu à l’Éternel, et dit: Si tu livres entre mes mains les fils d’Ammon, quiconque sortira des portes de ma maison au-devant de moi, à mon heureux retour de chez les fils d’Ammon, sera consacré à l’Éternel, et je l’offrirai en holocauste.", "lsgRef": "Juges 11:30-31"},
  "Judges 16:17": {"kjv": "That he told her all his heart, and said unto her, There hath not come a razor upon mine head; for I have been a Nazarite unto God from my mother’s womb: if I be shaven, then my strength will go from me, and I shall become weak, and be like any other man.", "bsb": "Samson told her all that was in his heart: “My hair has never been cut, because I have been a Nazirite to God from my mother’s womb. If I am shaved, my strength will leave me, and I will become as weak as any other man.”", "web": "He told her all his heart and said to her, “No razor has ever come on my head; for I have been a Nazirite to God from my mother’s womb. If I am shaved, then my strength will go from me and I will become weak, and be like any other man.”", "lsg": "il lui ouvrit tout son cœur, et lui dit: Le rasoir n’a point passé sur ma tête, parce que je suis consacré à Dieu dès le ventre de ma mère. Si j’étais rasé, ma force m’abandonnerait, je deviendrais faible, et je serais comme tout autre homme.", "lsgRef": "Juges 16:17"},
  "Judges 16:4": {"kjv": "And it came to pass afterward, that he loved a woman in the valley of Sorek, whose name was Delilah.", "bsb": "Some time later, Samson fell in love with a woman in the Valley of Sorek, whose name was Delilah.", "web": "It came to pass afterward that he loved a woman in the valley of Sorek, whose name was Delilah.", "lsg": "Après cela, il aima une femme dans la vallée de Sorek. Elle se nommait Delila.", "lsgRef": "Juges 16:4"},
  "Judges 3:15": {"kjv": "But when the children of Israel cried unto the LORD, the LORD raised them up a deliverer, Ehud the son of Gera, a Benjamite, a man lefthanded: and by him the children of Israel sent a present unto Eglon the king of Moab.", "bsb": "And again they cried out to the LORD, and He raised up Ehud son of Gera, a left-handed Benjamite, as their deliverer. So they sent him with tribute to Eglon king of Moab.", "web": "But when the children of Israel cried to the LORD, the LORD raised up a savior for them: Ehud the son of Gera, the Benjamite, a left-handed man. The children of Israel sent tribute by him to Eglon the king of Moab.", "lsg": "Les enfants d’Israël crièrent à l’Éternel, et l’Éternel leur suscita un libérateur, Éhud, fils de Guéra, Benjamite, qui ne se servait pas de la main droite. Les enfants d’Israël envoyèrent par lui un présent à Églon, roi de Moab.", "lsgRef": "Juges 3:15"},
  "Judges 3:31": {"kjv": "And after him was Shamgar the son of Anath, which slew of the Philistines six hundred men with an ox goad: and he also delivered Israel.", "bsb": "After Ehud came Shamgar son of Anath. And he too saved Israel, striking down six hundred Philistines with an oxgoad.", "web": "After him was Shamgar the son of Anath, who struck six hundred men of the Philistines with an ox goad. He also saved Israel.", "lsg": "Après lui, il y eut Schamgar, fils d’Anath. Il battit six cents hommes des Philistins avec un aiguillon à bœufs. Et lui aussi fut un libérateur d’Israël.", "lsgRef": "Juges 3:31"},
  "Judges 4:21": {"kjv": "Then Jael Heber’s wife took a nail of the tent, and took an hammer in her hand, and went softly unto him, and smote the nail into his temples, and fastened it into the ground: for he was fast asleep and weary. So he died.", "bsb": "But as he lay sleeping from exhaustion, Heber’s wife Jael took a tent peg, grabbed a hammer, and went silently to Sisera. She drove the peg through his temple and into the ground, and he died.", "web": "Then Jael, Heber’s wife, took a tent peg, and took a hammer in her hand, and went softly to him, and struck the pin into his temples, and it pierced through into the ground, for he was in a deep sleep; so he fainted and died.", "lsg": "Jaël, femme de Héber, saisit un pieu de la tente, prit en main le marteau, s’approcha de lui doucement, et lui enfonça dans la tempe le pieu, qui pénétra en terre. Il était profondément endormi et accablé de fatigue; et il mourut.", "lsgRef": "Juges 4:21"},
  "Judges 4:4-5": {"kjv": "And Deborah, a prophetess, the wife of Lapidoth, she judged Israel at that time. And she dwelt under the palm tree of Deborah between Ramah and Beth–el in mount Ephraim: and the children of Israel came up to her for judgment.", "bsb": "Now Deborah, a prophetess, the wife of Lappidoth, was judging Israel at that time. And she would sit under the Palm of Deborah between Ramah and Bethel in the hill country of Ephraim, where the Israelites would go up to her for judgment.", "web": "Now Deborah, a prophetess, the wife of Lappidoth, judged Israel at that time. She lived under Deborah’s palm tree between Ramah and Bethel in the hill country of Ephraim; and the children of Israel came up to her for judgment.", "lsg": "Dans ce temps-là, Débora, prophétesse, femme de Lappidoth, était juge en Israël. Elle siégeait sous le palmier de Débora, entre Rama et Béthel, dans la montagne d’Éphraïm; et les enfants d’Israël montaient vers elle pour être jugés.", "lsgRef": "Juges 4:4-5"},
  "Judges 7:7": {"kjv": "And the LORD said unto Gideon, By the three hundred men that lapped will I save you, and deliver the Midianites into thine hand: and let all the other people go every man unto his place.", "bsb": "Then the LORD said to Gideon, “With the three hundred men who lapped the water I will save you and deliver the Midianites into your hand. But all the others are to go home.”", "web": "The LORD said to Gideon, “I will save you by the three hundred men who lapped, and deliver the Midianites into your hand. Let all the other people go, each to his own place.”", "lsg": "Et l’Éternel dit à Gédéon: C’est par les trois cents hommes qui ont lapé, que je vous sauverai et que je livrerai Madian entre tes mains. Que tout le reste du peuple s’en aille chacun chez soi.", "lsgRef": "Juges 7:7"},
  "Leviticus 10:1-2": {"kjv": "And Nadab and Abihu, the sons of Aaron, took either of them his censer, and put fire therein, and put incense thereon, and offered strange fire before the LORD, which he commanded them not. And there went out fire from the LORD, and devoured them, and they died before the LORD.", "bsb": "Now Aaron’s sons Nadab and Abihu took their censers, put fire in them and added incense, and offered unauthorized fire before the LORD, contrary to His command. So fire came out from the presence of the LORD and consumed them, and they died in the presence of the LORD.", "web": "Nadab and Abihu, the sons of Aaron, each took his censer, and put fire in it, and laid incense on it, and offered strange fire before the LORD, which he had not commanded them. Fire came out from before the LORD, and devoured them, and they died before the LORD.", "lsg": "Les fils d’Aaron, Nadab et Abihu, prirent chacun un brasier, y mirent du feu, et posèrent du parfum dessus; ils apportèrent devant l’Éternel du feu étranger, ce qu’il ne leur avait point ordonné. Alors le feu sortit de devant l’Éternel, et les consuma: ils moururent devant l’Éternel.", "lsgRef": "Lévitique 10:1-2"},
  "Luke 10:33-34": {"kjv": "But a certain Samaritan, as he journeyed, came where he was: and when he saw him, he had compassion on him, And went to him, and bound up his wounds, pouring in oil and wine, and set him on his own beast, and brought him to an inn, and took care of him.", "bsb": "But when a Samaritan on a journey came upon him, he looked at him and had compassion. He went to him and bandaged his wounds, pouring on oil and wine. Then he put him on his own animal, brought him to an inn, and took care of him.", "web": "But a certain Samaritan, as he traveled, came where he was. When he saw him, he was moved with compassion, came to him, and bound up his wounds, pouring on oil and wine. He set him on his own animal, brought him to an inn, and took care of him.", "lsg": "Mais un Samaritain, qui voyageait, étant venu là, fut ému de compassion lorsqu’il le vit. Il s’approcha, et banda ses plaies, en y versant de l’huile et du vin; puis il le mit sur sa propre monture, le conduisit à une hôtellerie, et prit soin de lui.", "lsgRef": "Luc 10:33-34"},
  "Luke 15:16": {"kjv": "And he would fain have filled his belly with the husks that the swine did eat: and no man gave unto him.", "bsb": "He longed to fill his belly with the pods the pigs were eating, but no one would give him a thing.", "web": "He wanted to fill his belly with the pods that the pigs ate, but no one gave him any.", "lsg": "Il aurait bien voulu se rassasier des carouges que mangeaient les pourceaux, mais personne ne lui en donnait.", "lsgRef": "Luc 15:16"},
  "Luke 18:13": {"kjv": "And the publican, standing afar off, would not lift up so much as his eyes unto heaven, but smote upon his breast, saying, God be merciful to me a sinner.", "bsb": "But the tax collector stood at a distance, unwilling even to lift up his eyes to heaven. Instead, he beat his breast and said, ‘God, have mercy on me, a sinner!’", "web": "But the tax collector, standing far away, wouldn’t even lift up his eyes to heaven, but beat his chest, saying, ‘God, be merciful to me, a sinner!’", "lsg": "Le publicain, se tenant à distance, n’osait même pas lever les yeux au ciel; mais il se frappait la poitrine, en disant: O Dieu, sois apaisé envers moi, qui suis un pécheur.", "lsgRef": "Luc 18:13"},
  "Luke 19:4-5": {"kjv": "And he ran before, and climbed up into a sycomore tree to see him: for he was to pass that way. And when Jesus came to the place, he looked up, and saw him, and said unto him, Zaccheus, make haste, and come down; for to day I must abide at thy house.", "bsb": "So he ran on ahead and climbed a sycamore tree to see Him, since Jesus was about to pass that way. When Jesus came to that place, He looked up and said, “Zacchaeus, hurry down, for I must stay at your house today.”", "web": "He ran on ahead and climbed up into a sycamore tree to see him, for he was going to pass that way. When Jesus came to the place, he looked up and saw him, and said to him, “Zacchaeus, hurry and come down, for today I must stay at your house.”", "lsg": "Il courut en avant, et monta sur un sycomore pour le voir, parce qu’il devait passer par là. Lorsque Jésus fut arrivé à cet endroit, il leva les yeux et lui dit: Zachée, hâte-toi de descendre; car il faut que je demeure aujourd’hui dans ta maison.", "lsgRef": "Luc 19:4-5"},
  "Luke 1:13": {"kjv": "But the angel said unto him, Fear not, Zacharias: for thy prayer is heard; and thy wife Elisabeth shall bear thee a son, and thou shalt call his name John.", "bsb": "But the angel said to him, “Do not be afraid, Zechariah, because your prayer has been heard. Your wife Elizabeth will bear you a son, and you are to give him the name John.", "web": "But the angel said to him, “Don’t be afraid, Zacharias, because your request has been heard. Your wife, Elizabeth, will bear you a son, and you shall call his name John.", "lsg": "Mais l’ange lui dit: Ne crains point, Zacharie; car ta prière a été exaucée. Ta femme Élisabeth t’enfantera un fils, et tu lui donneras le nom de Jean.", "lsgRef": "Luc 1:13"},
  "Luke 1:19": {"kjv": "And the angel answering said unto him, I am Gabriel, that stand in the presence of God; and am sent to speak unto thee, and to shew thee these glad tidings.", "bsb": "“I am Gabriel,” replied the angel. “I stand in the presence of God, and I have been sent to speak to you and to bring you this good news.", "web": "The angel answered him, “I am Gabriel, who stands in the presence of God. I was sent to speak to you and to bring you this good news.", "lsg": "L’ange lui répondit: Je suis Gabriel, je me tiens devant Dieu; j’ai été envoyé pour te parler, et pour t’annoncer cette bonne nouvelle.", "lsgRef": "Luc 1:19"},
  "Luke 1:30-31": {"kjv": "And the angel said unto her, Fear not, Mary: for thou hast found favour with God. And, behold, thou shalt conceive in thy womb, and bring forth a son, and shalt call his name JESUS.", "bsb": "So the angel told her, “Do not be afraid, Mary, for you have found favor with God. Behold, you will conceive and give birth to a son, and you are to give Him the name Jesus.", "web": "The angel said to her, “Don’t be afraid, Mary, for you have found favor with God. Behold, you will conceive in your womb and give birth to a son, and shall name him ‘Jesus.’", "lsg": "L’ange lui dit: Ne crains point, Marie; car tu as trouvé grâce devant Dieu. Et voici, tu deviendras enceinte, et tu enfanteras un fils, et tu lui donneras le nom de Jésus.", "lsgRef": "Luc 1:30-31"},
  "Luke 1:38": {"kjv": "And Mary said, Behold the handmaid of the Lord; be it unto me according to thy word. And the angel departed from her.", "bsb": "“I am the Lord’s servant,” Mary answered. “May it happen to me according to your word.” Then the angel left her.", "web": "Mary said, “Behold, the servant of the Lord; let it be done to me according to your word.” Then the angel departed from her.", "lsg": "Marie dit: Je suis la servante du Seigneur; qu’il me soit fait selon ta parole! Et l’ange la quitta.", "lsgRef": "Luc 1:38"},
  "Luke 22:61": {"kjv": "And the Lord turned, and looked upon Peter. And Peter remembered the word of the Lord, how he had said unto him, Before the cock crow, thou shalt deny me thrice.", "bsb": "And the Lord turned and looked at Peter. Then Peter remembered the word that the Lord had spoken to him: “Before the rooster crows today, you will deny Me three times.”", "web": "The Lord turned and looked at Peter. Then Peter remembered the Lord’s word, how he said to him, “Before the rooster crows you will deny me three times.”", "lsg": "Le Seigneur, s’étant retourné, regarda Pierre. Et Pierre se souvint de la parole que le Seigneur lui avait dite: Avant que le coq chante aujourd’hui, tu me renieras trois fois.", "lsgRef": "Luc 22:61"},
  "Luke 23:42": {"kjv": "And he said unto Jesus, Lord, remember me when thou comest into thy kingdom.", "bsb": "Then he said, “Jesus, remember me when You come into Your kingdom!”", "web": "He said to Jesus, “Lord, remember me when you come into your Kingdom.”", "lsg": "Et il dit à Jésus: Souviens-toi de moi, quand tu viendras dans ton règne.", "lsgRef": "Luc 23:42"},
  "Luke 24:13": {"kjv": "And, behold, two of them went that same day to a village called Emmaus, which was from Jerusalem about threescore furlongs.", "bsb": "That same day two of them were going to a village called Emmaus, about seven miles from Jerusalem.", "web": "Behold, two of them were going that very day to a village named Emmaus, which was sixty stadia from Jerusalem.", "lsg": "Et voici, ce même jour, deux disciples allaient à un village nommé Émmaüs, éloigné de Jérusalem de soixante stades;", "lsgRef": "Luc 24:13"},
  "Luke 24:46": {"kjv": "And said unto them, Thus it is written, and thus it behoved Christ to suffer, and to rise from the dead the third day:", "bsb": "And He told them, “This is what is written: The Christ will suffer and rise from the dead on the third day,", "web": "He said to them, “Thus it is written, and thus it was necessary for the Christ to suffer and to rise from the dead the third day,", "lsg": "Et il leur dit: Ainsi il est écrit que le Christ souffrirait, et qu’il ressusciterait des morts le troisième jour,", "lsgRef": "Luc 24:46"},
  "Luke 2:10": {"kjv": "And the angel said unto them, Fear not: for, behold, I bring you good tidings of great joy, which shall be to all people.", "bsb": "But the angel said to them, “Do not be afraid! For behold, I bring you good news of great joy that will be for all the people:", "web": "The angel said to them, “Don’t be afraid, for behold, I bring you good news of great joy which will be to all the people.", "lsg": "Mais l’ange leur dit: Ne craignez point; car je vous annonce une bonne nouvelle, qui sera pour tout le peuple le sujet d’une grande joie:", "lsgRef": "Luc 2:10"},
  "Luke 2:25": {"kjv": "And, behold, there was a man in Jerusalem, whose name was Simeon; and the same man was just and devout, waiting for the consolation of Israel: and the Holy Ghost was upon him.", "bsb": "Now there was a man in Jerusalem named Simeon, who was righteous and devout. He was waiting for the consolation of Israel, and the Holy Spirit was upon him.", "web": "Behold, there was a man in Jerusalem whose name was Simeon. This man was righteous and devout, looking for the consolation of Israel, and the Holy Spirit was on him.", "lsg": "Et voici, il y avait à Jérusalem un homme appelé Siméon. Cet homme était juste et pieux, il attendait la consolation d’Israël, et l’Esprit-Saint était sur lui.", "lsgRef": "Luc 2:25"},
  "Luke 2:29": {"kjv": "Lord, now lettest thou thy servant depart in peace, according to thy word:", "bsb": "“Sovereign Lord, as You have promised, You now dismiss Your servant in peace.", "web": "“Now you are releasing your servant, Master, according to your word, in peace;", "lsg": "Maintenant, Seigneur, tu laisses ton serviteur S’en aller en paix, selon ta parole.", "lsgRef": "Luc 2:29"},
  "Luke 2:36": {"kjv": "And there was one Anna, a prophetess, the daughter of Phanuel, of the tribe of Aser: she was of a great age, and had lived with an husband seven years from her virginity;", "bsb": "There was also a prophetess named Anna, the daughter of Phanuel, of the tribe of Asher, who was well along in years. She had been married for seven years,", "web": "There was one Anna, a prophetess, the daughter of Phanuel, of the tribe of Asher (she was of a great age, having lived with a husband seven years from her virginity,", "lsg": "Il y avait aussi une prophétesse, Anne, fille de Phanuel, de la tribu d’Aser. Elle était fort avancée en âge, et elle avait vécu sept ans avec son mari depuis sa virginité.", "lsgRef": "Luc 2:36"},
  "Luke 2:7": {"kjv": "And she brought forth her firstborn son, and wrapped him in swaddling clothes, and laid him in a manger; because there was no room for them in the inn.", "bsb": "And she gave birth to her firstborn, a Son. She wrapped Him in swaddling cloths and laid Him in a manger, because there was no room for them in the inn.", "web": "She gave birth to her firstborn son. She wrapped him in bands of cloth and laid him in a feeding trough, because there was no room for them in the inn.", "lsg": "et elle enfanta son fils premier-né. Elle l’emmaillota, et le coucha dans une crèche, parce qu’il n’y avait pas de place pour eux dans l’hôtellerie.", "lsgRef": "Luc 2:7"},
