<title>Lamp Bible Companion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;1,7..72,400&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: a single phone column, lamplit verse at the top of each screen, fixed tab bar at the bottom */
:root {
  --bg: #e9edf3;          /* cool evening stone */
  --surface: #f7f8fb;
  --ink: #1a2034;         /* scripture ink */
  --muted: #5d6680;
  --line: #d3d9e4;
  --gold: #a8741c;        /* lamp flame */
  --gold-soft: rgba(214, 160, 60, 0.22);
  --blue: #2c4580;        /* night sky */
  --good: #2f7a4f;
  --bad: #b2453a;
  --hl-y: rgba(247, 205, 70, 0.45);   /* highlighter colors */
  --hl-g: rgba(110, 196, 130, 0.36);
  --hl-b: rgba(110, 160, 240, 0.34);
  --hl-p: rgba(238, 130, 175, 0.34);
  --font-verse: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --font-ui: "Figtree", "Segoe UI", system-ui, sans-serif;
  --font-read: var(--font-verse);   /* Bible text; Settings can switch it to a book or modern face */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1220; --surface: #171c2e; --ink: #e8e9f0; --muted: #9aa1b8; --line: #2a3149;
    --gold: #e3b45a; --gold-soft: rgba(227, 180, 90, 0.16); --blue: #9fb4ea; --good: #6cc495; --bad: #ec8a7f;
    --hl-y: rgba(240, 200, 80, 0.3); --hl-g: rgba(110, 200, 140, 0.26); --hl-b: rgba(120, 165, 245, 0.28); --hl-p: rgba(240, 140, 185, 0.26);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1220; --surface: #171c2e; --ink: #e8e9f0; --muted: #9aa1b8; --line: #2a3149;
  --gold: #e3b45a; --gold-soft: rgba(227, 180, 90, 0.16); --blue: #9fb4ea; --good: #6cc495; --bad: #ec8a7f;
  --hl-y: rgba(240, 200, 80, 0.3); --hl-g: rgba(110, 200, 140, 0.26); --hl-b: rgba(120, 165, 245, 0.28); --hl-p: rgba(240, 140, 185, 0.26);
  color-scheme: dark;
}
/* Lamp's own "Reading look" setting wins over the device theme. */
:root[data-look="light"] {
  --bg: #e9edf3; --surface: #f7f8fb; --ink: #1a2034; --muted: #5d6680; --line: #d3d9e4;
  --gold: #a8741c; --gold-soft: rgba(214, 160, 60, 0.22); --blue: #2c4580; --good: #2f7a4f; --bad: #b2453a;
  --hl-y: rgba(247, 205, 70, 0.45); --hl-g: rgba(110, 196, 130, 0.36); --hl-b: rgba(110, 160, 240, 0.34); --hl-p: rgba(238, 130, 175, 0.34);
  color-scheme: light;
}
:root[data-look="sepia"] {
  --bg: #efe5cf; --surface: #f8f0de; --ink: #3a2d1e; --muted: #6e5d46; --line: #dccdae;
  --gold: #96630f; --gold-soft: rgba(176, 124, 40, 0.18); --blue: #46587e; --good: #3f6e43; --bad: #a3422d;
  --hl-y: rgba(240, 196, 60, 0.42); --hl-g: rgba(120, 180, 110, 0.34); --hl-b: rgba(110, 150, 220, 0.3); --hl-p: rgba(230, 125, 160, 0.3);
  color-scheme: light;
}
:root[data-look="dark"] {
  --bg: #0e1220; --surface: #171c2e; --ink: #e8e9f0; --muted: #9aa1b8; --line: #2a3149;
  --gold: #e3b45a; --gold-soft: rgba(227, 180, 90, 0.16); --blue: #9fb4ea; --good: #6cc495; --bad: #ec8a7f;
  --hl-y: rgba(240, 200, 80, 0.3); --hl-g: rgba(110, 200, 140, 0.26); --hl-b: rgba(120, 165, 245, 0.28); --hl-p: rgba(240, 140, 185, 0.26);
  color-scheme: dark;
}
/* Other reading fonts are scaled to Cormorant's small letters so text keeps the same size. */
:root[data-font="book"] { --font-read: "Literata", Georgia, serif; --read-adjust: 0.4; }
:root[data-font="modern"] { --font-read: var(--font-ui); --read-adjust: 0.4; }
/* Kids mode: everything a size larger */
:root[data-kids] { font-size: 112.5%; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 16px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
main {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px calc(96px + env(safe-area-inset-bottom, 0px));
}
h1, h2 { font-family: var(--font-verse); font-weight: 600; text-wrap: balance; margin: 0; line-height: 1.15; }
h1 { font-size: 2.1rem; }
h2 { font-size: 1.5rem; }
.eyebrow { font-size: .72rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
.muted { color: var(--muted); }
/* Screens and the blocks inside them (like the Bible's top and body) stack with the same spacing. */
.screen { display: flex; flex-direction: column; gap: 18px; }
header.top { display: flex; flex-direction: column; gap: 4px; }

/* Verse card: the one lamplit object on each screen */
.verse {
  position: relative; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 26px 22px 18px; display: flex; flex-direction: column; gap: 14px;
}
.verse.lit::before {
  content: ""; position: absolute; inset: -40% -20% auto auto; width: 280px; height: 280px;
  background: radial-gradient(circle, var(--gold-soft), transparent 65%);
  pointer-events: none; animation: flicker 6s ease-in-out infinite;
}
@keyframes flicker { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .75; transform: scale(1.06); } }
.verse blockquote {
  position: relative; margin: 0; font-family: var(--font-read); font-size-adjust: var(--read-adjust, none); font-style: italic; font-weight: 500;
  font-size: 1.45rem; line-height: 1.35;
}
.verse.small blockquote { font-size: 1.22rem; }
.verse .ref { position: relative; font-weight: 600; font-size: .9rem; color: var(--blue); }
.actions { position: relative; display: flex; gap: 8px; flex-wrap: wrap; }

button { font: inherit; cursor: pointer; }
.btn {
  border: 1px solid var(--line); background: transparent; color: var(--ink);
  border-radius: 999px; padding: 7px 14px; font-size: .85rem; font-weight: 600;
}
.btn:hover { border-color: var(--gold); }
.btn.on { background: var(--gold-soft); border-color: var(--gold); color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); padding: 11px 20px; font-size: .95rem; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* Find */
form.ask { display: flex; flex-direction: column; gap: 10px; }
textarea {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-height: 92px; resize: vertical; width: 100%;
}
textarea:focus { outline: none; border-color: var(--gold); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.results { display: flex; flex-direction: column; gap: 12px; }
.note { font-size: .92rem; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); }
.note.care { border-color: var(--bad); }

/* Quiz */
.progress { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--gold); transition: width .3s; }
.qmeta { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.question { font-family: var(--font-verse); font-size: 1.55rem; font-weight: 600; line-height: 1.25; text-wrap: balance; }
.options { display: flex; flex-direction: column; gap: 10px; }
.opt {
  text-align: left; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; font-size: 1rem; font-weight: 500;
}
.opt:hover:not(:disabled) { border-color: var(--gold); }
.opt:disabled { cursor: default; }
.opt.right { border-color: var(--good); box-shadow: inset 4px 0 0 var(--good); }
.opt.wrong { border-color: var(--bad); box-shadow: inset 4px 0 0 var(--bad); }
.feedback { font-size: .92rem; display: flex; flex-direction: column; gap: 12px; }
.feedback:empty { display: none; }
.levels { display: flex; flex-direction: column; gap: 10px; }
.level {
  display: grid; gap: 2px; text-align: left; width: 100%; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
}
.level:hover { border-color: var(--gold); }
.lv-name { font-family: var(--font-verse); font-size: 1.45rem; font-weight: 600; line-height: 1.2; }
.lv-desc { color: var(--muted); font-size: .92rem; }
.lv-meta { color: var(--gold); font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-top: 4px; font-variant-numeric: tabular-nums; }
.lv-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
/* Timed mode: a fuse that burns down from full to empty */
.timer { display: flex; align-items: center; gap: 8px; color: var(--gold); }
.timer .ic svg { width: 18px; height: 18px; fill: currentColor; stroke: none; }
.fuse { flex: 1; height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; }
.fuse i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, var(--bad), var(--gold)); animation: burn linear forwards; }
@keyframes burn { to { width: 0; } }
/* "Who said it?": the quotation, with a large opening mark */
.quote { margin: 0; font-family: var(--font-read); font-size-adjust: var(--read-adjust, none); font-style: italic; font-size: 1.4rem; line-height: 1.4; }
.quote::before { content: "“"; color: var(--gold); font-size: 2.6rem; line-height: 0; vertical-align: -.45em; margin-right: 4px; }
.quote cite { font-family: var(--font-ui); font-style: normal; font-size: .75rem; font-weight: 700; color: var(--muted); }
/* Difficulty shown as lamp flames: lit ones in gold, the rest faint */
.pips { display: flex; gap: 2px; color: var(--gold); }
.pips svg { width: 18px; height: 18px; fill: currentColor; }
.pips .off { opacity: .2; }

/* Small line icons, drawn with the text color */
.ic svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* Lamp's name above the Today greeting */
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-verse); font-size: 1.3rem; font-weight: 600; color: var(--ink); }
.brand .gear.ic {
  margin-left: auto; width: 40px; height: 40px; border-radius: 50%; padding: 0;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
}
.brand .gear.ic:hover { border-color: var(--gold); }
.brand .ic { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: var(--gold-soft); color: var(--gold); }

/* Shortcut tiles on Today */
#today-plans:empty, #today-stories:empty { display: none; }
/* Bible stories (kids mode) */
.stories { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.story {
  display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: start; text-align: left; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; color: var(--ink);
}
.story:hover { border-color: var(--gold); }
.story .num {
  grid-row: span 2; display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%;
  background: var(--gold-soft); color: var(--gold); font-weight: 700; font-size: .85rem; font-variant-numeric: tabular-nums;
}
.story.read .num { background: var(--good); color: var(--surface); }
.story b { font-size: .95rem; line-height: 1.25; }
.story small { color: var(--muted); font-size: .8rem; }
/* Study page: cross-references and dictionary */
.dicts { display: flex; flex-direction: column; gap: 8px; }
.dicts details p { margin: 8px 0 0; font-size: .95rem; line-height: 1.55; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile {
  display: flex; flex-direction: column; align-items: flex-start; gap: 10px; text-align: left; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; color: var(--ink);
}
.tile:hover { border-color: var(--gold); }
.tile .ic { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--gold-soft); color: var(--gold); }
.tile span:last-child { display: grid; gap: 2px; min-width: 0; }
.tile b { font-size: .98rem; line-height: 1.25; }
.tile small { color: var(--muted); font-size: .82rem; line-height: 1.3; overflow-wrap: anywhere; }
.tile.wide { grid-column: 1 / -1; flex-direction: row; align-items: center; }
/* Badges: earned ones glow gold, the rest wait in grey */
.badges { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.badge {
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px;
  padding: 16px 12px; border-radius: 16px; border: 1px dashed var(--line); color: var(--muted);
}
.badge .ic { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: var(--line); }
.badge .ic svg { width: 26px; height: 26px; }
.badge b { font-size: .95rem; line-height: 1.25; color: var(--ink); opacity: .55; }
.badge small { font-size: .8rem; line-height: 1.3; }
.badge.on { border-style: solid; background: var(--surface); }
.badge.on .ic { background: radial-gradient(circle, var(--gold-soft) 35%, transparent 75%), var(--gold-soft); color: var(--gold); }
.badge.on b { opacity: 1; }
.badge .when { color: var(--gold); font-weight: 700; font-size: .7rem; letter-spacing: .06em; text-transform: uppercase; }

/* Empty states: a lamplit icon, a line of text and the next step */
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding-block: 28px 8px; }
.empty .glow {
  display: grid; place-items: center; width: 84px; height: 84px; border-radius: 50%; color: var(--gold);
  background: radial-gradient(circle, var(--gold-soft) 0%, transparent 70%);
}
.empty .glow svg { width: 40px; height: 40px; stroke-width: 1.4; }
.empty h2 { font-size: 1.45rem; }
.empty p { margin: 0; color: var(--muted); max-width: 32ch; }
.starters { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

/* "Did you know?" card on the quiz screen */
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.fact .head { display: flex; align-items: center; gap: 8px; }
.fact .head .ic { color: var(--gold); display: grid; }
.fact p { margin: 0; font-family: var(--font-verse); font-size: 1.2rem; line-height: 1.4; }

/* Memorize */
.memo-verse { margin: 0; font-family: var(--font-read); font-size-adjust: var(--read-adjust, none); font-size: 1.12rem; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.steps { display: flex; gap: 6px; align-items: center; }
.steps i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.steps i.on { background: var(--gold); }
.memo-text { font-family: var(--font-read); font-size-adjust: var(--read-adjust, none); font-size: calc(1.4rem * var(--scale, 1)); line-height: 2; }
.blank {
  display: inline-block; min-width: calc(var(--n) * .52em + .6em); padding-inline: 2px; text-align: center;
  border-bottom: 2px solid var(--muted); border-radius: 3px 3px 0 0; line-height: 1.3; vertical-align: baseline;
}
.blank.next { border-color: var(--gold); background: var(--gold-soft); }
.blank.done { border-color: var(--good); color: var(--good); }
.blank.shown { border-color: var(--bad); color: var(--bad); }
.bank { display: flex; flex-wrap: wrap; gap: 8px; }
.word {
  font: inherit; font-weight: 600; background: var(--surface); color: var(--ink);
  border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
}
.word:hover { border-color: var(--gold); }
.word.bad { border-color: var(--bad); color: var(--bad); animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@media (prefers-reduced-motion: reduce) { .word.bad { animation: none; } }
.score { font-family: var(--font-verse); font-size: 4rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }

/* Bible reader */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.search {
  flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px;
}
.search:focus { outline: none; border-color: var(--gold); }
.testament { display: flex; flex-direction: column; gap: 12px; margin-top: 6px; }
.books { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.book {
  text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 13px 14px; color: var(--ink); font-weight: 600; font-size: .95rem;
  display: flex; justify-content: space-between; align-items: baseline; gap: 6px;
}
.book:hover, .chapters button:hover, .hit:hover { border-color: var(--gold); }
.book small { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.chapters { display: grid; grid-template-columns: repeat(auto-fill, minmax(56px, 1fr)); gap: 10px; }
.chapters button {
  aspect-ratio: 1; max-width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums;
}
.chapters button.here { border-color: var(--gold); background: var(--gold-soft); }
.reader-head {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; background: var(--bg);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding-block: 12px; margin-top: -12px; border-bottom: 1px solid var(--line);
}
.reader-head h2 { font-size: 1.35rem; white-space: nowrap; }
.chapter-text { font-family: var(--font-read); font-size-adjust: var(--read-adjust, none); font-size: calc(1.28rem * var(--scale, 1)); line-height: 1.55; }
/* Each verse starts on its own line, with a little air between verses. */
.chapter-text:not(.parallel) .v { display: block; padding: 3px 6px; margin: 0 -6px .65em; }
.chapter-text .v { border-radius: 5px; cursor: pointer; transition: background .4s; }
.chapter-text .v sup { font-family: var(--font-ui); font-size: .58em; font-weight: 700; color: var(--gold); margin-right: 3px; }
.chapter-text .v.sel { background: var(--gold-soft); box-shadow: 0 2px 0 var(--gold); }
.chapter-text .v.flash { background: var(--gold-soft); }
.chapter-text .v { -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.hl-y { background: var(--hl-y); } .hl-g { background: var(--hl-g); } .hl-b { background: var(--hl-b); } .hl-p { background: var(--hl-p); }
.nmark { font-family: var(--font-ui); font-size: .6em; color: var(--gold); margin-right: 3px; vertical-align: super; }

/* Side-by-side reading: stacked pairs on a phone, two columns on a wide screen */
main.wide { max-width: 980px; }
.compare { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: .88rem; font-weight: 600; }
.parallel { display: flex; flex-direction: column; gap: 14px; font-size: calc(1.2rem * var(--scale, 1)); line-height: 1.55; }
.pair { display: grid; gap: 6px; }
.pair .v { display: block; margin: 0; padding: 2px 4px; }
.pair .alt { color: var(--muted); border-left: 2px solid var(--blue); padding-left: 10px; font-size: .94em; }
.chapter-text .pair .alt sup { color: var(--blue); }
.pair .v:empty { border: 0; padding: 0; }
.selbar .in strong small { display: block; font-size: .72rem; color: var(--muted); letter-spacing: .04em; }
.legend { display: flex; gap: 8px 16px; flex-wrap: wrap; font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.legend .a { color: var(--gold); }
.legend .b { color: var(--blue); }
@media (min-width: 700px) {
  .pair { grid-template-columns: 1fr 1fr; gap: 28px; }
  .pair .alt { border-left: 0; padding-left: 4px; font-size: 1em; color: var(--ink); }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
}
.pager { display: flex; justify-content: space-between; gap: 8px; }
.hits { display: flex; flex-direction: column; gap: 8px; }
.hit {
  display: flex; flex-direction: column; gap: 2px; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; color: var(--ink);
}
.hit b { font-size: .85rem; color: var(--blue); }
.hit span { font-family: var(--font-read); font-size-adjust: var(--read-adjust, none); font-size: 1.1rem; line-height: 1.4; }
mark { background: var(--gold-soft); color: inherit; border-radius: 3px; box-shadow: 0 1px 0 var(--gold); }
.selbar {
  position: fixed; left: 0; right: 0; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); z-index: 5;
  display: flex; justify-content: center;

const VERSE_TEXT = {
  "Philippians 4:6-7": {"bsb": "Be anxious for nothing, but in everything, by prayer and petition, with thanksgiving, present your requests to God. And the peace of God, which surpasses all understanding, will guard your hearts and your minds in Christ Jesus.", "web": "In nothing be anxious, but in everything, by prayer and petition with thanksgiving, let your requests be made known to God. And the peace of God, which surpasses all understanding, will guard your hearts and your thoughts in Christ Jesus.", "lsg": "Ne vous inquiétez de rien; mais en toute chose faites connaître vos besoins à Dieu par des prières et des supplications, avec des actions de grâces. Et la paix de Dieu, qui surpasse toute intelligence, gardera vos cœurs et vos pensées en Jésus-Christ.", "lsgRef": "Philippiens 4:6-7"},
  "1 Peter 5:7": {"bsb": "Cast all your anxiety on Him, because He cares for you.", "web": "casting all your worries on him, because he cares for you.", "lsg": "et déchargez-vous sur lui de tous vos soucis, car lui-même prend soin de vous.", "lsgRef": "1 Pierre 5:7"},
  "Matthew 6:34": {"bsb": "Therefore do not worry about tomorrow, for tomorrow will worry about itself. Today has enough trouble of its own.", "web": "Therefore don’t be anxious for tomorrow, for tomorrow will be anxious for itself. Each day’s own evil is sufficient.", "lsg": "Ne vous inquiétez donc pas du lendemain; car le lendemain aura soin de lui-même. A chaque jour suffit sa peine.", "lsgRef": "Matthieu 6:34"},
  "John 14:27": {"bsb": "Peace I leave with you; My peace I give to you. I do not give to you as the world gives. Do not let your hearts be troubled; do not be afraid.", "web": "Peace I leave with you. My peace I give to you; not as the world gives, I give to you. Don’t let your heart be troubled, neither let it be fearful.", "lsg": "Je vous laisse la paix, je vous donne ma paix. Je ne vous donne pas comme le monde donne. Que votre cœur ne se trouble point, et ne s’alarme point.", "lsgRef": "Jean 14:27"},
  "Psalm 46:10": {"bsb": "“Be still and know that I am God; I will be exalted among the nations, I will be exalted over the earth.”", "web": "“Be still, and know that I am God. I will be exalted among the nations. I will be exalted on the earth.”", "lsg": "Arrêtez, et sachez que je suis Dieu: Je domine sur les nations, je domine sur la terre.", "lsgRef": "Psaume 46:11"},
  "Isaiah 41:10": {"bsb": "Do not fear, for I am with you; do not be afraid, for I am your God. I will strengthen you; I will surely help you; I will uphold you with My right hand of righteousness.", "web": "Don’t you be afraid, for I am with you. Don’t be dismayed, for I am your God. I will strengthen you. Yes, I will help you. Yes, I will uphold you with the right hand of my righteousness.", "lsg": "Ne crains rien, car je suis avec toi; Ne promène pas des regards inquiets, car je suis ton Dieu; Je te fortifie, je viens à ton secours, Je te soutiens de ma droite triomphante.", "lsgRef": "Ésaïe 41:10"},
  "Joshua 1:9": {"bsb": "Have I not commanded you to be strong and courageous? Do not be afraid; do not be discouraged, for the LORD your God is with you wherever you go.”", "web": "Haven’t I commanded you? Be strong and courageous. Don’t be afraid. Don’t be dismayed, for the LORD your God is with you wherever you go.”", "lsg": "Ne t’ai-je pas donné cet ordre: Fortifie-toi et prends courage? Ne t’effraie point et ne t’épouvante point, car l’Éternel, ton Dieu, est avec toi dans tout ce que tu entreprendras.", "lsgRef": "Josué 1:9"},
  "Psalm 56:3": {"bsb": "When I am afraid, I put my trust in You.", "web": "When I am afraid, I will put my trust in you.", "lsg": "Quand je suis dans la crainte, En toi je me confie.", "lsgRef": "Psaume 56:4"},
  "2 Timothy 1:7": {"bsb": "For God has not given us a spirit of fear, but of power, love, and self-control.", "web": "For God didn’t give us a spirit of fear, but of power, love, and self-control.", "lsg": "Car ce n’est pas un esprit de timidité que Dieu nous a donné, mais un esprit de force, d’amour et de sagesse.", "lsgRef": "2 Timothée 1:7"},
  "Psalm 23:4": {"bsb": "Even though I walk through the valley of the shadow of death, I will fear no evil, for You are with me; Your rod and Your staff, they comfort me.", "web": "Even though I walk through the valley of the shadow of death, I will fear no evil, for you are with me. Your rod and your staff, they comfort me.", "lsg": "Quand je marche dans la vallée de l’ombre de la mort, Je ne crains aucun mal, car tu es avec moi: Ta houlette et ton bâton me rassurent.", "lsgRef": "Psaume 23:4"},
  "Psalm 34:18": {"bsb": "The LORD is near to the brokenhearted; He saves the contrite in spirit.", "web": "The LORD is near to those who have a broken heart, and saves those who have a crushed spirit.", "lsg": "L’Éternel est près de ceux qui ont le cœur brisé, Et il sauve ceux qui ont l’esprit dans l’abattement.", "lsgRef": "Psaume 34:19"},
  "Matthew 5:4": {"bsb": "Blessed are those who mourn, for they will be comforted.", "web": "Blessed are those who mourn, for they shall be comforted.", "lsg": "Heureux les affligés, car ils seront consolés!", "lsgRef": "Matthieu 5:4"},
  "Revelation 21:4": {"bsb": "‘He will wipe away every tear from their eyes,’ and there will be no more death or mourning or crying or pain, for the former things have passed away.”", "web": "He will wipe away every tear from their eyes. Death will be no more; neither will there be mourning, nor crying, nor pain any more. The first things have passed away.”", "lsg": "Il essuiera toute larme de leurs yeux, et la mort ne sera plus, et il n’y aura plus ni deuil, ni cri, ni douleur, car les premières choses ont disparu.", "lsgRef": "Apocalypse 21:4"},
  "Psalm 30:5": {"bsb": "For His anger is fleeting, but His favor lasts a lifetime. Weeping may stay the night, but joy comes in the morning.", "web": "For his anger is but for a moment. His favor is for a lifetime. Weeping may stay for the night, but joy comes in the morning.", "lsg": "Car sa colère dure un instant, Mais sa grâce toute la vie; Le soir arrivent les pleurs, Et le matin l’allégresse.", "lsgRef": "Psaume 30:6"},
  "Psalm 147:3": {"bsb": "He heals the brokenhearted and binds up their wounds.", "web": "He heals the broken in heart, and binds up their wounds.", "lsg": "Il guérit ceux qui ont le cœur brisé, Et il panse leurs blessures.", "lsgRef": "Psaume 147:3"},
  "Deuteronomy 31:6": {"bsb": "Be strong and courageous; do not be afraid or terrified of them, for it is the LORD your God who goes with you; He will never leave you nor forsake you.”", "web": "Be strong and courageous. Don’t be afraid or scared of them, for the LORD your God himself is who goes with you. He will not fail you nor forsake you.”", "lsg": "Fortifiez-vous et ayez du courage! Ne craignez point et ne soyez point effrayés devant eux; car l’Éternel, ton Dieu, marchera lui-même avec toi, il ne te délaissera point, il ne t’abandonnera point.", "lsgRef": "Deutéronome 31:6"},
  "Hebrews 13:5": {"bsb": "Keep your lives free from the love of money and be content with what you have, for God has said: “Never will I leave you, never will I forsake you.”", "web": "Be free from the love of money, content with such things as you have, for he has said, “I will in no way leave you, neither will I in any way forsake you.”", "lsg": "Ne vous livrez pas à l’amour de l’argent; contentez-vous de ce que vous avez; car Dieu lui-même a dit: Je ne te délaisserai point, et je ne t’abandonnerai point.", "lsgRef": "Hébreux 13:5"},
  "Matthew 28:20": {"bsb": "and teaching them to obey all that I have commanded you. And surely I am with you always, even to the end of the age.”", "web": "teaching them to observe all things that I commanded you. Behold, I am with you always, even to the end of the age.” Amen.", "lsg": "et enseignez-leur à observer tout ce que je vous ai prescrit. Et voici, je suis avec vous tous les jours, jusqu’à la fin du monde.", "lsgRef": "Matthieu 28:20"},
  "Matthew 11:28": {"bsb": "Come to Me, all you who are weary and burdened, and I will give you rest.", "web": "“Come to me, all you who labor and are heavily burdened, and I will give you rest.", "lsg": "Venez à moi, vous tous qui êtes fatigués et chargés, et je vous donnerai du repos.", "lsgRef": "Matthieu 11:28"},
  "Isaiah 40:31": {"bsb": "But those who wait upon the LORD will renew their strength; they will mount up with wings like eagles; they will run and not grow weary, they will walk and not faint.", "web": "but those who wait for the LORD will renew their strength. They will mount up with wings like eagles. They will run, and not be weary. They will walk, and not faint.", "lsg": "Mais ceux qui se confient en l’Éternel renouvellent leur force. Ils prennent le vol comme les aigles; Ils courent, et ne se lassent point, Ils marchent, et ne se fatiguent point.", "lsgRef": "Ésaïe 40:31"},
  "Galatians 6:9": {"bsb": "Let us not grow weary in well-doing, for in due time we will reap a harvest if we do not give up.", "web": "Let’s not be weary in doing good, for we will reap in due season if we don’t give up.", "lsg": "Ne nous lassons pas de faire le bien; car nous moissonnerons au temps convenable, si nous ne nous relâchons pas.", "lsgRef": "Galates 6:9"},
  "Philippians 4:13": {"bsb": "I can do all things through Christ who gives me strength.", "web": "I can do all things through Christ who strengthens me.", "lsg": "Je puis tout par celui qui me fortifie.", "lsgRef": "Philippiens 4:13"},
  "2 Corinthians 12:9": {"bsb": "But He said to me, “My grace is sufficient for you, for My power is perfected in weakness.” Therefore I will boast all the more gladly in my weaknesses, so that the power of Christ may rest on me.", "web": "He has said to me, “My grace is sufficient for you, for my power is made perfect in weakness.” Most gladly therefore I will rather glory in my weaknesses, that the power of Christ may rest on me.", "lsg": "et il m’a dit: Ma grâce te suffit, car ma puissance s’accomplit dans la faiblesse. Je me glorifierai donc bien plus volontiers de mes faiblesses, afin que la puissance de Christ repose sur moi.", "lsgRef": "2 Corinthiens 12:9"},
  "Psalm 46:1": {"bsb": "God is our refuge and strength, an ever-present help in times of trouble.", "web": "God is our refuge and strength, a very present help in trouble.", "lsg": "Dieu est pour nous un refuge et un appui, Un secours qui ne manque jamais dans la détresse.", "lsgRef": "Psaume 46:2"},
  "Proverbs 3:5-6": {"bsb": "Trust in the LORD with all your heart, and lean not on your own understanding; in all your ways acknowledge Him, and He will make your paths straight.", "web": "Trust in the LORD with all your heart, and don’t lean on your own understanding. In all your ways acknowledge him, and he will make your paths straight.", "lsg": "Confie-toi en l’Éternel de tout ton cœur, Et ne t’appuie pas sur ta sagesse; Reconnais-le dans toutes tes voies, Et il aplanira tes sentiers.", "lsgRef": "Proverbes 3:5-6"},
  "James 1:5": {"bsb": "Now if any of you lacks wisdom, he should ask God, who gives generously to all without finding fault, and it will be given to him.", "web": "But if any of you lacks wisdom, let him ask of God, who gives to all liberally and without reproach, and it will be given to him.", "lsg": "Si quelqu’un d’entre vous manque de sagesse, qu’il la demande à Dieu, qui donne à tous simplement et sans reproche, et elle lui sera donnée.", "lsgRef": "Jacques 1:5"},
  "Psalm 119:105": {"bsb": "Your word is a lamp to my feet and a light to my path.", "web": "Your word is a lamp to my feet, and a light for my path.", "lsg": "Ta parole est une lampe à mes pieds, Et une lumière sur mon sentier.", "lsgRef": "Psaume 119:105"},
  "Psalm 32:8": {"bsb": "I will instruct you and teach you the way you should go; I will give you counsel and watch over you.", "web": "I will instruct you and teach you in the way which you shall go. I will counsel you with my eye on you.", "lsg": "Je t’instruirai et te montrerai la voie que tu dois suivre; Je te conseillerai, j’aurai le regard sur toi.", "lsgRef": "Psaume 32:8"},
  "1 John 1:9": {"bsb": "If we confess our sins, He is faithful and just to forgive us our sins and to cleanse us from all unrighteousness.", "web": "If we confess our sins, he is faithful and righteous to forgive us the sins and to cleanse us from all unrighteousness.", "lsg": "Si nous confessons nos péchés, il est fidèle et juste pour nous les pardonner, et pour nous purifier de toute iniquité.", "lsgRef": "1 Jean 1:9"},
  "Romans 8:1": {"bsb": "Therefore, there is now no condemnation for those who are in Christ Jesus.", "web": "There is therefore now no condemnation to those who are in Christ Jesus, who don’t walk according to the flesh, but according to the Spirit.", "lsg": "Il n’y a donc maintenant aucune condamnation pour ceux qui sont en Jésus-Christ.", "lsgRef": "Romains 8:1"},
  "Psalm 103:12": {"bsb": "As far as the east is from the west, so far has He removed our transgressions from us.", "web": "As far as the east is from the west, so far has he removed our transgressions from us.", "lsg": "Autant l’orient est éloigné de l’occident, Autant il éloigne de nous nos transgressions.", "lsgRef": "Psaume 103:12"},
  "Isaiah 1:18": {"bsb": "“Come now, let us reason together,” says the LORD. “Though your sins are like scarlet, they will be as white as snow; though they are as red as crimson, they will become like wool.", "web": "“Come now, and let’s reason together,” says the LORD: “Though your sins are as scarlet, they shall be as white as snow. Though they are red like crimson, they shall be as wool.", "lsg": "Venez et plaidons! Dit l’Éternel. Si vos péchés sont comme le cramoisi, ils deviendront blancs comme la neige; S’ils sont rouges comme la pourpre, ils deviendront comme la laine.", "lsgRef": "Ésaïe 1:18"},
  "1 Corinthians 10:13": {"bsb": "No temptation has seized you except what is common to man. And God is faithful; He will not let you be tempted beyond what you can bear. But when you are tempted, He will also provide an escape, so that you can stand up under it.", "web": "No temptation has taken you except what is common to man. God is faithful, who will not allow you to be tempted above what you are able, but will with the temptation also make the way of escape, that you may be able to endure it.", "lsg": "Aucune tentation ne vous est survenue qui n’ait été humaine, et Dieu, qui est fidèle, ne permettra pas que vous soyez tentés au-delà de vos forces; mais avec la tentation il préparera aussi le moyen d’en sortir, afin que vous puissiez la supporter.", "lsgRef": "1 Corinthiens 10:13"},
  "James 4:7": {"bsb": "Submit yourselves, then, to God. Resist the devil, and he will flee from you.", "web": "Be subject therefore to God. Resist the devil, and he will flee from you.", "lsg": "Soumettez-vous donc à Dieu; résistez au diable, et il fuira loin de vous.", "lsgRef": "Jacques 4:7"},
  "1 Thessalonians 5:16-18": {"bsb": "Rejoice at all times. Pray without ceasing. Give thanks in every circumstance, for this is God’s will for you in Christ Jesus.", "web": "Always rejoice. Pray without ceasing. In everything give thanks, for this is the will of God in Christ Jesus toward you.", "lsg": "Soyez toujours joyeux. Priez sans cesse. Rendez grâces en toutes choses, car c’est à votre égard la volonté de Dieu en Jésus-Christ.", "lsgRef": "1 Thessaloniciens 5:16-18"},
  "Psalm 118:24": {"bsb": "This is the day that the LORD has made; we will rejoice and be glad in it.", "web": "This is the day that the LORD has made. We will rejoice and be glad in it!", "lsg": "C’est ici la journée que l’Éternel a faite: Qu’elle soit pour nous un sujet d’allégresse et de joie!", "lsgRef": "Psaume 118:24"},
  "Psalm 107:1": {"bsb": "Give thanks to the LORD, for He is good; His loving devotion endures forever.", "web": "Give thanks to the LORD, for he is good, for his loving kindness endures forever.", "lsg": "Louez l’Éternel, car il est bon, Car sa miséricorde dure à toujours!", "lsgRef": "Psaume 107:1"},
  "James 1:17": {"bsb": "Every good and perfect gift is from above, coming down from the Father of the heavenly lights, with whom there is no change or shifting shadow.", "web": "Every good gift and every perfect gift is from above, coming down from the Father of lights, with whom can be no variation nor turning shadow.", "lsg": "toute grâce excellente et tout don parfait descendent d’en haut, du Père des lumières, chez lequel il n’y a ni changement ni ombre de variation.", "lsgRef": "Jacques 1:17"},
  "Psalm 16:11": {"bsb": "You have made known to me the path of life; You will fill me with joy in Your presence, with eternal pleasures at Your right hand.", "web": "You will show me the path of life. In your presence is fullness of joy. In your right hand there are pleasures forever more.", "lsg": "Tu me feras connaître le sentier de la vie; Il y a d’abondantes joies devant ta face, Des délices éternelles à ta droite.", "lsgRef": "Psaume 16:11"},
  "Jeremiah 29:11": {"bsb": "For I know the plans I have for you, declares the LORD, plans to prosper you and not to harm you, to give you a future and a hope.", "web": "For I know the thoughts that I think toward you,” says the LORD, “thoughts of peace, and not of evil, to give you hope and a future.", "lsg": "Car je connais les projets que j’ai formés sur vous, dit l’Éternel, projets de paix et non de malheur, afin de vous donner un avenir et de l’espérance.", "lsgRef": "Jérémie 29:11"},
  "Romans 8:28": {"bsb": "And we know that God works all things together for the good of those who love Him, who are called according to His purpose.", "web": "We know that all things work together for good for those who love God, for those who are called according to his purpose.", "lsg": "Nous savons, du reste, que toutes choses concourent au bien de ceux qui aiment Dieu, de ceux qui sont appelés selon son dessein.", "lsgRef": "Romains 8:28"},
  "Romans 15:13": {"bsb": "Now may the God of hope fill you with all joy and peace as you believe in Him, so that you may overflow with hope by the power of the Holy Spirit.", "web": "Now may the God of hope fill you with all joy and peace in believing, that you may abound in hope in the power of the Holy Spirit.", "lsg": "Que le Dieu de l’espérance vous remplisse de toute joie et de toute paix dans la foi, pour que vous abondiez en espérance, par la puissance du Saint-Esprit!", "lsgRef": "Romains 15:13"},
  "Lamentations 3:22-23": {"bsb": "Because of the loving devotion of the LORD we are not consumed, for His mercies never fail. They are new every morning; great is Your faithfulness!", "web": "It is because of the LORD’s loving kindnesses that we are not consumed, because his mercies don’t fail. They are new every morning. Great is your faithfulness.", "lsg": "Les bontés de l’Éternel ne sont pas épuisées, Ses compassions ne sont pas à leur terme; Elles se renouvellent chaque matin. Oh! Que ta fidélité est grande!", "lsgRef": "Lamentations 3:22-23"},
  "Ephesians 4:26": {"bsb": "“Be angry, yet do not sin.” Do not let the sun set upon your anger,", "web": "“Be angry, and don’t sin.” Don’t let the sun go down on your wrath,", "lsg": "Si vous vous mettez en colère, ne péchez point; que le soleil ne se couche pas sur votre colère,", "lsgRef": "Éphésiens 4:26"},
  "James 1:19-20": {"bsb": "My beloved brothers, understand this: Everyone should be quick to listen, slow to speak, and slow to anger, for man’s anger does not bring about the righteousness that God desires.", "web": "So, then, my beloved brothers, let every man be swift to hear, slow to speak, and slow to anger; for the anger of man doesn’t produce the righteousness of God.", "lsg": "Sachez-le, mes frères bien-aimés. Ainsi, que tout homme soit prompt à écouter, lent à parler, lent à se mettre en colère; car la colère de l’homme n’accomplit pas la justice de Dieu.", "lsgRef": "Jacques 1:19-20"},
  "Proverbs 15:1": {"bsb": "A gentle answer turns away wrath, but a harsh word stirs up anger.", "web": "A gentle answer turns away wrath, but a harsh word stirs up anger.", "lsg": "Une réponse douce calme la fureur, Mais une parole dure excite la colère.", "lsgRef": "Proverbes 15:1"},

  "Jeremiah 17:14": {"bsb": "Heal me, O LORD, and I will be healed; save me, and I will be saved, for You are my praise.", "web": "Heal me, O LORD, and I will be healed. Save me, and I will be saved; for you are my praise.", "lsg": "Guéris-moi, Éternel, et je serai guéri; Sauve-moi, et je serai sauvé; Car tu es ma gloire.", "lsgRef": "Jérémie 17:14"},

  "Daniel 6:16": {"kjv": "Then the king commanded, and they brought Daniel, and cast him into the den of lions. Now the king spake and said unto Daniel, Thy God whom thou servest continually, he will deliver thee.", "bsb": "So the king gave the order, and they brought Daniel and threw him into the den of lions. The king said to Daniel, “May your God, whom you serve continually, deliver you!”", "web": "Then the king commanded, and they brought Daniel and cast him into the den of lions. The king spoke and said to Daniel, “Your God whom you serve continually, he will deliver you.”", "lsg": "Alors le roi donna l’ordre qu’on amenât Daniel, et qu’on le jetât dans la fosse aux lions. Le roi prit la parole et dit à Daniel: Puisse ton Dieu, que tu sers avec persévérance, te délivrer!", "lsgRef": "Daniel 6:16"},
  "Deuteronomy 3:11": {"kjv": "For only Og king of Bashan remained of the remnant of giants; behold, his bedstead was a bedstead of iron; is it not in Rabbath of the children of Ammon? nine cubits was the length thereof, and four cubits the breadth of it, after the cubit of a man.", "bsb": "(For only Og king of Bashan had remained of the remnant of the Rephaim. His bed of iron, nine cubits long and four cubits wide, is still in Rabbah of the Ammonites.)", "web": "(For only Og king of Bashan remained of the remnant of the Rephaim. Behold, his bedstead was a bedstead of iron. Isn’t it in Rabbah of the children of Ammon? Nine cubits was its length, and four cubits its width, after the cubit of a man.)", "lsg": "(Og, roi de Basan, était resté seul de la race des Rephaïm. Voici, son lit, un lit de fer, n’est-il pas à Rabbath, ville des enfants d’Ammon? Sa longueur est de neuf coudées, et sa largeur de quatre coudées, en coudées d’homme.)", "lsgRef": "Deutéronome 3:11"},
  "Esther 4:16": {"kjv": "Go, gather together all the Jews that are present in Shushan, and fast ye for me, and neither eat nor drink three days, night or day: I also and my maidens will fast likewise; and so will I go in unto the king, which is not according to the law: and if I perish, I perish.", "bsb": "“Go and assemble all the Jews who can be found in Susa, and fast for me. Do not eat or drink for three days, night or day, and I and my maidens will fast as you do. After that, I will go to the king, even though it is against the law. And if I perish, I perish!”", "web": "“Go, gather together all the Jews who are present in Susa, and fast for me, and neither eat nor drink three days, night or day. I and my maidens will also fast the same way. Then I will go in to the king, which is against the law; and if I perish, I perish.”", "lsg": "Va, rassemble tous les Juifs qui se trouvent à Suse, et jeûnez pour moi, sans manger ni boire pendant trois jours, ni la nuit ni le jour. Moi aussi, je jeûnerai de même avec mes servantes, puis j’entrerai chez le roi, malgré la loi; et si je dois périr, je périrai.", "lsgRef": "Esther 4:16"},
  "Exodus 14:21": {"kjv": "And Moses stretched out his hand over the sea; and the LORD caused the sea to go back by a strong east wind all that night, and made the sea dry land, and the waters were divided.", "bsb": "Then Moses stretched out his hand over the sea, and all that night the LORD drove back the sea with a strong east wind that turned it into dry land. So the waters were divided,", "web": "Moses stretched out his hand over the sea, and the LORD caused the sea to go back by a strong east wind all night, and made the sea dry land, and the waters were divided.", "lsg": "Moïse étendit sa main sur la mer. Et l’Éternel refoula la mer par un vent d’orient, qui souffla avec impétuosité toute la nuit; il mit la mer à sec, et les eaux se fendirent.", "lsgRef": "Exode 14:21"},
  "Exodus 19:20": {"kjv": "And the LORD came down upon mount Sinai, on the top of the mount: and the LORD called Moses up to the top of the mount; and Moses went up.", "bsb": "The LORD descended to the top of Mount Sinai and called Moses to the summit. So Moses went up,", "web": "The LORD came down on Mount Sinai, to the top of the mountain. The LORD called Moses to the top of the mountain, and Moses went up.", "lsg": "Ainsi l’Éternel descendit sur la montagne de Sinaï, sur le sommet de la montagne; l’Éternel appela Moïse sur le sommet de la montagne. Et Moïse monta.", "lsgRef": "Exode 19:20"},
  "Exodus 34:28": {"kjv": "And he was there with the LORD forty days and forty nights; he did neither eat bread, nor drink water. And he wrote upon the tables the words of the covenant, the ten commandments.", "bsb": "So Moses was there with the LORD forty days and forty nights without eating bread or drinking water. He wrote on the tablets the words of the covenant—the Ten Commandments.", "web": "He was there with the LORD forty days and forty nights; he neither ate bread, nor drank water. He wrote on the tablets the words of the covenant, the ten commandments.", "lsg": "Moïse fut là avec l’Éternel quarante jours et quarante nuits. Il ne mangea point de pain, et il ne but point d’eau. Et l’Éternel écrivit sur les tables les paroles de l’alliance, les dix paroles.", "lsgRef": "Exode 34:28"},
  "Exodus 4:14": {"kjv": "And the anger of the LORD was kindled against Moses, and he said, Is not Aaron the Levite thy brother? I know that he can speak well. And also, behold, he cometh forth to meet thee: and when he seeth thee, he will be glad in his heart.", "bsb": "Then the anger of the LORD burned against Moses, and He said, “Is not Aaron the Levite your brother? I know that he can speak well, and he is now on his way to meet you. When he sees you, he will be glad in his heart.", "web": "The LORD’s anger burned against Moses, and he said, “What about Aaron, your brother, the Levite? I know that he can speak well. Also, behold, he is coming out to meet you. When he sees you, he will be glad in his heart.", "lsg": "Alors la colère de l’Éternel s’enflamma contre Moïse, et il dit: N’y a t-il pas ton frère Aaron, le Lévite? Je sais qu’il parlera facilement. Le voici lui-même, qui vient au-devant de toi; et, quand il te verra, il se réjouira dans son cœur.", "lsgRef": "Exode 4:14"},
  "Exodus 5:2": {"kjv": "And Pharaoh said, Who is the LORD, that I should obey his voice to let Israel go? I know not the LORD, neither will I let Israel go.", "bsb": "But Pharaoh replied, “Who is the LORD that I should obey His voice and let Israel go? I do not know the LORD, and I will not let Israel go.”", "web": "Pharaoh said, “Who is the LORD, that I should listen to his voice to let Israel go? I don’t know the LORD, and moreover I will not let Israel go.”", "lsg": "Pharaon répondit: Qui est l’Éternel, pour que j’obéisse à sa voix, en laissant aller Israël? Je ne connais point l’Éternel, et je ne laisserai point aller Israël.", "lsgRef": "Exode 5:2"},
  "Genesis 13:12": {"kjv": "Abram dwelled in the land of Canaan, and Lot dwelled in the cities of the plain, and pitched his tent toward Sodom.", "bsb": "Abram lived in the land of Canaan, but Lot settled in the cities of the plain and pitched his tent toward Sodom.", "web": "Abram lived in the land of Canaan, and Lot lived in the cities of the plain, and moved his tent as far as Sodom.", "lsg": "Abram habita dans le pays de Canaan; et Lot habita dans les villes de la plaine, et dressa ses tentes jusqu’à Sodome.", "lsgRef": "Genèse 13:12"},
  "Genesis 14:18": {"kjv": "And Melchizedek king of Salem brought forth bread and wine: and he was the priest of the most high God.", "bsb": "Then Melchizedek king of Salem brought out bread and wine—since he was priest of God Most High—", "web": "Melchizedek king of Salem brought out bread and wine. He was priest of God Most High.", "lsg": "Melchisédek, roi de Salem, fit apporter du pain et du vin: il était sacrificateur du Dieu Très-Haut.", "lsgRef": "Genèse 14:18"},
  "Genesis 17:15": {"kjv": "And God said unto Abraham, As for Sarai thy wife, thou shalt not call her name Sarai, but Sarah shall her name be.", "bsb": "Then God said to Abraham, “As for Sarai your wife, do not call her Sarai, for her name is to be Sarah.", "web": "God said to Abraham, “As for Sarai your wife, you shall not call her name Sarai, but her name shall be Sarah.", "lsg": "Dieu dit à Abraham: Tu ne donneras plus à Saraï, ta femme, le nom de Saraï; mais son nom sera Sara.", "lsgRef": "Genèse 17:15"},
  "Genesis 1:1": {"kjv": "In the beginning God created the heaven and the earth.", "bsb": "In the beginning God created the heavens and the earth.", "web": "In the beginning, God created the heavens and the earth.", "lsg": "Au commencement, Dieu créa les cieux et la terre.", "lsgRef": "Genèse 1:1"},
  "Genesis 1:3": {"kjv": "And God said, Let there be light: and there was light.", "bsb": "And God said, “Let there be light,” and there was light.", "web": "God said, “Let there be light,” and there was light.", "lsg": "Dieu dit: Que la lumière soit! Et la lumière fut.", "lsgRef": "Genèse 1:3"},
  "Genesis 22:8": {"kjv": "And Abraham said, My son, God will provide himself a lamb for a burnt offering: so they went both of them together.", "bsb": "Abraham answered, “God Himself will provide the lamb for the burnt offering, my son.” And the two walked on together.", "web": "Abraham said, “God will provide himself the lamb for a burnt offering, my son.” So they both went together.", "lsg": "Abraham répondit: Mon fils, Dieu se pourvoira lui-même de l’agneau pour l’holocauste. Et ils marchèrent tous deux ensemble.", "lsgRef": "Genèse 22:8"},
  "Genesis 29:30": {"kjv": "And he went in also unto Rachel, and he loved also Rachel more than Leah, and served with him yet seven other years.", "bsb": "Jacob slept with Rachel as well, and indeed, he loved Rachel more than Leah. So he worked for Laban another seven years.", "web": "He went in also to Rachel, and he loved also Rachel more than Leah, and served with him seven more years.", "lsg": "Jacob alla aussi vers Rachel, qu’il aimait plus que Léa; et il servit encore chez Laban pendant sept nouvelles années.", "lsgRef": "Genèse 29:30"},
  "Genesis 2:8": {"kjv": "And the LORD God planted a garden eastward in Eden; and there he put the man whom he had formed.", "bsb": "And the LORD God planted a garden in Eden, in the east, where He placed the man He had formed.", "web": "The LORD God planted a garden eastward, in Eden, and there he put the man whom he had formed.", "lsg": "Puis l’Éternel Dieu planta un jardin en Éden, du côté de l’orient, et il y mit l’homme qu’il avait formé.", "lsgRef": "Genèse 2:8"},
  "Genesis 37:28": {"kjv": "Then there passed by Midianites merchantmen; and they drew and lifted up Joseph out of the pit, and sold Joseph to the Ishmeelites for twenty pieces of silver: and they brought Joseph into Egypt.", "bsb": "So when the Midianite traders passed by, his brothers pulled Joseph out of the pit and sold him for twenty shekels of silver to the Ishmaelites, who took him to Egypt.", "web": "Midianites who were merchants passed by, and they drew and lifted up Joseph out of the pit, and sold Joseph to the Ishmaelites for twenty pieces of silver. The merchants brought Joseph into Egypt.", "lsg": "Au passage des marchands madianites, ils tirèrent et firent remonter Joseph hors de la citerne; et ils le vendirent pour vingt sicles d’argent aux Ismaélites, qui l’emmenèrent en Égypte.", "lsgRef": "Genèse 37:28"},
  "Genesis 3:20": {"kjv": "And Adam called his wife’s name Eve; because she was the mother of all living.", "bsb": "And Adam named his wife Eve, because she would be the mother of all the living.", "web": "The man called his wife Eve because she would be the mother of all the living.", "lsg": "Adam donna à sa femme le nom d’Ève: car elle a été la mère de tous les vivants.", "lsgRef": "Genèse 3:20"},
  "Genesis 4:8": {"kjv": "And Cain talked with Abel his brother: and it came to pass, when they were in the field, that Cain rose up against Abel his brother, and slew him.", "bsb": "Then Cain said to his brother Abel, “Let us go out to the field.” And while they were in the field, Cain rose up against his brother Abel and killed him.", "web": "Cain said to Abel, his brother, “Let’s go into the field.” While they were in the field, Cain rose up against Abel, his brother, and killed him.", "lsg": "Cependant, Caïn adressa la parole à son frère Abel; mais, comme ils étaient dans les champs, Caïn se jeta sur son frère Abel, et le tua.", "lsgRef": "Genèse 4:8"},
  "Genesis 4:9": {"kjv": "And the LORD said unto Cain, Where is Abel thy brother? And he said, I know not: Am I my brother’s keeper?", "bsb": "And the LORD said to Cain, “Where is your brother Abel?” “I do not know!” he answered. “Am I my brother’s keeper?”", "web": "The LORD said to Cain, “Where is Abel, your brother?” He said, “I don’t know. Am I my brother’s keeper?”", "lsg": "L’Éternel dit à Caïn: Où est ton frère Abel? Il répondit: Je ne sais pas; suis-je le gardien de mon frère?", "lsgRef": "Genèse 4:9"},
  "Genesis 5:27": {"kjv": "And all the days of Methuselah were nine hundred sixty and nine years: and he died.", "bsb": "So Methuselah lived a total of 969 years, and then he died.", "web": "All the days of Methuselah were nine hundred sixty-nine years, then he died.", "lsg": "Tous les jours de Metuschélah furent de neuf cent soixante-neuf ans; puis il mourut.", "lsgRef": "Genèse 5:27"},
  "Genesis 7:12": {"kjv": "And the rain was upon the earth forty days and forty nights.", "bsb": "And the rain fell upon the earth for forty days and forty nights.", "web": "It rained on the earth forty days and forty nights.", "lsg": "La pluie tomba sur la terre quarante jours et quarante nuits.", "lsgRef": "Genèse 7:12"},
  "Hebrews 11:30": {"kjv": "By faith the walls of Jericho fell down, after they were compassed about seven days.", "bsb": "By faith the walls of Jericho fell, after the people had marched around them for seven days.", "web": "By faith the walls of Jericho fell down after they had been encircled for seven days.", "lsg": "C’est par la foi que les murailles de Jéricho tombèrent, après qu’on en eut fait le tour pendant sept jours.", "lsgRef": "Hébreux 11:30"},
  "Hebrews 11:7": {"kjv": "By faith Noah, being warned of God of things not seen as yet, moved with fear, prepared an ark to the saving of his house; by the which he condemned the world, and became heir of the righteousness which is by faith.", "bsb": "By faith Noah, when warned about things not yet seen, in godly fear built an ark to save his family. By faith he condemned the world and became heir of the righteousness that comes by faith.", "web": "By faith Noah, being warned about things not yet seen, moved with godly fear, prepared a ship for the saving of his house, through which he condemned the world and became heir of the righteousness which is according to faith.", "lsg": "C’est par la foi que Noé, divinement averti des choses qu’on ne voyait pas encore, et saisi d’une crainte respectueuse, construisit une arche pour sauver sa famille; c’est par elle qu’il condamna le monde, et devint héritier de la justice qui s’obtient par la foi.", "lsgRef": "Hébreux 11:7"},
  "Isaiah 6:8": {"kjv": "Also I heard the voice of the Lord, saying, Whom shall I send, and who will go for us? Then said I, Here am I; send me.", "bsb": "Then I heard the voice of the Lord saying: “Whom shall I send? Who will go for Us?” And I said: “Here am I. Send me!”", "web": "I heard the Lord’s voice, saying, “Whom shall I send, and who will go for us?” Then I said, “Here I am. Send me!”", "lsg": "J’entendis la voix du Seigneur, disant: Qui enverrai-je, et qui marchera pour nous? Je répondis: Me voici, envoie-moi.", "lsgRef": "Ésaïe 6:8"},
  "Job 1:21": {"kjv": "And said, Naked came I out of my mother’s womb, and naked shall I return thither: the LORD gave, and the LORD hath taken away; blessed be the name of the LORD.", "bsb": "saying: “Naked I came from my mother’s womb, and naked I will return. The LORD gave, and the LORD has taken away. Blessed be the name of the LORD.”", "web": "He said, “Naked I came out of my mother’s womb, and naked will I return there. The LORD gave, and the LORD has taken away. Blessed be the LORD’s name.”", "lsg": "et dit: Je suis sorti nu du sein de ma mère, et nu je retournerai dans le sein de la terre. L’Éternel a donné, et l’Éternel a ôté; que le nom de l’Éternel soit béni!", "lsgRef": "Job 1:21"},
  "John 11:25": {"kjv": "Jesus said unto her, I am the resurrection, and the life: he that believeth in me, though he were dead, yet shall he live:", "bsb": "Jesus said to her, “I am the resurrection and the life. Whoever believes in Me will live, even though he dies.", "web": "Jesus said to her, “I am the resurrection and the life. He who believes in me will still live, even if he dies.", "lsg": "Jésus lui dit: Je suis la résurrection et la vie. Celui qui croit en moi vivra, quand même il serait mort;", "lsgRef": "Jean 11:25"},
  "John 11:35": {"kjv": "Jesus wept.", "bsb": "Jesus wept.", "web": "Jesus wept.", "lsg": "Jésus pleura.", "lsgRef": "Jean 11:35"},
  "John 1:29": {"kjv": "The next day John seeth Jesus coming unto him, and saith, Behold the Lamb of God, which taketh away the sin of the world.", "bsb": "The next day John saw Jesus coming toward him and said, “Look, the Lamb of God, who takes away the sin of the world!", "web": "The next day, he saw Jesus coming to him, and said, “Behold, the Lamb of God, who takes away the sin of the world!", "lsg": "Le lendemain, il vit Jésus venant à lui, et il dit: Voici l’Agneau de Dieu, qui ôte le péché du monde.", "lsgRef": "Jean 1:29"},
  "John 20:24-25": {"kjv": "But Thomas, one of the twelve, called Didymus, was not with them when Jesus came. The other disciples therefore said unto him, We have seen the Lord. But he said unto them, Except I shall see in his hands the print of the nails, and put my finger into the print of the nails, and thrust my hand into his side, I will not believe.", "bsb": "Now Thomas called Didymus, one of the Twelve, was not with the disciples when Jesus came. So the other disciples told him, “We have seen the Lord!” But he replied, “Unless I see the nail marks in His hands, and put my finger where the nails have been, and put my hand into His side, I will never believe.”", "web": "But Thomas, one of the twelve, called Didymus, wasn’t with them when Jesus came. The other disciples therefore said to him, “We have seen the Lord!” But he said to them, “Unless I see in his hands the print of the nails, put my finger into the print of the nails, and put my hand into his side, I will not believe.”", "lsg": "Thomas, appelé Didyme, l’un des douze, n’était pas avec eux lorsque Jésus vint. Les autres disciples lui dirent donc: Nous avons vu le Seigneur. Mais il leur dit: Si je ne vois dans ses mains la marque des clous, et si je ne mets mon doigt dans la marque des clous, et si je ne mets ma main dans son côté, je ne croirai point.", "lsgRef": "Jean 20:24-25"},
  "John 20:28": {"kjv": "And Thomas answered and said unto him, My Lord and my God.", "bsb": "Thomas replied, “My Lord and my God!”", "web": "Thomas answered him, “My Lord and my God!”", "lsg": "Thomas lui répondit: Mon Seigneur et mon Dieu! Jésus lui dit:", "lsgRef": "Jean 20:28"},
  "John 2:9": {"kjv": "When the ruler of the feast had tasted the water that was made wine, and knew not whence it was: (but the servants which drew the water knew;) the governor of the feast called the bridegroom,", "bsb": "and the master of the banquet tasted the water that had been turned into wine. He did not know where it was from, but the servants who had drawn the water knew. Then he called the bridegroom aside", "web": "When the ruler of the feast tasted the water now become wine, and didn’t know where it came from (but the servants who had drawn the water knew), the ruler of the feast called the bridegroom", "lsg": "Quand l’ordonnateur du repas eut goûté l’eau changée en vin, ne sachant d’où venait ce vin, tandis que les serviteurs, qui avaient puisé l’eau, le savaient bien, il appela l’époux,", "lsgRef": "Jean 2:9"},
  "John 3:4": {"kjv": "Nicodemus saith unto him, How can a man be born when he is old? can he enter the second time into his mother’s womb, and be born?", "bsb": "“How can a man be born when he is old?” Nicodemus asked. “Can he enter his mother’s womb a second time to be born?”", "web": "Nicodemus said to him, “How can a man be born when he is old? Can he enter a second time into his mother’s womb and be born?”", "lsg": "Nicodème lui dit: Comment un homme peut-il naître quand il est vieux? Peut-il rentrer dans le sein de sa mère et naître?", "lsgRef": "Jean 3:4"},
  "Jonah 1:17": {"kjv": "Now the LORD had prepared a great fish to swallow up Jonah. And Jonah was in the belly of the fish three days and three nights.", "bsb": "Now the LORD had appointed a great fish to swallow Jonah, and Jonah spent three days and three nights in the belly of the fish.", "web": "The LORD prepared a huge fish to swallow up Jonah, and Jonah was in the belly of the fish three days and three nights.", "lsg": "L’Éternel fit venir un grand poisson pour engloutir Jonas, et Jonas fut dans le ventre du poisson trois jours et trois nuits.", "lsgRef": "Jonas 2:1"},
  "Joshua 24:15": {"kjv": "And if it seem evil unto you to serve the LORD, choose you this day whom ye will serve; whether the gods which your fathers served that were on the other side of the flood, or the gods of the Amorites, in whose land ye dwell: but as for me and my house, we will serve the LORD.", "bsb": "But if it is unpleasing in your sight to serve the LORD, then choose for yourselves this day whom you will serve, whether the gods your fathers served beyond the Euphrates, or the gods of the Amorites in whose land you are living. As for me and my house, we will serve the LORD!”", "web": "If it seems evil to you to serve the LORD, choose today whom you will serve; whether the gods which your fathers served that were beyond the River, or the gods of the Amorites, in whose land you dwell; but as for me and my house, we will serve the LORD.”", "lsg": "Et si vous ne trouvez pas bon de servir l’Éternel, choisissez aujourd’hui qui vous voulez servir, ou les dieux que servaient vos pères au-delà du fleuve, ou les dieux des Amoréens dans le pays desquels vous habitez. Moi et ma maison, nous servirons l’Éternel.", "lsgRef": "Josué 24:15"},
  "Judges 16:17": {"kjv": "That he told her all his heart, and said unto her, There hath not come a razor upon mine head; for I have been a Nazarite unto God from my mother’s womb: if I be shaven, then my strength will go from me, and I shall become weak, and be like any other man.", "bsb": "Samson told her all that was in his heart: “My hair has never been cut, because I have been a Nazirite to God from my mother’s womb. If I am shaved, my strength will leave me, and I will become as weak as any other man.”", "web": "He told her all his heart and said to her, “No razor has ever come on my head; for I have been a Nazirite to God from my mother’s womb. If I am shaved, then my strength will go from me and I will become weak, and be like any other man.”", "lsg": "il lui ouvrit tout son cœur, et lui dit: Le rasoir n’a point passé sur ma tête, parce que je suis consacré à Dieu dès le ventre de ma mère. Si j’étais rasé, ma force m’abandonnerait, je deviendrais faible, et je serais comme tout autre homme.", "lsgRef": "Juges 16:17"},
  "Judges 3:15": {"kjv": "But when the children of Israel cried unto the LORD, the LORD raised them up a deliverer, Ehud the son of Gera, a Benjamite, a man lefthanded: and by him the children of Israel sent a present unto Eglon the king of Moab.", "bsb": "And again they cried out to the LORD, and He raised up Ehud son of Gera, a left-handed Benjamite, as their deliverer. So they sent him with tribute to Eglon king of Moab.", "web": "But when the children of Israel cried to the LORD, the LORD raised up a savior for them: Ehud the son of Gera, the Benjamite, a left-handed man. The children of Israel sent tribute by him to Eglon the king of Moab.", "lsg": "Les enfants d’Israël crièrent à l’Éternel, et l’Éternel leur suscita un libérateur, Éhud, fils de Guéra, Benjamite, qui ne se servait pas de la main droite. Les enfants d’Israël envoyèrent par lui un présent à Églon, roi de Moab.", "lsgRef": "Juges 3:15"},
  "Luke 19:4-5": {"kjv": "And he ran before, and climbed up into a sycomore tree to see him: for he was to pass that way. And when Jesus came to the place, he looked up, and saw him, and said unto him, Zaccheus, make haste, and come down; for to day I must abide at thy house.", "bsb": "So he ran on ahead and climbed a sycamore tree to see Him, since Jesus was about to pass that way. When Jesus came to that place, He looked up and said, “Zacchaeus, hurry down, for I must stay at your house today.”", "web": "He ran on ahead and climbed up into a sycamore tree to see him, for he was going to pass that way. When Jesus came to the place, he looked up and saw him, and said to him, “Zacchaeus, hurry and come down, for today I must stay at your house.”", "lsg": "Il courut en avant, et monta sur un sycomore pour le voir, parce qu’il devait passer par là. Lorsque Jésus fut arrivé à cet endroit, il leva les yeux et lui dit: Zachée, hâte-toi de descendre; car il faut que je demeure aujourd’hui dans ta maison.", "lsgRef": "Luc 19:4-5"},
  "Luke 1:13": {"kjv": "But the angel said unto him, Fear not, Zacharias: for thy prayer is heard; and thy wife Elisabeth shall bear thee a son, and thou shalt call his name John.", "bsb": "But the angel said to him, “Do not be afraid, Zechariah, because your prayer has been heard. Your wife Elizabeth will bear you a son, and you are to give him the name John.", "web": "But the angel said to him, “Don’t be afraid, Zacharias, because your request has been heard. Your wife, Elizabeth, will bear you a son, and you shall call his name John.", "lsg": "Mais l’ange lui dit: Ne crains point, Zacharie; car ta prière a été exaucée. Ta femme Élisabeth t’enfantera un fils, et tu lui donneras le nom de Jean.", "lsgRef": "Luc 1:13"},
  "Luke 1:30-31": {"kjv": "And the angel said unto her, Fear not, Mary: for thou hast found favour with God. And, behold, thou shalt conceive in thy womb, and bring forth a son, and shalt call his name JESUS.", "bsb": "So the angel told her, “Do not be afraid, Mary, for you have found favor with God. Behold, you will conceive and give birth to a son, and you are to give Him the name Jesus.", "web": "The angel said to her, “Don’t be afraid, Mary, for you have found favor with God. Behold, you will conceive in your womb and give birth to a son, and shall name him ‘Jesus.’", "lsg": "L’ange lui dit: Ne crains point, Marie; car tu as trouvé grâce devant Dieu. Et voici, tu deviendras enceinte, et tu enfanteras un fils, et tu lui donneras le nom de Jésus.", "lsgRef": "Luc 1:30-31"},
  "Luke 1:38": {"kjv": "And Mary said, Behold the handmaid of the Lord; be it unto me according to thy word. And the angel departed from her.", "bsb": "“I am the Lord’s servant,” Mary answered. “May it happen to me according to your word.” Then the angel left her.", "web": "Mary said, “Behold, the servant of the Lord; let it be done to me according to your word.” Then the angel departed from her.", "lsg": "Marie dit: Je suis la servante du Seigneur; qu’il me soit fait selon ta parole! Et l’ange la quitta.", "lsgRef": "Luc 1:38"},
  "Luke 22:61": {"kjv": "And the Lord turned, and looked upon Peter. And Peter remembered the word of the Lord, how he had said unto him, Before the cock crow, thou shalt deny me thrice.", "bsb": "And the Lord turned and looked at Peter. Then Peter remembered the word that the Lord had spoken to him: “Before the rooster crows today, you will deny Me three times.”", "web": "The Lord turned and looked at Peter. Then Peter remembered the Lord’s word, how he said to him, “Before the rooster crows you will deny me three times.”", "lsg": "Le Seigneur, s’étant retourné, regarda Pierre. Et Pierre se souvint de la parole que le Seigneur lui avait dite: Avant que le coq chante aujourd’hui, tu me renieras trois fois.", "lsgRef": "Luc 22:61"},
  "Luke 23:42": {"kjv": "And he said unto Jesus, Lord, remember me when thou comest into thy kingdom.", "bsb": "Then he said, “Jesus, remember me when You come into Your kingdom!”", "web": "He said to Jesus, “Lord, remember me when you come into your Kingdom.”", "lsg": "Et il dit à Jésus: Souviens-toi de moi, quand tu viendras dans ton règne.", "lsgRef": "Luc 23:42"},
  "Luke 2:10": {"kjv": "And the angel said unto them, Fear not: for, behold, I bring you good tidings of great joy, which shall be to all people.", "bsb": "But the angel said to them, “Do not be afraid! For behold, I bring you good news of great joy that will be for all the people:", "web": "The angel said to them, “Don’t be afraid, for behold, I bring you good news of great joy which will be to all the people.", "lsg": "Mais l’ange leur dit: Ne craignez point; car je vous annonce une bonne nouvelle, qui sera pour tout le peuple le sujet d’une grande joie:", "lsgRef": "Luc 2:10"},
  "Luke 6:13": {"kjv": "And when it was day, he called unto him his disciples: and of them he chose twelve, whom also he named apostles;", "bsb": "When daylight came, He called His disciples to Him and chose twelve of them, whom He also designated as apostles:", "web": "When it was day, he called his disciples, and from them he chose twelve, whom he also named apostles:", "lsg": "Quand le jour parut, il appela ses disciples, et il en choisit douze, auxquels il donna le nom d’apôtres:", "lsgRef": "Luc 6:13"},
  "Mark 1:9": {"kjv": "And it came to pass in those days, that Jesus came from Nazareth of Galilee, and was baptized of John in Jordan.", "bsb": "In those days Jesus came from Nazareth in Galilee and was baptized by John in the Jordan.", "web": "In those days, Jesus came from Nazareth of Galilee, and was baptized by John in the Jordan.", "lsg": "En ce temps-là, Jésus vint de Nazareth en Galilée, et il fut baptisé par Jean dans le Jourdain.", "lsgRef": "Marc 1:9"},
  "Matthew 14:17": {"kjv": "And they say unto him, We have here but five loaves, and two fishes.", "bsb": "“We have here only five loaves of bread and two fish,” they answered.", "web": "They told him, “We only have here five loaves and two fish.”", "lsg": "Mais ils lui dirent: Nous n’avons ici que cinq pains et deux poissons.", "lsgRef": "Matthieu 14:17"},
  "Matthew 14:29": {"kjv": "And he said, Come. And when Peter was come down out of the ship, he walked on the water, to go to Jesus.", "bsb": "“Come,” said Jesus. Then Peter got down out of the boat, walked on the water, and came toward Jesus.", "web": "He said, “Come!” Peter stepped down from the boat and walked on the waters to come to Jesus.", "lsg": "Et il dit: Viens! Pierre sortit de la barque, et marcha sur les eaux, pour aller vers Jésus.", "lsgRef": "Matthieu 14:29"},

  "Matthew 1:16": {"kjv": "And Jacob begat Joseph the husband of Mary, of whom was born Jesus, who is called Christ.", "bsb": "and Jacob the father of Joseph, the husband of Mary, of whom was born Jesus, who is called Christ.", "web": "Jacob became the father of Joseph, the husband of Mary, from whom was born Jesus, who is called Christ.", "lsg": "Jacob engendra Joseph, l’époux de Marie, de laquelle est né Jésus, qui est appelé Christ.", "lsgRef": "Matthieu 1:16"},
  "Matthew 26:14-15": {"kjv": "Then one of the twelve, called Judas Iscariot, went unto the chief priests, And said unto them, What will ye give me, and I will deliver him unto you? And they covenanted with him for thirty pieces of silver.", "bsb": "Then one of the Twelve, the one called Judas Iscariot, went to the chief priests and asked, “What are you willing to give me if I hand Him over to you?” And they set out for him thirty pieces of silver.", "web": "Then one of the twelve, who was called Judas Iscariot, went to the chief priests and said, “What are you willing to give me if I deliver him to you?” So they weighed out for him thirty pieces of silver.", "lsg": "Alors l’un des douze, appelé Judas Iscariot, alla vers les principaux sacrificateurs, et dit: Que voulez-vous me donner, et je vous le livrerai? Et ils lui payèrent trente pièces d’argent.", "lsgRef": "Matthieu 26:14-15"},
